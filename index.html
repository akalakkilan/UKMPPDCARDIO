<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Kardiovaskular — Bank Soal UKMPPD</title>
<style>
:root{
 --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --surface:#F0EFED;
 --border:#E6E5E3; --blue:#2783DE; --blue-bg:#E5F2FC; --green:#46A171; --green-bg:#E8F1EC;
 --orange:#D5803B; --orange-bg:#FBEBDE; --red:#E56458; --red-bg:#FCE9E7;
 --radius:8px;
}
@media (prefers-color-scheme: dark){
:root{
 --text:#EDECEA; --text2:#9B9895; --canvas:#191919; --soft:#202020; --surface:#252525;
 --border:#333331; --blue:#5E9FE8; --blue-bg:#1B2B3C; --green:#5FB183; --green-bg:#1C2B23;
 --orange:#DE9257; --orange-bg:#33251A; --red:#EB7C71; --red-bg:#331F1E;
}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
 background:var(--soft); color:var(--text); line-height:1.6; font-size:15px;
 -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- Header ---------- */
header{
 position:sticky; top:0; z-index:50; background:var(--canvas);
 border-bottom:1px solid var(--border);
}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.dot{width:28px;height:28px;border-radius:8px;background:var(--blue);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.brand h1{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:12px;color:var(--text2);white-space:nowrap}
.timer{
 font-variant-numeric:tabular-nums; font-weight:650; font-size:16px;
 background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
 padding:6px 12px; letter-spacing:.02em;
}
.timer.warn{background:var(--orange-bg);color:var(--orange);border-color:transparent}
.timer.crit{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn{
 border:1px solid var(--border); background:var(--canvas); border-radius:var(--radius);
 padding:6px 14px; font-size:13px; font-weight:550; transition:.15s;
}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent}
.btn.primary:hover{opacity:.9;background:var(--blue)}
.btn.ghost{border-color:transparent;color:var(--text2)}
.btn.ghost:hover{color:var(--text)}

/* ---------- Layout ---------- */
.layout{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 268px;gap:24px;align-items:start}
.card{background:var(--canvas);border:1px solid var(--border);border-radius:12px}

/* ---------- Question ---------- */
.qhead{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-size:13px;font-weight:650}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface);color:var(--text2);letter-spacing:.01em}
.chip.topic{background:var(--blue-bg);color:var(--blue)}
.flagbtn{margin-left:auto;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:99px;padding:4px 12px;color:var(--text2)}
.flagbtn.on{background:var(--orange-bg);color:var(--orange);border-color:transparent}
.qbody{padding:24px}
.vignette{font-size:15.5px;line-height:1.7;margin-bottom:20px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
 display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
 border:1px solid var(--border); background:var(--canvas); border-radius:var(--radius);
 padding:12px 14px; transition:.12s;
}
.opt:hover{background:var(--soft);border-color:var(--text2)}
.opt .lbl{
 flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface);
 display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--text2)
}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.sel .lbl{background:var(--blue);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .lbl{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .lbl{background:var(--red);color:#fff}
.opt .rat{display:block;font-size:12.5px;color:var(--text2);margin-top:5px;line-height:1.55}

/* ---------- Explanation ---------- */
.exp{margin-top:20px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.exp .eh{background:var(--surface);padding:10px 14px;font-size:12px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--text2)}
.exp .eb{padding:14px}
.kv{display:flex;gap:8px;font-size:13.5px;margin-bottom:8px;flex-wrap:wrap}
.kv b{font-weight:650}
.kv .val{color:var(--green);font-weight:600}
.exp p{font-size:14px;line-height:1.65}

.qfoot{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.qfoot .sp{margin-left:auto}

/* ---------- Sidebar ---------- */
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:16px}
.sbox{padding:16px}
.sbox h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:12px;font-weight:650}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:300px;overflow-y:auto}
.gitem{
 aspect-ratio:1;border:1px solid var(--border);border-radius:6px;font-size:11.5px;font-weight:600;
 display:grid;place-items:center;position:relative;color:var(--text2);transition:.1s
}
.gitem:hover{border-color:var(--text2)}
.gitem.answered{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.gitem.cur{outline:2px solid var(--blue);outline-offset:1px}
.gitem.flag::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.gitem.right{background:var(--green-bg);color:var(--green);border-color:transparent}
.gitem.false{background:var(--red-bg);color:var(--red);border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.stat b{font-weight:650}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.tog{width:38px;height:22px;border-radius:99px;background:var(--surface);border:1px solid var(--border);position:relative;flex:none;transition:.15s}
.tog i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text2);transition:.15s}
.tog.on{background:var(--blue);border-color:transparent}
.tog.on i{left:18px;background:#fff}

/* ---------- Modal / result ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;z-index:100}
.modal{background:var(--canvas);border-radius:12px;max-width:460px;width:100%;padding:24px;border:1px solid var(--border)}
.modal h2{font-size:18px;margin-bottom:8px;letter-spacing:-.01em}
.modal p{font-size:14px;color:var(--text2);margin-bottom:20px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.score{display:flex;gap:12px;margin:20px 0}
.scard{flex:1;background:var(--soft);border-radius:var(--radius);padding:12px;text-align:center}
.scard b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.scard span{font-size:11.5px;color:var(--text2)}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;text-align:center;line-height:1.1}
.bigsub{text-align:center;font-size:13px;color:var(--text2);margin-top:4px}
.hidden{display:none !important}
.review-note{background:var(--blue-bg);color:var(--blue);border-radius:var(--radius);padding:10px 14px;font-size:13px;font-weight:550;margin-bottom:16px}
.topictable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.topictable td{padding:5px 0;border-bottom:1px solid var(--border)}
.topictable td:last-child{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}

@media (max-width:900px){
 .layout{grid-template-columns:1fr;padding:16px}
 .side{position:static;order:1}
 .grid{grid-template-columns:repeat(10,1fr);max-height:150px}
 .hwrap{padding:10px 16px;gap:10px}
 .brand p{display:none}
 .qbody{padding:18px}
 .qhead,.qfoot{padding:14px 18px}
}
@media (max-width:420px){
 .grid{grid-template-columns:repeat(7,1fr)}
 .btn{padding:6px 10px;font-size:12.5px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS = [
{t:"Gagal Jantung",s:"3B",q:"Tuan A usia 60 tahun dibawa ke IGD dengan sesak sejak 3 hari, memberat 3 jam terakhir. Ia memiliki riwayat pengobatan candesartan, bisoprolol, dan furosemide, namun tidak rutin kontrol. Pemeriksaan fisik: TD 150/100 mmHg, N 120x/menit, RR 28x/menit, SpO2 92%, T 36,5 C. Auskultasi paru ronki (+/+), wheezing (+/+), distensi vena jugularis (+), edema perifer (+/+). Apakah diagnosis pasien ini?",o:[["Acute lung oedema","Edema paru akut adalah manifestasi kongesti paru, tetapi pada pasien ini kongesti sistemik (JVP naik, edema perifer) juga menonjol dan sudah ada diagnosis gagal jantung sebelumnya, sehingga istilah yang tepat adalah dekompensasi akut."],["Acute decompensated heart failure","BENAR. Terdapat riwayat gagal jantung kronik dengan terapi standar yang tidak rutin, lalu muncul perburukan akut berupa kongesti paru dan sistemik. Inilah definisi ADHF."],["Acute cor pulmonale","Cor pulmonale akut umumnya dipicu emboli paru masif dengan gagal jantung kanan mendadak tanpa riwayat terapi gagal jantung kiri seperti ini."],["Shock kardiogenik","Syok kardiogenik mensyaratkan hipoperfusi dan hipotensi (TDS umumnya <90 mmHg), sedangkan pasien justru hipertensif."],["Acute de novo heart failure","De novo berarti episode gagal jantung pertama kali tanpa riwayat sebelumnya, sedangkan pasien sudah lama mendapat candesartan, bisoprolol, dan furosemide."]],a:1,e:"ADHF adalah perburukan akut pada pasien gagal jantung kronik, tersering karena ketidakpatuhan obat. Profil pasien ini wet and warm sehingga terapi utama adalah diuretik loop intravena dan vasodilator. Dokter umum wajib mengenali dan menstabilkan sebelum merujuk."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Pasien laki-laki 35 tahun datang ke poli jantung karena nyeri dada setiap bangun untuk sholat subuh. Nyeri timbul saat istirahat dan berkurang setelah mengonsumsi ISDN yang diresepkan dokter sebelumnya. Apakah patofisiologi penyakit tersebut?",o:[["Oklusi total akibat plak aterosklerosis pada arteri koroner","Oklusi total menimbulkan STEMI dengan nyeri persisten dan elevasi segmen ST menetap, bukan nyeri episodik yang hilang dengan nitrat."],["Ruptur fibrous cap pada plak aterosklerosis arteri koroner","Ruptur plak adalah mekanisme sindrom koroner akut, ditandai nyeri progresif dan peningkatan biomarka jantung."],["Spasme pembuluh darah koroner","BENAR. Nyeri dada saat istirahat pada dini hari, usia muda, dan responsif nitrat adalah gambaran klasik angina Prinzmetal akibat vasospasme koroner."],["Trombosis mural pada arteri koroner","Trombosis mural menimbulkan iskemia progresif menetap, bukan serangan sirkadian yang reversibel sempurna."],["Inflamasi dinding arteri koroner","Arteritis koroner sangat jarang dan biasanya menyertai penyakit sistemik seperti Kawasaki atau Takayasu."]],a:2,e:"Angina varian Prinzmetal disebabkan spasme otot polos koroner, khas terjadi tengah malam sampai dini hari. Terapi adalah calcium channel blocker dan nitrat, sedangkan beta blocker nonselektif justru dapat memperberat spasme."},
{t:"Penyakit Katup",s:"2",q:"Seorang laki-laki 30 tahun diperiksa dokter muda. Rekam medis menunjukkan pasien memiliki gangguan katup jantung berupa regurgitasi mitral. Apakah tanda yang ditemukan pada auskultasi jantung pasien?",o:[["Murmur sistolik di ICS V midklavikula sinistra","BENAR. Regurgitasi mitral menghasilkan murmur holosistolik di apeks (ICS V linea midklavikularis sinistra) yang menjalar ke aksila."],["Murmur diastolik di apeks jantung","Murmur diastolik di apeks adalah ciri stenosis mitral, bukan regurgitasi."],["Murmur diastolik di ICS II parasternal sinistra","Lokasi ini adalah area pulmonal, murmur diastolik di sini menandakan regurgitasi pulmonal."],["Murmur diastolik di ICS II parasternal dekstra","Area aorta dengan murmur diastolik menandakan regurgitasi aorta."],["Murmur sistolik di ICS IV parasternal sinistra","Lokasi ini adalah area trikuspid, murmur sistolik di sini mengarah ke regurgitasi trikuspid."]],a:0,e:"Peta auskultasi katup wajib dikuasai dokter umum: aorta ICS II kanan, pulmonal ICS II kiri, trikuspid ICS IV parasternal kiri, mitral ICS V midklavikula kiri. Regurgitasi mitral memberi murmur holosistolik apeks yang menjalar ke aksila."},
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Hasil EKG seorang pasien medical checkup menunjukkan durasi QRS lebih dari 120 ms dan pemanjangan waktu gelombang puncak R lebih dari 60 ms di sadapan V5, disertai kompleks QRS berlekuk di V5 sampai V6 dan pola rS di V1. Apakah kesimpulan EKG tersebut?",o:[["Right bundle branch block","RBBB memberi pola rsR aksen di V1 sampai V2 dengan gelombang S lebar di I dan V6, bukan pola ini."],["Left bundle branch block","BENAR. QRS lebar lebih dari 120 ms dengan pemanjangan R peak time di V5 sampai V6 dan pola rS atau QS di V1 adalah kriteria LBBB."],["Right ventricular hypertrophy","RVH ditandai deviasi aksis kanan dan rasio R/S di V1 lebih dari 1 dengan QRS yang tetap sempit."],["Left ventricular hypertrophy","LVH dinilai dengan kriteria voltase Sokolow-Lyon dan tidak menyebabkan QRS melebar sampai lebih dari 120 ms."],["Right atrial hypertrophy","Pembesaran atrium kanan tampak sebagai P pulmonal tinggi lancip lebih dari 2,5 mm di lead II, tidak mengubah durasi QRS."]],a:1,e:"LBBB baru pada pasien nyeri dada setara STEMI dan menjadi indikasi reperfusi. Kriteria: QRS lebih dari 120 ms, R peak time V5 sampai V6 lebih dari 60 ms, tidak ada gelombang Q septal di I, V5, V6."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 50 tahun datang ke IGD dengan demam dan nyeri kepala sejak hari ini. Ia memiliki riwayat jantung bocor sejak 2 tahun dan rutin berobat. Pemeriksaan fisik: TD 70/50 mmHg, N 110x/menit, T 39,5 C, RR 24x/menit, SpO2 97%, murmur diastolik di ICS II parasternal dekstra, akral dingin, edema (-/-). Sudah diberikan resusitasi cairan adekuat tetapi tekanan darah belum membaik. Apakah terapi yang diberikan dokter tersebut?",o:[["Dobutamine","Dobutamin adalah inotropik untuk curah jantung rendah, bukan pilihan pertama pada syok akibat infeksi yang tidak respons cairan."],["Furosemide","Diuretik justru memperburuk hipotensi karena mengurangi preload pada pasien yang sudah hipoperfusi."],["Norepinephrine","BENAR. Pada syok septik yang tetap hipotensif setelah resusitasi cairan, vasopresor lini pertama adalah norepinefrin."],["Digoxin","Digoksin untuk kontrol laju pada fibrilasi atrium atau gagal jantung, tidak menaikkan tekanan darah pada syok."],["Dopamine","Dopamin meningkatkan risiko takiaritmia dan mortalitas dibanding norepinefrin pada syok berdasarkan studi SOAP II."]],a:2,e:"Demam tinggi, hipotensi, dan murmur pada pasien penyakit katup mengarah ke endokarditis infektif dengan syok septik. Setelah kultur darah dan antibiotik empiris, vasopresor pilihan adalah norepinefrin dengan target MAP 65 mmHg."},
{t:"Penyakit Jantung Kongenital",s:"2",q:"Anak laki-laki 9 tahun diantar ibunya ke poli anak karena demam sejak 3 hari disertai batuk dan sesak napas. Ibu mengeluh anak sering mengalami keluhan serupa. Pemeriksaan fisik menunjukkan gizi kurang dan perawakan lebih kecil dibanding anak seusianya. Auskultasi ditemukan wide fixed split S2 tanpa murmur bermakna. Apakah etiologi kasus tersebut?",o:[["Infeksi","Infeksi menjelaskan demam saat ini, tetapi tidak menjelaskan wide fixed splitting S2 dan gagal tumbuh kronik."],["Autoimun","Penyakit autoimun seperti demam rematik memberi murmur regurgitasi dan poliartritis migran, bukan fixed splitting."],["Kongenital","BENAR. Wide fixed splitting S2 adalah tanda khas defek septum atrium, suatu kelainan jantung bawaan yang menyebabkan infeksi respiratorik berulang dan gagal tumbuh."],["Trauma","Tidak ada riwayat trauma dan trauma tidak menghasilkan pola splitting S2 yang menetap."],["Metabolik","Penyakit metabolik memberi kardiomiopati, bukan pemisahan bunyi jantung kedua yang tidak berubah dengan respirasi."]],a:2,e:"ASD menyebabkan pirau kiri ke kanan sehingga volume ventrikel kanan meningkat dan katup pulmonal menutup terlambat secara tetap. Konsekuensinya adalah infeksi paru berulang, gagal tumbuh, dan risiko hipertensi pulmonal."},
{t:"Hipertensi",s:"4A",q:"Laki-laki 30 tahun datang ke puskesmas untuk kontrol karena pada pemeriksaan 2 minggu sebelumnya tekanan darahnya 150/90 mmHg. Kedua orang tua menderita hipertensi. Tidak ada riwayat penyakit lain. Pemeriksaan saat ini TD 170/90 mmHg, HR 80x/menit, SpO2 98%, RR 18x/menit, pemeriksaan lain dalam batas normal. Apakah tindakan yang paling tepat?",o:[["Edukasi gaya hidup dan monitor tekanan darah selama 3 bulan","Observasi tanpa obat hanya tepat untuk tekanan darah normal tinggi atau hipertensi derajat 1 risiko rendah."],["Mulai pengobatan antihipertensi dengan satu obat","Monoterapi umumnya untuk hipertensi derajat 1, pasien usia sangat tua, atau pasien frail."],["Meminta pasien istirahat sejenak dan mengukur ulang 30 menit kemudian","Pengulangan pengukuran memang baik, tetapi diagnosis sudah tegak dari dua kunjungan terpisah sehingga tidak boleh menunda terapi."],["Mulai pengobatan antihipertensi dengan dua obat","BENAR. Tekanan darah 170/90 mmHg pada dua kunjungan adalah hipertensi derajat 2, dan pedoman merekomendasikan terapi awal kombinasi dua obat, idealnya dalam satu pil kombinasi."],["Ulangi pemeriksaan karena diagnosis hipertensi belum tegak","Diagnosis hipertensi ditegakkan dari dua kali pengukuran pada dua kunjungan berbeda, dan syarat itu sudah terpenuhi."]],a:3,e:"Pedoman ESC dan Perhimpunan Hipertensi Indonesia merekomendasikan memulai terapi kombinasi dosis rendah dua obat, misalnya ACE inhibitor atau ARB dengan CCB, pada hipertensi derajat 2 karena mempercepat kontrol tekanan darah dan meningkatkan kepatuhan."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 25 tahun datang ke IGD karena demam sejak 2 minggu disertai bengkak kaki dan tangan. Keluhan disertai perdarahan subkonjungtiva dan perdarahan di bawah kuku. Pasien memiliki riwayat penggantian katup jantung dan tidak rutin mengonsumsi obat. Pemeriksaan fisik: TD 120/80 mmHg, HR 110x/menit, RR 24x/menit, T 39,0 C, murmur diastolik di ICS V midklavikula sinistra. Apakah kemungkinan diagnosisnya?",o:[["Penyakit jantung rematik","PJR adalah gejala sisa kronik demam rematik tanpa demam tinggi akut dan tanpa fenomena emboli seperti splinter hemorrhage."],["Acute rheumatic fever","Demam rematik akut memerlukan kriteria Jones dengan riwayat faringitis streptokokus dan poliartritis migran, bukan katup prostetik."],["Infective endocarditis","BENAR. Katup prostetik, demam lebih dari 1 minggu, murmur baru, dan fenomena vaskular berupa splinter hemorrhage serta perdarahan konjungtiva memenuhi kriteria Duke."],["Pericarditis","Perikarditis memberi nyeri dada pleuritik, friction rub, dan elevasi ST difus tanpa fenomena emboli perifer."],["Sekuele demam rematik akut","Sekuele bersifat kronik dan tidak disertai demam tinggi maupun tanda emboli sistemik."]],a:2,e:"Pasien dengan katup prostetik dan demam harus dianggap endokarditis infektif sampai terbukti sebaliknya. Langkah dokter umum adalah tiga set kultur darah sebelum antibiotik, ekokardiografi, dan rujukan segera."},
{t:"Aritmia",s:"—",st:"Kompetensi interpretasi EKG",q:"Pasien laki-laki 44 tahun datang ke IGD dengan berdebar dan rasa tidak nyaman pada dada. TD 120/80 mmHg, RR 20x/menit, T 36 C. EKG menunjukkan setiap satu kompleks sinus normal selalu diikuti satu kompleks QRS lebar lebih dari 120 ms tanpa gelombang P yang mendahului, berulang teratur di sepanjang rekaman. Apakah gambaran EKG tersebut?",o:[["PVC couplet","Couplet berarti dua kompleks ventrikel prematur berurutan, sedangkan pada pasien ini kompleks lebar selalu berselang seling dengan sinus."],["PVC bigemini","BENAR. Pola satu denyut sinus diikuti satu denyut ventrikel prematur secara berulang disebut bigemini ventrikel."],["PAC triplet","Kompleks atrial prematur memberikan QRS sempit yang didahului gelombang P prematur berbeda morfologi."],["PAC trigemini","Selain QRS-nya sempit, trigemini berarti setiap dua denyut sinus diikuti satu denyut prematur."],["PVC R-on-T","Fenomena R on T berarti kompleks prematur jatuh di puncak gelombang T sebelumnya dan berisiko mencetuskan takikardia ventrikel."]],a:1,e:"PVC bigemini pada pasien tanpa penyakit jantung struktural umumnya jinak. Evaluasi mencakup elektrolit, tiroid, konsumsi kafein, dan Holter bila sering. Terapi beta blocker diberikan bila simtomatik."},
{t:"Vaskular Perifer",s:"3B",q:"Pasien laki-laki 60 tahun dilarikan ke IGD karena penurunan kesadaran mendadak di rumah. Sebelumnya diketahui terdapat massa berdenyut di perut. Pasien memiliki riwayat hipertensi tidak terkontrol. Pemeriksaan fisik TD 60 per palpasi dan HR 130x/menit. Apakah kondisi yang mendasari kejadian tersebut?",o:[["Arteriovenous malformation","Malformasi arteriovena umumnya intrakranial atau perifer dan tidak memberi massa abdomen pulsatil."],["Aneurisma aorta abdominalis","BENAR. Massa abdomen berdenyut pada pasien hipertensi disertai syok mendadak adalah gambaran ruptur aneurisma aorta abdominalis."],["Diseksi aorta","Diseksi khas memberi nyeri dada atau punggung yang merobek dengan perbedaan tekanan darah antar lengan, bukan massa abdomen pulsatil."],["Giant cell arteritis","Arteritis sel raksasa mengenai arteri temporalis dengan nyeri kepala dan gangguan penglihatan pada usia lanjut."],["Hipertensi emergensi","Krisis hipertensi ditandai tekanan darah sangat tinggi dengan kerusakan organ target, bukan syok hipovolemik."]],a:1,e:"Trias klasik ruptur AAA adalah nyeri abdomen atau punggung, hipotensi, dan massa abdomen pulsatil. Tindakan dokter umum adalah akses intravena besar, resusitasi terkendali, dan rujukan bedah vaskular darurat."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Tn. Dereon usia 58 tahun datang ke IGD dengan nyeri dada berat sejak 45 menit saat menonton televisi. Nyeri di tengah dada menjalar ke rahang dan lengan kiri. Pasien tampak gelisah, TD 90/60 mmHg, HR 60x/menit, RR 22x/menit, SaO2 96 persen. EKG menunjukkan elevasi segmen ST di sadapan II, III, dan aVF dengan depresi resiprokal di I dan aVL. Apakah diagnosis yang tepat?",o:[["Angina unstable","Angina tidak stabil tidak menunjukkan elevasi segmen ST persisten."],["Perikarditis","Perikarditis memberi elevasi ST cekung difus di hampir semua sadapan dengan depresi PR, tanpa perubahan resiprokal."],["STEMI inferior","BENAR. Elevasi ST di II, III, aVF dengan resiprokal di I dan aVL menandai infark dinding inferior, umumnya akibat oklusi arteri koroner kanan."],["STEMI anterior","Infark anterior memberi elevasi ST di sadapan prekordial V1 sampai V4."],["STEMI high lateral","Infark lateral tinggi memberi elevasi ST di sadapan I dan aVL."]],a:2,e:"STEMI inferior sering disertai bradikardia dan hipotensi karena refleks Bezold-Jarisch dan keterlibatan ventrikel kanan. Wajib merekam sadapan V3R dan V4R, serta berhati-hati memberikan nitrat."},
{t:"Aritmia",s:"3B",q:"Seorang laki-laki 45 tahun dibawa ke IGD setelah ditemukan tidak sadar sejak 30 menit. Sebelumnya pasien mengeluh dada berdebar. Setelah dipasang monitor didapatkan TD 80/60 mmHg, nadi 140x/menit ireguler, RR 20x/menit. EKG menunjukkan takikardia kompleks QRS lebar dengan nadi masih teraba. Apakah tatalaksana yang paling tepat?",o:[["Amiodaron intravena","Amiodaron dipakai pada takikardia dengan hemodinamik stabil atau setelah konversi listrik berhasil."],["Manuver vagal","Manuver vagal hanya untuk takikardia QRS sempit yang stabil."],["Kardioversi tersinkronisasi","BENAR. Takikardia dengan nadi teraba disertai tanda instabilitas seperti hipotensi dan penurunan kesadaran ditangani dengan kardioversi tersinkronisasi segera."],["Konsultasi ke ahli","Konsultasi tidak boleh menunda tindakan penyelamatan nyawa pada pasien tidak stabil."],["Kardioversi tidak tersinkronisasi","Defibrilasi tanpa sinkronisasi hanya untuk pasien tanpa nadi atau takikardia ventrikel polimorfik."]],a:2,e:"Algoritma takikardia ACLS: bila ada nadi disertai tanda instabilitas berupa hipotensi, penurunan kesadaran, tanda syok, nyeri dada iskemik, atau gagal jantung akut, lakukan kardioversi tersinkronisasi setelah sedasi bila memungkinkan."},
{t:"Vaskular Perifer",s:"3B",q:"Laki-laki 55 tahun datang dengan nyeri hebat mendadak pada kaki kanan yang dirasakan terus menerus dan terasa kebas sejak 6 jam. Sebelumnya nyeri hanya muncul saat beraktivitas. Pemeriksaan fisik TD 150/90 mmHg, N 90x/menit. Status lokalis pedis dekstra: pulsasi tidak teraba, akral dingin, dan sulit digerakkan. Apakah diagnosisnya?",o:[["Acute limb ischemia","BENAR. Onset kurang dari 14 hari dengan pain, pallor, pulselessness, poikilothermia, paresthesia, dan paralysis menandakan iskemia tungkai akut."],["Deep vein thrombosis","DVT memberi tungkai bengkak, hangat, dan kemerahan dengan pulsasi arteri yang tetap teraba."],["Peripheral arterial disease grade III","PAD kronik memberi klaudikasio progresif tanpa hilangnya pulsasi secara mendadak dan tanpa defisit motorik akut."],["Critical limb ischemia","Iskemia tungkai kritis bersifat kronik lebih dari 2 minggu dengan nyeri istirahat atau ulkus iskemik."],["Chronic venous insufficiency","Insufisiensi vena kronik memberi varises, hiperpigmentasi, dan edema, bukan tungkai pucat dingin tanpa pulsasi."]],a:0,e:"Iskemia tungkai akut adalah kegawatan vaskular dengan golden period sekitar 6 jam. Berikan heparin segera, jangan menghangatkan tungkai secara agresif, dan rujuk untuk revaskularisasi."},
{t:"Gagal Jantung",s:"3B",q:"Wanita 55 tahun datang ke IGD dengan sesak dan bengkak kaki tangan sejak 3 hari, memberat 3 jam terakhir. Ia memiliki riwayat gagal jantung dan terakhir kontrol 5 hari lalu. Pemeriksaan fisik: TD 80/50 mmHg, N 40x/menit, RR 30x/menit, SpO2 90 persen, akral dingin, ronki (+/+), pitting edema (+/+). Apakah tatalaksana yang tepat?",o:[["Furosemide intravena tunggal","Diuretik saja tidak cukup karena pasien sudah hipoperfusi dan hipotensi sehingga membutuhkan dukungan inotropik."],["Furosemide intravena dan dobutamine intravena","BENAR. Profil cold and wet dengan hipotensi memerlukan inotropik dobutamin untuk memperbaiki curah jantung disertai diuretik untuk dekongesti."],["Furosemide intravena dan dopamine intravena","Dopamin meningkatkan risiko aritmia dan tidak lebih unggul dibanding dobutamin pada gagal jantung dengan curah rendah."],["Furosemide intravena dan norepinephrine intravena","Norepinefrin ditambahkan hanya bila hipotensi menetap meski inotropik sudah optimal."],["Norepinephrine intravena dan dobutamine intravena","Kombinasi ini melewatkan dekongesti padahal pasien jelas kelebihan cairan dengan ronki dan edema."]],a:1,e:"Klasifikasi Stevenson membagi gagal jantung akut menjadi warm-dry, warm-wet, cold-dry, dan cold-wet. Profil cold-wet memiliki mortalitas tertinggi dan memerlukan inotropik bersama diuretik."},
{t:"Vaskular Perifer",s:"3A",q:"Seorang pria 30 tahun datang ke klinik dengan tangan terasa kebas dan berubah menjadi biru ketika terpapar udara dingin, hilang timbul sejak beberapa bulan. Tidak ada riwayat penyakit kronis maupun trauma sebelumnya. Apakah diagnosisnya?",o:[["Buerger disease","Tromboangiitis obliterans terjadi pada perokok berat dan berujung ulkus atau gangren digiti, bukan perubahan warna reversibel."],["Carpal tunnel syndrome","Sindrom terowongan karpal memberi parestesia di distribusi nervus medianus tanpa perubahan warna akibat dingin."],["Frostbite","Radang dingin membutuhkan paparan suhu beku ekstrem dan menyebabkan kerusakan jaringan permanen."],["Penyakit Raynaud","BENAR. Fenomena Raynaud primer atau penyakit Raynaud terjadi tanpa penyakit dasar, pada usia muda, dan bersifat reversibel setelah paparan dingin."],["Sindrom Raynaud","Sindrom atau Raynaud sekunder menyertai penyakit jaringan ikat seperti skleroderma atau lupus, yang disangkal pada pasien ini."]],a:3,e:"Penyakit Raynaud primer bersifat simetris, tanpa ulkus, dengan kapilaroskopi dan penanda autoimun normal. Tatalaksana utama adalah menghindari dingin dan berhenti merokok, dengan calcium channel blocker bila berat."},
{t:"Aritmia",s:"3B",q:"Seorang perempuan 55 tahun datang ke IGD dengan rasa tidak nyaman pada dada seperti tertekan benda berat sejak 1 jam. TD 80/60 mmHg, N 50x/menit, RR 24x/menit, T 36,5 C. EKG awal menunjukkan blok AV derajat 1. Dokter sudah memberikan 2 kali injeksi sulfas atropin 1 mg, namun monitor tetap menunjukkan bradikardia simtomatik dengan hipotensi. Apakah tatalaksana selanjutnya yang paling tepat?",o:[["Injeksi sulfas atropin 2 mg","Dosis tunggal atropin maksimal 1 mg dan total kumulatif maksimal 3 mg, sehingga menaikkan dosis tunggal tidak dibenarkan."],["Injeksi sulfas atropin 1 mg","Pemberian ulang atropin sudah tidak efektif setelah bradikardia terbukti refrakter."],["Monitor dan observasi","Observasi saja berbahaya karena pasien bradikardia dengan hipotensi dan gejala iskemia."],["Dopamin intravena 5 mikrogram per kilogram per menit dengan uptitrasi","BENAR. Bila atropin gagal, pilihan berikutnya adalah pacu jantung transkutan atau infus kronotropik seperti dopamin 5 sampai 20 mikrogram per kilogram per menit."],["Epinefrin intravena 2 sampai 10 mikrogram per menit","Epinefrin adalah alternatif yang sah, tetapi pada algoritma umumnya dipertimbangkan setelah dopamin atau bila terjadi syok berat."]],a:3,e:"Algoritma bradikardia ACLS: atropin 1 mg tiap 3 sampai 5 menit maksimal 3 mg, lalu pacu transkutan atau dopamin atau epinefrin infus, sambil mencari penyebab reversibel seperti iskemia, hiperkalemia, dan intoksikasi obat."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 70 tahun datang ke IGD dengan nyeri kepala serta mual muntah sejak hari ini, lalu mendadak tidak sadar. Ia memiliki riwayat gagal ginjal dengan hemodialisis rutin 2 kali seminggu, namun tidak dialisis selama satu minggu terakhir. Nadi tidak teraba dan tidak bernapas sehingga dilakukan bantuan hidup dasar. Monitor menunjukkan gelombang sinusoid lebar tanpa gelombang P yang jelas. Apakah penyebab yang dapat dipulihkan pada pasien tersebut?",o:[["Alkalosis","Yang termasuk penyebab reversibel adalah asidosis, bukan alkalosis, dan tidak sesuai kondisi uremia."],["Hipertermia","Suhu tinggi bukan pencetus pada pasien ini dan tidak menghasilkan pola sinusoid."],["Hiperkalemia","BENAR. Pasien hemodialisis yang melewatkan sesi sangat rentan hiperkalemia berat, yang memberi gelombang sinusoid dan henti jantung."],["Hiperglikemia","Hiperglikemia bukan bagian dari daftar 5H dan 5T penyebab henti jantung reversibel."],["Overload syndrome","Kelebihan cairan menyebabkan edema paru, bukan pola EKG sinusoid pada henti jantung."]],a:2,e:"Progresi EKG hiperkalemia: T tinggi lancip, PR memanjang, gelombang P hilang, QRS melebar, hingga sine wave dan asistol. Terapi darurat adalah kalsium glukonas, insulin dengan dekstrosa, bikarbonat bila asidosis, dan dialisis segera."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 45 tahun kontrol ke poli jantung karena sesak memberat sejak 3 hari, disertai demam dan kaki bengkak sejak 7 hari. Pasien mengambil warfarin setelah operasi penggantian katup 2 bulan lalu. Pemeriksaan fisik TD 110/80 mmHg, N 80x/menit, T 38,6 C, RR 26x/menit, edema tungkai bilateral, ronki (+/+), murmur sistolik di apeks, serta massa kemerahan yang nyeri di ujung jari tangan. Apakah nama tanda pada ujung jari tersebut?",o:[["Eritema marginatum","Eritema marginatum adalah ruam anular tidak nyeri pada batang tubuh yang menjadi kriteria mayor demam rematik."],["Nodul subkutan","Nodul subkutan demam rematik tidak nyeri dan berada di permukaan ekstensor sendi."],["Nodus Osler","BENAR. Nodus Osler adalah nodul kecil yang nyeri pada pulpa jari akibat fenomena imunologis endokarditis infektif."],["Splinter hemorrhage","Splinter hemorrhage berupa garis perdarahan linear di bawah kuku dan tidak nyeri."],["Janeway lesion","Lesi Janeway adalah makula eritematosa tidak nyeri di telapak tangan dan kaki."]],a:2,e:"Jembatan keledai: Osler nodes Ouch karena nyeri, Janeway lesion tidak nyeri. Keduanya kriteria minor Duke. Pasien katup prostetik dengan demam harus dikultur darah dan diekokardiografi."},
{t:"Cor Pulmonale",s:"3A",q:"Seorang laki-laki 55 tahun datang ke IGD karena perut membesar sejak 1 minggu, mudah lelah saat berjalan jauh, dan sering terbangun malam karena sesak. Ia memiliki riwayat batuk lama sejak 4 tahun dan sudah menuntaskan obat merah walaupun sempat putus berobat. Pemeriksaan fisik TD 120/80 mmHg, N 90x/menit, T 36,5 C, SpO2 90 persen, RR 24x/menit, wheezing di kedua lapang paru, JVP meningkat, dan asites. Apakah diagnosisnya?",o:[["Cor pulmonale akut","Cor pulmonale akut terjadi mendadak akibat emboli paru masif, bukan perjalanan kronik bertahun-tahun."],["Sindroma obstruksi pasca tuberkulosis","SOPT menjelaskan obstruksi jalan napasnya saja, tetapi tidak mencakup tanda gagal jantung kanan berupa asites dan JVP meningkat."],["Cor pulmonale kronis","BENAR. Penyakit paru kronik pasca tuberkulosis menyebabkan hipertensi pulmonal dan gagal jantung kanan kronik dengan JVP meningkat, asites, dan edema."],["Penyakit paru obstruktif kronis","PPOK adalah penyakit paru dasarnya, tetapi diagnosis lengkap harus menyebut komplikasi jantung kanannya."],["Acute decompensated heart failure","ADHF berasal dari gagal jantung kiri dengan kongesti paru dominan dan riwayat terapi gagal jantung sebelumnya."]],a:2,e:"Cor pulmonale adalah gangguan struktur dan fungsi ventrikel kanan akibat penyakit paru. Terapi utama adalah mengatasi penyakit paru dasar dan oksigen jangka panjang, karena oksigen menurunkan vasokonstriksi pulmonal hipoksik."},
{t:"Vaskular Perifer",s:"3A",q:"Seorang perempuan 21 tahun mengeluh nyeri pada tungkai dan betis terutama ketika berdiri terlalu lama. Ia bekerja sebagai penjaga gerai ponsel dan sering berdiri lama. Keluhan disertai penonjolan pembuluh darah berkelok di betis berwarna kebiruan. Demam dan betis kemerahan disangkal. Tanda vital dalam batas normal. Apakah diagnosis yang tepat?",o:[["Tromboangiitis obliterans","Penyakit Buerger mengenai arteri distal perokok berat dan menimbulkan iskemia digiti."],["Chronic limb ischemia","Iskemia tungkai kronik memberi klaudikasio arterial dengan pulsasi melemah, bukan vena berkelok."],["Insufisiensi vena kronik","BENAR. Berdiri lama, vena varikosa berkelok kebiruan, dan nyeri pegal yang membaik saat elevasi adalah gambaran insufisiensi vena kronik."],["Limfangitis","Limfangitis memberi garis kemerahan nyeri dengan demam akibat infeksi."],["Deep vein thrombosis","DVT memberi bengkak unilateral akut, nyeri, dan hangat, biasanya dengan faktor risiko imobilisasi."]],a:2,e:"Insufisiensi vena kronik disebabkan inkompetensi katup vena. Tatalaksana lini pertama adalah stoking kompresi, elevasi tungkai, hindari berdiri lama, dan olahraga betis."},
{t:"Vaskular Perifer",s:"1",q:"Seorang laki-laki 60 tahun datang dengan pusing berputar sejak 3 hari yang diperberat perubahan posisi kepala. Ia memiliki riwayat kelemahan separuh badan kiri yang berlangsung hanya 1 hari. Pemeriksaan fisik menemukan bruit supraklavikula. Ultrasonografi menunjukkan aliran retrograde menuju arteri subklavia sinistra. Apakah kemungkinan diagnosisnya?",o:[["Atrial septal defect","ASD adalah pirau intrakardiak dan tidak menyebabkan aliran balik pada arteri vertebralis."],["Transient ischemic attack","TIA adalah manifestasi klinis yang dialami pasien, bukan diagnosis penyebab aliran retrograde."],["Subclavian steal syndrome","BENAR. Stenosis arteri subklavia proksimal menyebabkan aliran balik pada arteri vertebralis sehingga darah dicuri dari sirkulasi posterior dan memicu vertigo."],["Patent ductus arteriosus","PDA memberi murmur kontinu mesin di area infraklavikula kiri pada bayi dan anak."],["Transposition of great arteries","TGA adalah penyakit jantung sianotik neonatus."]],a:2,e:"Subclavian steal ditandai perbedaan tekanan darah antar lengan lebih dari 15 mmHg, bruit supraklavikula, dan gejala vertebrobasilar saat lengan dipakai bekerja. Tatalaksana definitif adalah revaskularisasi."},
{t:"Aritmia",s:"3B",q:"Seorang wanita 67 tahun dibawa ke IGD karena tidak sadar sejak 2 jam. Sebelumnya ia mengeluh sesak, berdebar, pusing, dan mudah lelah. Pemeriksaan fisik TD 120/90 mmHg, HR 180x/menit, T 37,2 C, pasien berkeringat dan JVP meningkat. EKG menunjukkan QRS sempit dengan interval R-R konstan tanpa gelombang P yang teridentifikasi. Apakah diagnosis yang tepat?",o:[["Sinus takikardia","Sinus takikardia jarang melebihi 150x/menit pada usia lanjut dan selalu memiliki gelombang P sinus yang jelas."],["Ventrikular takikardia","VT memberi QRS lebar lebih dari 120 ms."],["Atrial flutter","Flutter memberi gelombang gigi gergaji dengan laju atrium sekitar 300x/menit dan blok yang sering bervariasi."],["Supraventrikular takikardia","BENAR. Takikardia QRS sempit yang sangat reguler dengan laju sekitar 150 sampai 250x/menit tanpa gelombang P terlihat adalah SVT."],["STEMI","STEMI ditandai elevasi segmen ST, bukan takikardia reguler tanpa gelombang P."]],a:3,e:"SVT stabil ditangani manuver vagal lalu adenosin 6 mg bolus cepat. Bila tidak stabil, lakukan kardioversi tersinkronisasi 50 sampai 100 J."},
{t:"Gagal Jantung",s:"3B",q:"Seorang wanita 52 tahun datang ke IGD dengan sesak napas sejak 4 jam. Ia memiliki riwayat merokok dan hipertensi namun jarang berobat, sering terbangun malam karena sesak, dan harus tidur dengan 4 bantal. Pemeriksaan fisik TD 160/100 mmHg, HR 105x/menit, RR 30x/menit, SpO2 89 persen, JVP meningkat, dan ronki basah pada basal paru. Apakah kondisi yang mendasari keluhan pasien?",o:[["Defek septum ventrikel","VSD adalah kelainan bawaan dengan murmur pansistolik dan biasanya terdeteksi sejak masa anak."],["Stenosis pulmonal","Stenosis pulmonal memberi murmur ejeksi sistolik area pulmonal dan gagal jantung kanan."],["Edema paru akut","BENAR. Ortopnea, paroxysmal nocturnal dyspnea, ronki basah basal, hipoksemia, dan hipertensi akut adalah gambaran edema paru kardiogenik."],["Hipertensi pulmonal","Hipertensi pulmonal menimbulkan gagal jantung kanan dengan P2 mengeras tanpa ronki basah difus."],["Angina prinzmetal","Angina varian memberi nyeri dada saat istirahat, bukan sesak akut dengan kongesti paru."]],a:2,e:"Edema paru akut kardiogenik ditangani dengan posisi duduk, oksigen atau ventilasi tekanan positif noninvasif, nitrat bila tekanan darah cukup, dan furosemide intravena."},
{t:"Vaskular Perifer",s:"3A",q:"Seorang wanita 52 tahun dibawa keluarga dengan bengkak dari kaki hingga lutut kanan sejak 1 minggu, disertai nyeri yang bertambah saat digerakkan. Ia mengalami stroke 6 bulan lalu yang menyebabkan kelumpuhan sisi kanan sehingga hanya bisa berbaring, serta memiliki riwayat diabetes dan dislipidemia. Pemeriksaan fisik menunjukkan edema pitting dan hiperemis pada pedis dekstra hingga lutut yang terasa nyeri dan hangat. Apakah diagnosis dan pemeriksaan penunjang yang sesuai?",o:[["Selulitis, darah lengkap dan C-reactive protein","Selulitis memberi batas eritema tidak tegas dengan demam, dan bukan diagnosis utama pada pasien imobilisasi lama dengan bengkak seluruh tungkai."],["Selulitis, D-dimer dan ultrasonografi Doppler","Pemeriksaannya benar untuk trombosis, tetapi diagnosis selulitis tidak menjelaskan faktor risiko imobilisasi dan distribusi edema."],["Selulitis, D-dimer dan darah lengkap","Kombinasi ini tidak menegakkan maupun menyingkirkan trombosis vena dalam."],["Trombosis vena dalam, ultrasonografi Doppler dan C-reactive protein","CRP hanya penanda inflamasi nonspesifik dan bukan bagian alur diagnosis trombosis."],["Trombosis vena dalam, ultrasonografi Doppler dan D-dimer","BENAR. Imobilisasi lama pasca stroke adalah faktor risiko kuat DVT, dan penegakan diagnosis memakai skor Wells dilanjutkan D-dimer serta USG Doppler kompresi."]],a:4,e:"Pada probabilitas rendah, D-dimer negatif menyingkirkan DVT. Pada probabilitas sedang sampai tinggi, langsung lakukan USG Doppler kompresi. Terapi adalah antikoagulan untuk mencegah emboli paru."},
{t:"Kardiomiopati dan Perikardium",s:"1",q:"Perempuan 58 tahun datang ke IGD dengan nyeri dada sejak 4 jam, terasa tajam dan tidak menjalar. Tidak ada riwayat penyakit jantung sebelumnya, namun keluhan serupa pernah muncul 3 bulan lalu setelah suaminya meninggal dunia. Pemeriksaan fisik TD 90/60 mmHg, N 90x/menit, RR 24x/menit, murmur sistolik di apeks. EKG menunjukkan elevasi segmen ST hampir di semua sadapan dan ekokardiografi memperlihatkan LV apical ballooning dengan hipokinesis apikal serta obstruksi LVOT. Apakah diagnosisnya?",o:[["Kardiomiopati takotsubo","BENAR. Stres emosional berat, apical ballooning, dan perubahan EKG menyerupai infark tanpa lesi koroner obstruktif adalah sindrom takotsubo."],["Kardiomiopati dilatasi","Kardiomiopati dilatasi memberi dilatasi dan hipokinesis global yang kronik progresif."],["Hypertensive heart disease","Penyakit jantung hipertensif memberi hipertrofi konsentrik pada pasien hipertensi lama."],["Aneurisma ventrikel kiri","Aneurisma ventrikel kiri adalah komplikasi lanjut infark miokard transmural, dengan elevasi ST persisten dan riwayat infark."],["Kardiomiopati iskemik","Kardiomiopati iskemik memerlukan penyakit koroner obstruktif bermakna."]],a:0,e:"Takotsubo atau broken heart syndrome dipicu lonjakan katekolamin. Umumnya reversibel dalam beberapa minggu dengan terapi suportif, namun fase akut berisiko syok kardiogenik dan aritmia."},
{t:"Kardiomiopati dan Perikardium",s:"3A",q:"Seorang laki-laki 55 tahun datang dengan sesak napas dan nyeri dada sejak 1 minggu yang memberat sejak 1 hari, disertai demam dan bengkak kedua kaki. Nyeri dada bertambah saat berbaring. Pemeriksaan fisik TD 130/80 mmHg, HR 75x/menit, suhu 37,2 C, JVP meningkat, suara jantung menjauh disertai friction rub, dan edema kedua tungkai. EKG menunjukkan elevasi segmen ST hampir di semua sadapan. Apakah diagnosis yang tepat?",o:[["Perikarditis","BENAR. Nyeri dada pleuritik yang memberat saat berbaring, pericardial friction rub, dan elevasi ST difus adalah trias diagnostik perikarditis akut."],["Infark miokard akut","Infark memberi elevasi ST regional dengan perubahan resiprokal, bukan elevasi difus dengan friction rub."],["Unstable angina pectoris","Angina tidak stabil tidak disertai demam, friction rub, maupun elevasi ST difus."],["Angina prinzmetal","Angina varian memberi elevasi ST transien saat serangan yang hilang setelah spasme mereda."],["Miokarditis","Miokarditis memberi disfungsi ventrikel dengan peningkatan troponin dominan tanpa friction rub."]],a:0,e:"Diagnosis perikarditis akut memerlukan minimal dua dari empat kriteria: nyeri dada khas, friction rub, elevasi ST difus atau depresi PR, dan efusi perikard baru. Terapi lini pertama adalah NSAID dosis tinggi dengan kolkisin."},
{t:"Aritmia",s:"3A",q:"Seorang wanita 50 tahun datang ke poli dengan keluhan cepat lelah dan berdebar, sesekali disertai nyeri dada. Ia memiliki kebiasaan minum kopi setiap pagi sejak 3 bulan. Pemeriksaan fisik dan tanda vital dalam batas normal. EKG menunjukkan denyut prematur dengan gelombang P berbeda morfologi yang mendahului QRS sempit, diikuti pause inkomplit. Apakah diagnosis yang tepat?",o:[["AV block derajat II Mobitz I","Mobitz I memberi pemanjangan PR progresif sampai satu QRS hilang, bukan denyut prematur."],["Sindrom koroner akut","SKA memberi perubahan segmen ST atau gelombang T dengan nyeri dada khas dan peningkatan troponin."],["Premature ventricular contraction","PVC menghasilkan QRS lebar tanpa gelombang P yang mendahului serta pause kompensatorik penuh."],["Premature atrial contraction","BENAR. Denyut prematur dengan gelombang P morfologi berbeda, QRS tetap sempit, dan pause inkomplit adalah kontraksi atrium prematur."],["Hiperkalemia","Hiperkalemia memberi T tinggi lancip dan pelebaran QRS, bukan denyut prematur terisolasi."]],a:3,e:"PAC pada jantung struktural normal umumnya jinak dan berkaitan dengan kafein, alkohol, stres, atau rokok. Tatalaksana adalah menghindari pencetus, dengan beta blocker hanya bila sangat mengganggu."},
{t:"Hipertensi",s:"3B",q:"Seorang laki-laki 76 tahun datang dengan penurunan kesadaran sejak 2 jam. Sebelumnya ia mengeluh lemah badan sebelah kiri lalu tiba-tiba tidak sadar. Pemeriksaan fisik TD 220/120 mmHg, HR 100x/menit reguler, T 37,2 C, ronki di seluruh lapang paru, dan edema kedua kaki. Kalium 4,8, klorida 100, natrium 140. Apakah diagnosis, tatalaksana, dan target terapi yang sesuai?",o:[["Hipertensi esensial dengan ISDN sublingual dan penurunan tekanan darah hingga normal dalam 24 jam pertama","Hipertensi esensial adalah diagnosis kronik tanpa kerusakan organ akut, sedangkan pasien ini jelas mengalami edema paru dan gangguan neurologis."],["Hipertensi emergensi dengan bisoprolol syringe pump dan penurunan tekanan darah 25 persen dalam 4 jam pertama","Beta blocker intravena bukan pilihan pada edema paru akut karena efek inotropik negatif."],["Hipertensi urgensi dengan nifedipine syringe pump dan penurunan tekanan darah hingga normal dalam 1 jam pertama","Urgensi berarti tanpa kerusakan organ target akut, dan penurunan mendadak ke normal justru berbahaya."],["Hipertensi emergensi dengan nitrogliserin syringe pump dan penurunan tekanan darah sistolik di bawah 140 mmHg secepatnya","BENAR. Hipertensi emergensi dengan edema paru akut ditangani vasodilator nitrogliserin atau nitroprusid dengan target tekanan sistolik di bawah 140 mmHg dalam satu jam pertama."],["Hipertensi resisten dengan metoprolol intravena dan penurunan tekanan sistolik di bawah 140 mmHg dalam 24 jam pertama","Hipertensi resisten adalah kegagalan kontrol dengan tiga obat termasuk diuretik, bukan kondisi kegawatan akut."]],a:3,e:"Kecepatan penurunan tekanan darah pada hipertensi emergensi bergantung kondisinya. Pada edema paru akut dan diseksi aorta penurunan dilakukan cepat, sedangkan pada stroke iskemik akut penurunan harus sangat hati-hati."},
{t:"Vaskular Perifer",s:"2",q:"Seorang wanita 35 tahun datang dengan bengkak di sepanjang kaki kiri sejak 1 bulan. Keluhan tidak disertai nyeri, pulsasi arteri masih teraba, dan bengkak sewarna kulit. Pemeriksaan fisik TD 100/70 mmHg, HR 100x/menit, RR 18x/menit, T 38 C, Stemmer sign positif. Apakah diagnosisnya?",o:[["Deep vein thrombosis","DVT bersifat akut, nyeri, hangat, dan Stemmer sign negatif."],["Limfedema","BENAR. Stemmer sign positif berupa kulit dorsum jari yang tidak dapat dicubit adalah tanda patognomonik limfedema."],["Trombosis arteri","Trombosis arteri memberi tungkai pucat dingin tanpa pulsasi dan sangat nyeri."],["Insufisiensi vena kronis","Insufisiensi vena memberi varises dan hiperpigmentasi dengan Stemmer sign negatif."],["Takayasu arteritis","Arteritis Takayasu menyebabkan hilangnya pulsasi dan perbedaan tekanan darah antar ekstremitas."]],a:1,e:"Limfedema disebabkan gangguan drainase limfatik dan bersifat nonpitting pada tahap lanjut. Tatalaksana utama adalah terapi dekongestif kompleks berupa kompresi, drainase limfatik manual, perawatan kulit, dan olahraga."},
{t:"Penyakit Katup",s:"2",q:"Seorang wanita 58 tahun datang untuk medical checkup tanpa keluhan saat ini. Ia memiliki riwayat hipertensi sejak 10 tahun namun tidak rutin berobat dan kadang merasa sesak bila berjalan jauh. Pemeriksaan fisik TD 160/100 mmHg, HR 90x/menit, RR 20x/menit, SpO2 97 persen, dan murmur sistolik di ICS V midklavikula sinistra. EKG menunjukkan hipertrofi ventrikel kiri dengan P mitral. Apakah kelainan katup pada pasien ini?",o:[["Regurgitasi trikuspid","Regurgitasi trikuspid memberi murmur sistolik di parasternal kiri bawah yang mengeras saat inspirasi."],["Stenosis mitral","Stenosis mitral memberi murmur diastolik dengan opening snap, bukan murmur sistolik."],["Regurgitasi mitral","BENAR. Murmur sistolik di apeks disertai P mitral yang menandakan pembesaran atrium kiri dan hipertrofi ventrikel kiri sesuai regurgitasi mitral kronik."],["Regurgitasi pulmonal","Regurgitasi pulmonal memberi murmur diastolik di ICS II parasternal kiri."],["Stenosis pulmonal","Stenosis pulmonal memberi murmur ejeksi sistolik area pulmonal dengan hipertrofi ventrikel kanan."]],a:2,e:"Regurgitasi mitral kronik menyebabkan kelebihan volume atrium dan ventrikel kiri, tampak sebagai P mitral berlekuk lebar lebih dari 0,12 detik dan kriteria voltase LVH. Konfirmasi dengan ekokardiografi."},
{t:"Vaskular Perifer",s:"3B",q:"Seorang laki-laki 87 tahun dikeluhkan sesak hebat mendadak sejak 1 jam hingga berkeringat. Ia telah dirawat di ICU selama kurang lebih 3 bulan. Pemeriksaan fisik menemukan bengkak dan nyeri pada kaki kanan dengan Homan sign positif sejak 2 minggu. D-dimer positif. EKG menunjukkan gelombang S di lead I, gelombang Q dalam di lead III, dan T inversi di lead III. Foto toraks memperlihatkan hampton hump. Apakah komplikasi yang sedang terjadi?",o:[["Sindrom koroner akut","SKA memberi nyeri dada iskemik dengan perubahan ST regional, bukan pola S1Q3T3 dan hampton hump."],["Pneumotoraks","Pneumotoraks memberi hipersonor, suara napas menghilang, dan gambaran radiolusen avaskular."],["Emboli paru akut","BENAR. Imobilisasi lama, DVT, D-dimer positif, pola S1Q3T3, dan hampton hump adalah gambaran klasik emboli paru akut."],["Emboli paru kronis","Emboli kronik memberi hipertensi pulmonal progresif dalam hitungan bulan, bukan sesak mendadak."],["Claudicatio intermitten","Klaudikasio adalah gejala iskemia arteri tungkai saat berjalan, bukan penyebab sesak akut."]],a:2,e:"Emboli paru adalah komplikasi DVT yang mengancam nyawa. Skor Wells menentukan probabilitas, CT pulmonary angiography adalah baku emas, dan tatalaksana adalah antikoagulan atau trombolisis pada kasus masif."},
{t:"Penyakit Jantung Kongenital",s:"2",q:"Seorang ibu membawa anaknya usia 3 tahun dengan sesak sejak 3 hari. Berat badan anak sulit naik dan anak lebih suka jongkok saat lelah. Pemeriksaan fisik menunjukkan sianosis, jari tabuh, dan bising ejeksi sistolik di ICS II parasternal sinistra. Foto toraks memperlihatkan jantung boot-shaped. Apakah diagnosis yang tepat?",o:[["Ventricular septal defect","VSD terisolasi bersifat asianotik dengan murmur pansistolik parasternal kiri bawah."],["Atrial septal defect","ASD asianotik dengan wide fixed splitting S2 dan gambaran radiologis pletora paru."],["Tetralogy of Fallot","BENAR. Sianosis, squatting, jari tabuh, dan jantung boot-shaped akibat hipertrofi ventrikel kanan adalah gambaran khas tetralogi Fallot."],["Patent ductus arteriosus","PDA memberi murmur kontinu mesin dan nadi kolaps tanpa sianosis sentral."],["Transposition of great arteries","TGA memberi sianosis berat sejak neonatus dengan gambaran egg on string."]],a:2,e:"Empat komponen tetralogi Fallot adalah stenosis pulmonal, VSD, overriding aorta, dan hipertrofi ventrikel kanan. Saat tet spell, posisikan anak knee-chest, berikan oksigen, morfin, dan cairan."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 47 tahun datang ke IGD karena tidak sadarkan diri. Nadi karotis tidak teraba sehingga dilakukan resusitasi jantung paru, pemasangan pipa endotrakeal, akses intravena, dan pemberian epinefrin 1 mg intravena. EKG menunjukkan gambaran torsade de pointes tanpa nadi. Apakah tindakan selanjutnya yang tepat?",o:[["Kardioversi tidak tersinkronisasi 100 Joule","Energi tersebut terlalu rendah untuk henti jantung dan istilah kardioversi tidak tepat untuk pasien tanpa nadi."],["Pemberian epinefrin 1 mg intravena","Epinefrin baru saja diberikan dan diulang tiap 3 sampai 5 menit, bukan tindakan segera pada irama yang dapat dikejut."],["Defibrilasi 200 Joule bifasik","BENAR. Torsade de pointes tanpa nadi termasuk irama shockable sehingga harus segera didefibrilasi dengan energi maksimal atau 200 J bifasik."],["Pemberian natrium bikarbonat","Bikarbonat hanya untuk kondisi khusus seperti hiperkalemia atau intoksikasi trisiklik."],["Pemberian digoxin","Digoksin justru dapat memperberat aritmia ventrikel."]],a:2,e:"Torsade de pointes tanpa nadi ditangani defibrilasi, sedangkan bila masih ada nadi berikan magnesium sulfat 1 sampai 2 gram intravena serta koreksi hipomagnesemia, hipokalemia, dan obat pemanjang QT."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Pasien laki-laki 45 tahun datang ke IGD rumah sakit tipe B karena nyeri dada seperti terikat sejak 3 jam. EKG menunjukkan elevasi segmen ST di sadapan I, aVL, V5, dan V6. Dokter memutuskan memulai terapi fibrinolitik karena jarak rumah sakit ke fasilitas PCI adalah 6 jam. Apakah terapi fibrinolitik yang tepat?",o:[["Streptokinase 1,5 juta IU dalam 30 sampai 60 menit","BENAR. Regimen streptokinase pada STEMI adalah 1,5 juta unit dalam 100 mL dekstrosa atau salin diberikan dalam 30 sampai 60 menit."],["Alteplase 1,5 juta IU dalam 30 sampai 60 menit","Alteplase diberikan berdasarkan berat badan dengan bolus 15 mg dilanjutkan infus, bukan dalam satuan juta IU."],["Streptokinase 15 mg bolus dilanjutkan 0,75 mg per kilogram dalam 30 menit lalu 0,5 mg per kilogram dalam 60 menit","Regimen tersebut adalah dosis alteplase, bukan streptokinase."],["Enoxaparin 30 mg intravena dilanjutkan 1 mg per kilogram tiap 12 jam subkutan","Enoxaparin adalah antikoagulan penunjang, bukan agen fibrinolitik."],["Tenecteplase 1,5 juta IU dalam 30 sampai 60 menit","Tenecteplase diberikan bolus tunggal sesuai berat badan dalam satuan miligram."]],a:0,e:"Bila waktu tempuh ke pusat PCI melebihi 120 menit, fibrinolisis harus diberikan dalam 30 menit sejak kontak medis pertama, lalu pasien tetap dirujuk untuk strategi farmako invasif."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 9 tahun datang dengan nyeri sendi berpindah-pindah disertai demam hilang timbul sejak 2 minggu. Ia mengalami radang tenggorokan 2 minggu lalu yang sembuh tanpa pengobatan. Pemeriksaan fisik TD 120/80 mmHg, N 80x/menit, T 38,5 C, dan murmur sistolik di apeks. Laboratorium menunjukkan leukosit 15.000 dengan peningkatan titer ASTO. Apakah diagnosisnya?",o:[["Penyakit jantung rematik","PJR adalah kerusakan katup permanen sebagai gejala sisa, biasanya muncul bertahun kemudian tanpa fase inflamasi akut."],["Acute rheumatic fever","BENAR. Poliartritis migran dan karditis sebagai dua kriteria mayor Jones disertai bukti infeksi streptokokus melalui ASTO menegakkan demam rematik akut."],["Infective endocarditis","Endokarditis infektif memberi demam berkepanjangan dengan fenomena emboli dan kultur darah positif."],["Pericarditis","Perikarditis memberi nyeri dada pleuritik dan friction rub, bukan artritis migran."],["Sekuele demam rematik akut","Sekuele bersifat kronik tanpa demam, artritis aktif, maupun kenaikan penanda inflamasi."]],a:1,e:"Kriteria Jones membutuhkan dua mayor atau satu mayor dengan dua minor ditambah bukti infeksi streptokokus. Terapi mencakup eradikasi dengan penisilin, antiinflamasi, dan profilaksis sekunder jangka panjang."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang wanita 40 tahun datang dengan nyeri dada kiri sejak 2 jam yang menjalar sampai rahang kiri seperti ditindih beban berat disertai keringat dingin. EKG menunjukkan depresi segmen ST pada sadapan II, III, dan aVF. Apakah pembuluh darah yang kemungkinan mengalami oklusi?",o:[["Right coronary artery","BENAR. Sadapan II, III, dan aVF merepresentasikan dinding inferior yang pada sebagian besar orang diperdarahi arteri koroner kanan."],["Left coronary artery","Arteri koroner kiri utama memberi iskemia luas anterolateral dengan hemodinamik yang biasanya kolaps."],["Left anterior descending artery","LAD memperdarahi dinding anterior dan septum, tampak di sadapan V1 sampai V4."],["Left circumflex artery","Sirkumfleks memperdarahi dinding lateral, tampak di sadapan I, aVL, V5, dan V6."],["Posterior descending artery cabang kiri","Dominasi kiri hanya dijumpai pada sekitar 10 persen populasi sehingga bukan jawaban paling mungkin."]],a:0,e:"Pemetaan sadapan: inferior II, III, aVF; anterior V1 sampai V4; lateral I, aVL, V5, V6. Pada iskemia inferior selalu rekam sadapan kanan untuk mendeteksi infark ventrikel kanan."},
{t:"Aritmia",s:"3A",q:"Seorang atlet lari datang ke klinik untuk pemeriksaan rutin dengan keluhan sesekali lemas badan dan pusing. Pemeriksaan fisik TD 110/60 mmHg, nadi 45x/menit, RR 20x/menit, suhu 37 C. EKG menunjukkan irama reguler dengan gelombang P normal yang selalu diikuti QRS sempit, interval PR konstan 0,16 detik, laju 45x/menit. Apakah diagnosisnya?",o:[["Sinus bradikardia","BENAR. Irama sinus dengan laju kurang dari 60x/menit, setiap P diikuti QRS, dan interval PR normal adalah sinus bradikardia, yang fisiologis pada atlet terlatih."],["AV block derajat 1","Blok AV derajat 1 memerlukan interval PR lebih dari 0,20 detik."],["AV block derajat 2","Blok derajat 2 ditandai adanya gelombang P yang tidak diikuti QRS."],["AV block derajat 3","Blok total menunjukkan disosiasi penuh antara gelombang P dan kompleks QRS."],["Sinus arrest","Sinus arrest memberi jeda mendadak tanpa aktivitas atrium, bukan irama lambat yang teratur."]],a:0,e:"Bradikardia sinus pada atlet disebabkan tonus vagal tinggi dan tidak memerlukan terapi bila asimtomatik. Terapi diperlukan hanya bila ada gejala hipoperfusi."}
,
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang wanita 60 tahun datang ke poliklinik dengan nyeri dada menjalar ke lengan dan tembus ke punggung. Nyeri dirasakan 3 sampai 5 menit dan mereda saat istirahat, berulang sejak 6 bulan terakhir. Pemeriksaan fisik TD 125/85 mmHg, HR 86x/menit, RR 24x/menit, T 36 C, EKG saat ini irama sinus tanpa kelainan segmen ST. Pasien diberikan obat yang diletakkan di bawah lidah. Apakah kontraindikasi obat tersebut?",o:[["Konsumsi non steroidal anti inflammatory drugs","NSAID tidak berinteraksi berbahaya dengan nitrat, meskipun perlu hati-hati pada penyakit koroner."],["Konsumsi inhibitor fosfodiesterase V","BENAR. Nitrat sublingual dikontraindikasikan bila pasien mengonsumsi sildenafil atau sejenisnya dalam 24 sampai 48 jam karena risiko hipotensi berat."],["Konsumsi kortikosteroid","Kortikosteroid tidak memiliki interaksi hipotensif bermakna dengan nitrat."],["Konsumsi angiotensin receptor blocker","ARB boleh dikombinasikan dengan nitrat asalkan tekanan darah dipantau."],["Konsumsi beta agonist 2 receptor","Beta agonis inhalasi tidak dikontraindikasikan bersama nitrat."]],a:1,e:"Nitrat dan inhibitor PDE5 sama-sama meningkatkan cGMP sehingga kombinasinya menimbulkan vasodilatasi masif dan kolaps sirkulasi. Kontraindikasi lain nitrat adalah hipotensi, infark ventrikel kanan, dan stenosis aorta berat."},
{t:"Penyakit Jantung Koroner",s:"3A",q:"Seorang pria 58 tahun datang ke poliklinik dengan nyeri dada seperti tertekan benda berat yang hilang timbul dan mereda saat istirahat. Pemeriksaan fisik TD 130/95 mmHg, HR 96x/menit, RR 24x/menit, T 36,6 C. EKG menunjukkan irama sinus tanpa kelainan. Apakah pemeriksaan baku emas pada kasus tersebut?",o:[["Exercise stress test","Uji latih adalah pemeriksaan penapisan lini pertama, bukan baku emas."],["Elektrokardiogram","EKG istirahat sering normal pada angina stabil di luar serangan."],["Angiografi koroner","BENAR. Angiografi koroner adalah baku emas untuk menilai lokasi dan derajat stenosis arteri koroner."],["Ekokardiografi","Ekokardiografi menilai fungsi ventrikel dan katup, bukan anatomi koroner."],["Holter monitoring test","Holter dipakai untuk merekam aritmia intermiten."]],a:2,e:"Alur diagnosis angina stabil dimulai dari EKG istirahat, lalu uji latih beban atau CT coronary angiography, dan angiografi invasif sebagai baku emas sekaligus jalan menuju revaskularisasi."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang pria 46 tahun datang dengan nyeri dada hilang timbul sejak 4 jam yang terutama dirasakan saat aktivitas dan tidak membaik saat istirahat. Pemeriksaan fisik TD 130/80 mmHg, HR 100x/menit, RR 32x/menit, T 36,5 C. EKG menunjukkan gelombang T inversi dan terdapat peningkatan troponin I. Apakah diagnosis yang sesuai?",o:[["NSTEMI","BENAR. Iskemia dengan T inversi tanpa elevasi ST disertai peningkatan troponin adalah infark miokard tanpa elevasi segmen ST."],["STEMI","STEMI memerlukan elevasi segmen ST persisten atau LBBB baru."],["Stable angina pectoris","Angina stabil membaik dengan istirahat dan tidak menaikkan troponin."],["Unstable angina pectoris","Angina tidak stabil memiliki gambaran klinis serupa tetapi troponin tetap normal."],["Perikarditis","Perikarditis memberi elevasi ST difus dengan depresi PR dan friction rub."]],a:0,e:"Pembeda NSTEMI dan angina tidak stabil semata-mata pada biomarka nekrosis miokard. Tatalaksana awal keduanya sama yaitu antiplatelet ganda, antikoagulan, antiiskemik, dan stratifikasi risiko dengan skor GRACE."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Pria 60 tahun dibawa ke IGD dengan nyeri dada sejak 2 jam seperti tertindih dan menjalar ke punggung, tidak membaik dengan istirahat. Pemeriksaan fisik TD 90/60 mmHg, HR 102x/menit, RR 24x/menit, T 36,7 C, saturasi 97 persen. EKG standar menunjukkan elevasi ST inferior dan EKG sadapan kanan menunjukkan elevasi segmen ST di V4R. Apakah tatalaksana yang menjadi kontraindikasi pada kasus ini?",o:[["Trombolitik","Trombolitik justru merupakan terapi reperfusi yang dibutuhkan bila PCI tidak tersedia dalam 120 menit."],["Antiplatelet","Aspirin dan penghambat P2Y12 tetap wajib diberikan pada semua STEMI."],["Nitrat","BENAR. Infark ventrikel kanan sangat bergantung pada preload, sehingga nitrat dapat menyebabkan hipotensi berat dan kolaps."],["Morfin","Morfin masih dapat diberikan hati-hati untuk nyeri hebat yang tidak responsif."],["Percutaneous coronary intervention","PCI primer adalah terapi terbaik pada infark ventrikel kanan."]],a:2,e:"Infark ventrikel kanan ditandai trias hipotensi, JVP meningkat, dan paru bersih. Tatalaksananya adalah loading cairan, hindari nitrat dan diuretik, serta reperfusi segera."},
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Pria 60 tahun datang dengan sesak napas dan pusing sejak 4 jam tanpa nyeri dada, berdebar, batuk, maupun demam. Ia memiliki hipertensi tidak terkontrol. Pemeriksaan TD 180/110 mmHg, HR 92x/menit, RR 30x/menit, T 37,3 C, saturasi 91 persen, JVP meningkat, edema pretibial. Rontgen toraks menunjukkan double contour pada jantung kanan. Apakah kemungkinan gambaran EKG pada pasien ini?",o:[["Gelombang Q patologis di lead V1 sampai V3","Q patologis menandakan infark lama dinding anteroseptal."],["Elevasi segmen ST di V5, V6, dan aVL","Gambaran ini menunjukkan infark akut dinding lateral."],["Depresi ST dan T inversi di II, III, aVF","Perubahan ini menunjukkan iskemia dinding inferior."],["Gelombang P lebih dari 2,5 mm","BENAR. Double contour dengan pembesaran atrium kanan menghasilkan P pulmonal yang tinggi lancip lebih dari 2,5 mm di lead II."],["Gelombang S di V1 atau V2 ditambah R di V5 atau V6 lebih dari 35 mm","Kriteria Sokolow-Lyon ini menandakan hipertrofi ventrikel kiri."]],a:3,e:"P pulmonal menandakan pembesaran atrium kanan dan sering ditemukan pada penyakit paru kronik serta gagal jantung kanan. Bandingkan dengan P mitral yang lebar berlekuk pada pembesaran atrium kiri."},
{t:"Gagal Jantung",s:"3B",q:"Seorang pria 55 tahun datang ke IGD dengan sesak sejak 2 hari yang memberat beberapa jam terakhir. Ia memiliki hipertensi tidak terkontrol. Pemeriksaan fisik TD 160/100 mmHg, HR 105x/menit, RR 30x/menit, SpO2 88 persen, ronki basah kasar di dua pertiga basal paru. Rontgen toraks menunjukkan sefalisasi bilateral. Apakah kombinasi terapi yang paling tepat?",o:[["Furosemid dan norepinefrin","Vasopresor tidak diperlukan karena pasien hipertensif, dan justru memperberat afterload."],["Furosemid dan isosorbid dinitrat","BENAR. Edema paru akut dengan tekanan darah tinggi ditangani diuretik loop intravena bersama vasodilator nitrat untuk menurunkan preload dan afterload."],["Furosemid dan nicardipin","Nikardipin dipertimbangkan pada hipertensi emergensi lain, tetapi nitrat lebih superior pada kongesti paru karena efek venodilatasi."],["Furosemid dan bisoprolol","Beta blocker dikontraindikasikan pada fase dekompensasi akut karena efek inotropik negatif."],["Spironolakton dan norepinefrin","Spironolakton bekerja lambat dan tidak sesuai untuk dekongesti darurat."]],a:1,e:"Terapi edema paru kardiogenik mengikuti prinsip LMNOP: Lasix, morfin bila perlu, nitrat, oksigen atau ventilasi noninvasif, dan posisi duduk."},
{t:"Gagal Jantung",s:"3A",q:"Pria 65 tahun dibawa ke poliklinik dengan bengkak kedua kaki menetap sejak 1 minggu. Sesak dirasakan bila berjalan jauh. Ia memiliki diabetes melitus dan hipertensi tidak terkontrol. Pemeriksaan fisik TD 150/80 mmHg, HR 105x/menit, RR 22x/menit, T 36,7 C, SpO2 98 persen, pitting edema pada kedua tungkai. Apakah tatalaksana yang tepat?",o:[["Furosemid dan spironolakton","Kombinasi ini mengatasi kongesti tetapi belum memberikan terapi yang memperbaiki prognosis secara lengkap."],["Furosemid, bisoprolol, dan captopril","BENAR. Gagal jantung kronik stabil membutuhkan diuretik untuk gejala ditambah beta blocker dan penghambat ACE yang terbukti menurunkan mortalitas, sekaligus tepat untuk pasien diabetes dan hipertensi."],["Furosemid, amlodipin, dan candesartan","Amlodipin bersifat netral dan tidak memperbaiki mortalitas gagal jantung."],["Norepinefrin dan furosemid","Vasopresor hanya untuk syok, sedangkan pasien ini stabil."],["Captopril dan bisoprolol","Kombinasi ini benar untuk prognosis tetapi tidak mengatasi kongesti yang sedang terjadi."]],a:1,e:"Pilar terapi gagal jantung dengan fraksi ejeksi menurun adalah ACE inhibitor atau ARNI, beta blocker, antagonis mineralokortikoid, dan penghambat SGLT2, ditambah diuretik sesuai kongesti."},
{t:"Gagal Jantung",s:"3A",q:"Seorang wanita 64 tahun kontrol rutin ke poliklinik jantung. Ia pernah dirawat karena sesak dan bengkak 6 bulan lalu. Saat ini ia dapat melakukan aktivitas ringan dengan baik, tetapi merasa sesak bila berjalan lebih dari 100 meter dan mudah lelah saat naik tangga dua lantai, sesak hilang saat istirahat. Pemeriksaan fisik TD 140/80 mmHg, HR 85x/menit, RR 22x/menit, SpO2 98 persen, tanpa peningkatan JVP, ronki, maupun edema. Termasuk kelas berapa menurut NYHA?",o:[["NYHA I","NYHA I berarti tidak ada keterbatasan aktivitas sama sekali, sedangkan pasien sudah bergejala saat aktivitas biasa."],["NYHA II","BENAR. Keterbatasan ringan dengan gejala hanya pada aktivitas fisik biasa seperti berjalan jauh atau naik tangga, dan nyaman saat istirahat, adalah NYHA II."],["NYHA III","NYHA III berarti gejala muncul pada aktivitas yang lebih ringan dari biasa, misalnya berjalan kurang dari 100 meter."],["NYHA IV","NYHA IV berarti gejala muncul saat istirahat."],["NYHA V","Kelas ini tidak ada dalam klasifikasi NYHA."]],a:1,e:"Klasifikasi NYHA bersifat fungsional dan dapat berubah, sedangkan stadium AHA bersifat struktural dan tidak dapat mundur. Keduanya sering ditanyakan bersamaan pada ujian kompetensi."},
{t:"Cor Pulmonale",s:"3A",q:"Seorang pria 65 tahun dibawa ke poliklinik dengan bengkak di kedua kaki sejak 1 minggu yang memberat sejak kemarin, disertai sesak dan batuk lama. Ia merokok 2 bungkus per hari sejak 20 tahun lalu. Pemeriksaan fisik TD 120/80 mmHg, HR 85x/menit, RR 22x/menit, SpO2 90 persen, barrel chest, JVP meningkat, asites, dan edema kedua tungkai. Apakah tatalaksana untuk menurunkan tekanan pulmonal pada kasus ini?",o:[["Oksigen","BENAR. Terapi oksigen jangka panjang mengatasi vasokonstriksi pulmonal hipoksik sehingga menurunkan tekanan arteri pulmonalis dan memperbaiki survival."],["Furosemid","Diuretik mengurangi kongesti dan edema, tetapi tidak menurunkan resistensi vaskular paru."],["Bisoprolol","Beta blocker tidak berperan dan dapat memicu bronkospasme pada penyakit paru obstruktif."],["Nifedipin","Calcium channel blocker hanya bermanfaat pada hipertensi arteri pulmonalis yang responsif uji vasoreaktivitas, bukan cor pulmonale hipoksik."],["Salbutamol","Bronkodilator melegakan obstruksi jalan napas, bukan menurunkan tekanan pulmonal secara langsung."]],a:0,e:"Terapi oksigen jangka panjang lebih dari 15 jam per hari terbukti menurunkan mortalitas pada PPOK dengan hipoksemia kronik dan cor pulmonale."},
{t:"Cor Pulmonale",s:"3B",q:"Seorang pria 78 tahun datang ke IGD dengan sesak napas tiba-tiba sejak kemarin disertai batuk berdarah dan nyeri dada. Ia memiliki riwayat penyumbatan pembuluh darah di kaki. Pemeriksaan fisik TD 90/60 mmHg, HR 125x/menit, RR 28x/menit, T 36,5 C, edema dan eritema berbatas tidak tegas pada kruris dekstra. EKG menunjukkan P pulmonal dan deviasi aksis ke kanan. Apakah diagnosis pasien tersebut?",o:[["Cor pulmonale akut e.c. fibrosis paru","Fibrosis paru menyebabkan hipertensi pulmonal kronik, bukan akut."],["Cor pulmonale akut e.c. penyakit paru obstruktif kronis","PPOK menimbulkan cor pulmonale kronik yang berjalan bertahun-tahun."],["Cor pulmonale akut e.c. pneumonitis","Pneumonitis memberi demam dan infiltrat, bukan hemoptisis mendadak dengan tanda DVT."],["Cor pulmonale akut e.c. emboli pulmo","BENAR. Sesak mendadak, hemoptisis, nyeri dada, hipotensi, dan tanda trombosis vena tungkai menunjukkan emboli paru sebagai penyebab gagal jantung kanan akut."],["Cor pulmonale akut e.c. tuberkulosis","Tuberkulosis memberi gejala kronik dengan penurunan berat badan dan keringat malam."]],a:3,e:"Emboli paru masif menyebabkan peningkatan afterload ventrikel kanan mendadak sehingga terjadi cor pulmonale akut. Tanda EKG penunjang adalah takikardia sinus, S1Q3T3, RBBB baru, dan T inversi di V1 sampai V4."},
{t:"Aritmia",s:"3B",q:"Seorang pria 70 tahun datang ke IGD dengan berdebar sejak 2 jam disertai mual, muntah, dan keringat dingin. Pemeriksaan fisik TD 110/70 mmHg, HR 178x/menit, RR 30x/menit, T 36 C. EKG menunjukkan takikardia QRS sempit yang sangat reguler tanpa gelombang P yang teridentifikasi, dan manuver vagal sudah gagal. Apakah tatalaksana selanjutnya?",o:[["Kardioversi monofasik 100 Joule","Kardioversi dilakukan bila pasien tidak stabil atau obat gagal, sedangkan pasien ini masih stabil."],["Digoksin 0,25 mg","Digoksin bukan pilihan untuk terminasi SVT akut."],["Adenosin 6 mg","BENAR. Setelah manuver vagal gagal pada SVT stabil, berikan adenosin 6 mg bolus cepat, dapat diulang 12 mg."],["Bisoprolol 2,5 mg","Beta blocker oral terlalu lambat untuk terminasi takiaritmia akut."],["Kardioversi bifasik 200 Joule","Energi tersebut adalah dosis defibrilasi, bukan kardioversi SVT yang cukup 50 sampai 100 J."]],a:2,e:"Adenosin bekerja memblok nodus AV secara sangat singkat sehingga memutus sirkuit reentri. Berikan bolus cepat melalui vena besar diikuti flush salin, dan peringatkan pasien akan rasa tidak nyaman sesaat di dada."},
{t:"Aritmia",s:"3B",q:"Seorang pria 60 tahun datang ke IGD dengan berdebar sejak 2 jam disertai mual, muntah, dan keringat dingin. Pemeriksaan fisik TD 120/80 mmHg, HR 178x/menit, RR 30x/menit, T 36,2 C. EKG menunjukkan takikardia QRS sempit reguler. Dokter berencana melakukan tatalaksana nonfarmakologis awal berupa pijat sinus karotis. Apakah kontraindikasi tindakan tersebut?",o:[["Riwayat penyakit tiroid dalam 1 tahun terakhir","Penyakit tiroid memengaruhi pilihan obat antiaritmia, bukan kontraindikasi manuver vagal."],["Riwayat penyakit jantung koroner dalam 2 tahun terakhir","BENAR. Pijat sinus karotis dikontraindikasikan pada riwayat infark miokard, stroke atau TIA belum lama, serta adanya bruit karotis karena risiko emboli plak."],["Usia lebih dari 40 tahun","Usia bukan kontraindikasi mutlak meskipun aterosklerosis lebih sering pada usia lanjut."],["Riwayat aritmia jantung","Riwayat aritmia justru merupakan latar belakang keluhan, bukan kontraindikasi."],["Riwayat hipertensi","Hipertensi bukan kontraindikasi tindakan ini."]],a:1,e:"Manuver vagal aman dan murah, namun pijat karotis harus dihindari bila ada risiko plak karotis. Alternatif yang lebih aman adalah manuver Valsalva termodifikasi dengan elevasi tungkai."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang pria 55 tahun datang ke IGD dengan penurunan kesadaran sejak 15 menit setelah mengeluh nyeri dada hebat. Ia mengalami serangan jantung 1 tahun lalu. Pemeriksaan fisik TD 150/90 mmHg, HR 152x/menit, nadi karotis masih teraba. EKG menunjukkan takikardia kompleks QRS lebar monomorfik. Apakah interpretasi EKG dan tatalaksana awal yang tepat?",o:[["Ventrikel takikardi dan resusitasi jantung paru","RJP hanya dilakukan bila nadi tidak teraba."],["Ventrikel takikardi dan kardioversi","BENAR. VT dengan nadi disertai penurunan kesadaran termasuk takikardia tidak stabil sehingga membutuhkan kardioversi tersinkronisasi segera."],["Ventrikel fibrilasi dan kardioversi","Fibrilasi ventrikel tidak menghasilkan nadi dan ditangani defibrilasi tanpa sinkronisasi."],["Ventrikel fibrilasi dan amiodarone","Amiodaron pada VF hanya diberikan setelah kejut listrik ketiga."],["Ventrikel takikardi dan adenosin","Adenosin dipakai pada takikardia QRS sempit yang stabil."]],a:1,e:"Riwayat infark miokard sangat meningkatkan kemungkinan takikardia QRS lebar adalah VT. Bila ragu, perlakukan sebagai VT dan jangan memberikan verapamil."},
{t:"Aritmia",s:"3B",q:"Seorang wanita 64 tahun datang ke IGD dengan sesak, pusing, dan mual muntah sejak 1 jam. Pemeriksaan fisik TD 80/50 mmHg, HR 35x/menit, RR 32x/menit, T 36 C. EKG menunjukkan bradikardia dengan gelombang P dan kompleks QRS yang tidak berhubungan. Apakah tatalaksana yang tepat pada kasus tersebut?",o:[["Atropin bolus 1 mg","BENAR. Bradikardia simtomatik dengan hipotensi ditangani atropin 1 mg intravena sebagai langkah pertama sambil menyiapkan pacu jantung transkutan."],["Resusitasi cairan","Hipotensi pada pasien ini disebabkan laju jantung yang sangat lambat, bukan hipovolemia."],["Dopamin 5 mikrogram per kilogram per menit","Dopamin adalah pilihan lini kedua bila atropin gagal."],["Transcutaneous pacemaker","Pacu transkutan sangat efektif pada blok derajat tinggi, namun pada algoritma ACLS atropin diberikan lebih dahulu karena tersedia segera."],["Monitor dan observasi","Observasi berbahaya karena pasien sudah menunjukkan tanda hipoperfusi."]],a:0,e:"Perlu diingat atropin sering kurang efektif pada blok AV derajat tinggi dengan blok infranodal, sehingga pacu jantung dan konsultasi kardiologi harus disiapkan bersamaan."},
{t:"Aritmia",s:"3A",q:"Seorang wanita 53 tahun datang ke poli dengan jantung berdebar sejak 1 bulan terakhir yang hilang timbul. Pemeriksaan fisik TD 140/90 mmHg, HR 110x/menit, RR 24x/menit, T 36,5 C. EKG saat ini menunjukkan denyut ektopik yang hanya sesekali muncul. Apakah pemeriksaan penunjang untuk memantau frekuensi dan morfologi denyut ektopik tersebut?",o:[["Ambulatory blood pressure monitoring","ABPM memantau tekanan darah 24 jam, bukan irama jantung."],["Ambulatory ECG monitoring","BENAR. Holter atau perekaman EKG ambulatori 24 sampai 48 jam menghitung beban dan morfologi denyut ektopik sepanjang hari."],["Echocardiography","Ekokardiografi menilai struktur dan fungsi jantung, bukan frekuensi ektopik."],["Angiography","Angiografi menilai anatomi koroner."],["Ultrasonography","USG umum tidak menilai irama jantung."]],a:1,e:"Beban PVC harian penting karena beban lebih dari 10 sampai 15 persen berhubungan dengan kardiomiopati akibat PVC. Morfologi membantu menentukan lokasi asal fokus."},
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang wanita 64 tahun kontrol ke poliklinik setelah dirawat karena serangan jantung 3 minggu lalu. Saat ini tidak ada keluhan dan obat diminum teratur. Tanda vital TD 140/71 mmHg, HR 97x/menit, RR 22x/menit, T 36,4 C. EKG menunjukkan QRS lebar lebih dari 120 ms dengan kompleks berlekuk di V5 sampai V6 dan pola QS di V1. Apakah diagnosis dan penyebab yang mendasari?",o:[["RBBB akibat penyakit jantung iskemik","RBBB memberi pola rsR aksen di V1 dan lebih sering berkaitan dengan penyakit jantung kanan."],["RBBB akibat cor pulmonale","Cor pulmonale memang penyebab RBBB, tetapi gambaran EKG pasien ini bukan RBBB."],["RBBB akibat emboli paru","Emboli paru dapat memberi RBBB akut, namun tidak sesuai gambaran maupun riwayat pasien."],["LBBB akibat penyakit jantung iskemik","BENAR. Pola QRS lebar dengan kompleks berlekuk di sadapan lateral dan QS di V1 adalah LBBB, yang pada pasien pasca infark disebabkan penyakit jantung iskemik."],["LBBB akibat stenosis aorta","Stenosis aorta juga dapat menyebabkan LBBB, tetapi pasien ini memiliki riwayat infark yang jelas dan tanpa murmur ejeksi."]],a:3,e:"LBBB hampir selalu menandakan penyakit jantung struktural, tersering penyakit jantung iskemik, hipertensi lama, kardiomiopati, dan stenosis aorta. LBBB baru dengan nyeri dada dikelola sebagai setara STEMI."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang pria 50 tahun dibawa ke IGD oleh warga dengan penurunan kesadaran. Pemeriksaan fisik menunjukkan nadi tidak teraba. Monitor EKG menampilkan irama terorganisir dengan kompleks QRS teratur. Apakah diagnosis dan tatalaksana pasien tersebut?",o:[["Pulseless electrical activity dan norepinefrin","Norepinefrin bukan obat henti jantung."],["Pulseless electrical activity dan epinefrin","BENAR. Aktivitas listrik tanpa nadi ditangani dengan RJP berkualitas tinggi ditambah epinefrin 1 mg tiap 3 sampai 5 menit sambil mencari penyebab 5H dan 5T."],["Pulseless electrical activity dan kompresi dada saja","Kompresi wajib, namun jawaban ini tidak lengkap tanpa vasopresor."],["Pulseless electrical activity dan defibrilasi","PEA bukan irama yang dapat dikejut."],["Pulseless electrical activity dan sulfas atropin","Atropin sudah dihapus dari algoritma henti jantung sejak pedoman 2010."]],a:1,e:"PEA dan asistol adalah irama nonshockable. Kunci keberhasilan adalah kompresi minim interupsi, epinefrin dini, dan koreksi penyebab reversibel seperti hipovolemia, hipoksia, hiperkalemia, tamponade, tension pneumothorax, dan trombosis."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang pria 43 tahun dibawa ke IGD karena pingsan mendadak 15 menit lalu. GCS 1-1-1 tanpa nadi dan napas. Dokter melakukan resusitasi jantung paru sementara perawat memasang monitor yang menampilkan gelombang ireguler tanpa kompleks QRS yang dapat dikenali. Akses intravena sudah terpasang. Apakah tatalaksana selanjutnya?",o:[["Epinefrin","Epinefrin diberikan setelah kejut listrik pertama pada irama yang dapat dikejut."],["Identifikasi penyebab reversibel 5H dan 5T","Pencarian penyebab dilakukan paralel, tetapi tidak menunda defibrilasi."],["Kardioversi","Sinkronisasi tidak mungkin dilakukan pada fibrilasi ventrikel."],["Amiodaron","Amiodaron diberikan setelah kejut ketiga pada VF refrakter."],["Defibrilasi","BENAR. Fibrilasi ventrikel adalah irama shockable sehingga defibrilasi segera adalah tindakan dengan dampak terbesar terhadap kelangsungan hidup."]],a:4,e:"Setiap menit keterlambatan defibrilasi menurunkan kemungkinan hidup sekitar 7 sampai 10 persen. Setelah kejut, langsung lanjutkan kompresi 2 menit tanpa memeriksa nadi terlebih dahulu."},
