{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang wanita 25 tahun datang dengan demam dan sesak sejak 5 hari, disertai nyeri tenggorok, nyeri berpindah di persendian, dan benjolan di tangan. Pemeriksaan fisik TD 130/80 mmHg, HR 100x/menit, RR 32x/menit, T 38,5 C, CRT kurang dari 2 detik, akral hangat. EKG menunjukkan pemanjangan interval PR. Apakah etiologi tersering pada kasus ini?",o:[["Kelompok bakteri HACEK","HACEK menyebabkan endokarditis kultur negatif, bukan demam rematik."],["Streptococcus viridans","Streptococcus viridans menyebabkan endokarditis subakut pasca tindakan gigi."],["Staphylococcus aureus","S. aureus menyebabkan endokarditis akut, terutama pada pengguna narkoba suntik."],["Streptococcus beta hemolyticus grup A","BENAR. Demam rematik akut merupakan sekuele imunologis faringitis Streptococcus pyogenes atau beta hemolitikus grup A."],["Candida species","Kandida menyebabkan endokarditis jamur pada pasien imunokompromis atau katup prostetik."]],a:3,e:"Pemanjangan PR adalah kriteria minor Jones. Pencegahan primer demam rematik adalah pengobatan adekuat faringitis streptokokus dengan penisilin selama 10 hari."},
{t:"Kardiomiopati dan Perikardium",s:"3A",q:"Pria usia 34 tahun datang ke IGD dengan nyeri dada sejak 3 hari yang dirasakan terutama saat berbaring dan membaik saat duduk. Ia mengalami serangan jantung 3 minggu sebelumnya. Pemeriksaan fisik TD 140/85 mmHg, HR 130x/menit, RR 24x/menit, T 37,8 C, terdengar pericardial friction rub. EKG menunjukkan elevasi ST di seluruh sadapan. Apakah diagnosisnya?",o:[["Infark miokard akut berulang","Reinfark memberi elevasi ST regional dengan nyeri iskemik tipikal dan peningkatan biomarka ulang."],["STEMI","STEMI tidak memberikan elevasi ST difus dengan friction rub."],["Miokarditis","Miokarditis menyebabkan disfungsi ventrikel dan gagal jantung, tanpa nyeri posisional khas."],["Perikarditis","BENAR. Nyeri dada posisional, friction rub, demam, dan elevasi ST difus tiga minggu pasca infark adalah sindrom Dressler atau perikarditis pasca infark."],["Tamponade jantung","Tamponade memberi trias Beck berupa hipotensi, JVP meningkat, dan bunyi jantung menjauh."]],a:3,e:"Sindrom Dressler adalah perikarditis autoimun yang muncul beberapa minggu pasca infark. Terapi menggunakan aspirin dosis tinggi dan kolkisin, sementara NSAID lain serta kortikosteroid dihindari karena mengganggu penyembuhan miokard."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang wanita 26 tahun datang ke IGD dengan dada berdebar dan terasa tidak nyaman sejak 3 hari, tanpa nyeri dada maupun sesak. Ia mengalami demam yang tidak kunjung sembuh sejak 1 minggu. Tanda vital TD 140/90 mmHg, HR 100x/menit, RR 22x/menit, T 37,9 C. Pemeriksaan fisik menemukan perdarahan konjungtiva, bercak kemerahan tidak nyeri di telapak tangan, dan murmur holosistolik di ICS IV linea aksilaris anterior. Apakah nama bercak di telapak tangan tersebut?",o:[["Osler nodes","Nodus Osler berupa nodul yang nyeri pada pulpa jari, bukan bercak datar tidak nyeri di telapak tangan."],["Janeway lesion","BENAR. Lesi Janeway adalah makula eritematosa tidak nyeri di telapak tangan dan kaki akibat mikroemboli septik."],["Splinter hemorrhage","Splinter hemorrhage berupa garis perdarahan linear di bawah kuku."],["Roth spot","Roth spot adalah perdarahan retina dengan pusat pucat yang tampak pada funduskopi."],["Nailbed hemorrhage","Istilah ini merujuk perdarahan pada dasar kuku dan bukan penamaan baku fenomena vaskular endokarditis."]],a:1,e:"Fenomena vaskular endokarditis meliputi lesi Janeway, emboli arteri, dan perdarahan konjungtiva, sedangkan fenomena imunologis meliputi nodus Osler, Roth spot, dan glomerulonefritis. Keduanya kriteria minor Duke."},
{t:"Kardiomiopati dan Perikardium",s:"1",q:"Seorang pria 40 tahun datang ke IGD dengan sesak memberat sejak 2 jam dan sering sesak bila berjalan jauh sejak 3 bulan. Ia memiliki riwayat kanker tiroid dan sedang menjalani radioterapi. Pemeriksaan TD 130/90 mmHg, HR 118x/menit, RR 28x/menit, T 36,2 C, SpO2 91 persen. EKG menunjukkan low voltage, foto toraks menunjukkan kardiomegali dengan batwing appearance dan ukuran ventrikel yang tidak membesar pada ekokardiografi disertai gangguan pengisian diastolik. Apakah kemungkinan diagnosisnya?",o:[["Kardiomiopati hipertrofi","Kardiomiopati hipertrofi bersifat genetik dengan penebalan septum asimetris, bukan akibat radiasi."],["Kardiomiopati dilatasi","Kardiomiopati dilatasi menunjukkan dilatasi ruang jantung dengan fraksi ejeksi menurun."],["Kardiomiopati restriktif","BENAR. Radioterapi dada, amiloidosis, dan fibrosis endomiokardial menyebabkan miokard kaku dengan gangguan pengisian diastolik dan ukuran ventrikel normal."],["Kardiomiopati autoimun","Istilah ini bukan klasifikasi baku kardiomiopati."],["Kardiomiopati aritmogenik","Kardiomiopati ventrikel kanan aritmogenik bersifat genetik dan bermanifestasi sebagai aritmia ventrikel serta kematian mendadak."]],a:2,e:"Kardiomiopati restriktif memberikan gagal jantung kanan dominan dengan JVP meningkat, asites, dan tekanan pengisian tinggi. Diagnosis banding utamanya adalah perikarditis konstriktif."},
{t:"Penyakit Jantung Kongenital",s:"2",q:"Anak laki-laki usia 10 bulan dibawa ibunya ke puskesmas karena berat badan sulit naik. Anak tampak sesak namun tidak biru. Pemeriksaan fisik HR 125x/menit, RR 34x/menit, T 37,3 C, tidak tampak retraksi, dan pada auskultasi jantung terdengar wide fixed splitting S2. Apakah diagnosisnya?",o:[["Koarktasio aorta","Koarktasio memberi hipertensi lengan dengan pulsasi femoral melemah dan perbedaan tekanan darah ekstremitas atas dan bawah."],["Tetralogy of Fallot","Tetralogi Fallot bersifat sianotik dengan murmur ejeksi sistolik dan squatting."],["Transposition of great arteries","TGA menyebabkan sianosis berat sejak hari pertama kehidupan."],["Ventricular septal defect","VSD memberi murmur pansistolik kasar di parasternal kiri bawah tanpa fixed splitting."],["Atrial septal defect","BENAR. Wide fixed splitting S2 tanpa sianosis dengan gagal tumbuh adalah gambaran khas defek septum atrium."]],a:4,e:"Pada ASD, volume ventrikel kanan meningkat sepanjang siklus pernapasan sehingga splitting tidak berubah dengan respirasi. Penutupan dianjurkan bila rasio aliran paru terhadap sistemik lebih dari 1,5."},
{t:"Penyakit Katup",s:"2",q:"Seorang wanita 45 tahun datang ke poliklinik dengan sesak hilang timbul sejak 3 bulan dan baru berobat sekarang. Tanda vital TD 120/80 mmHg, HR 125x/menit, RR 28x/menit, T 36,5 C, SpO2 95 persen. Auskultasi menemukan murmur diastolik pada area ICS IV parasternal sinistra yang mengeras saat inspirasi. Apakah gangguan katup yang dialami pasien?",o:[["Regurgitasi mitral","Regurgitasi mitral memberi murmur sistolik di apeks yang menjalar ke aksila."],["Regurgitasi trikuspid","Regurgitasi trikuspid memberi murmur sistolik, bukan diastolik, meskipun lokasinya sama."],["Stenosis mitral","Stenosis mitral memberi murmur diastolik di apeks dengan opening snap."],["Stenosis trikuspid","BENAR. Murmur diastolik di area trikuspid ICS IV parasternal kiri yang mengeras saat inspirasi menandakan stenosis trikuspid."],["Stenosis pulmonal","Stenosis pulmonal memberi murmur ejeksi sistolik di ICS II parasternal kiri."]],a:3,e:"Manuver Carvallo, yaitu penguatan murmur saat inspirasi, membantu membedakan kelainan katup jantung kanan dari kiri karena inspirasi meningkatkan aliran balik vena ke jantung kanan."},
{t:"Gagal Jantung",s:"3B",q:"Perempuan usia 50 tahun datang ke IGD dengan sesak yang memberat sejak 1 jam. Sesak sebelumnya sering muncul saat berjalan jauh dan pasien tidur dengan dua bantal, namun belum pernah didiagnosis penyakit jantung maupun mendapat terapi. Pemeriksaan fisik TD 160/90 mmHg, HR 105x/menit, RR 24x/menit, T 36,9 C, ronki basah halus di seluruh lapang paru, dan pitting edema. Foto toraks menunjukkan CTR 65 persen. Apakah diagnosis yang tepat?",o:[["Gagal jantung kronis","Gagal jantung kronis tidak menjelaskan perburukan mendadak yang mengancam saat ini."],["Acute de novo heart failure","BENAR. Ini adalah episode gagal jantung akut pertama tanpa diagnosis atau terapi gagal jantung sebelumnya, sehingga disebut de novo."],["Acute decompensated heart failure","Istilah dekompensasi akut dipakai bila sudah ada gagal jantung kronik yang terdiagnosis sebelumnya."],["Cor pulmonale dekompensata","Cor pulmonale membutuhkan penyakit paru kronik sebagai penyebab dasar."],["Acute coronary syndrome","SKA memberi nyeri dada iskemik dengan perubahan EKG dan peningkatan troponin."]],a:1,e:"Membedakan de novo dan dekompensasi penting untuk penelusuran etiologi. Gagal jantung de novo menuntut pencarian pencetus seperti infark akut, krisis hipertensi, miokarditis, atau takiaritmia."},
{t:"Cor Pulmonale",s:"3A",q:"Pria usia 65 tahun datang dengan bengkak pada kedua kaki yang memberat sejak 2 hari, disertai sesak dan batuk berdahak putih sejak lama. Ia merokok 2 bungkus sehari sejak 30 tahun lalu. Tanda vital TD 120/85 mmHg, HR 80x/menit, RR 24x/menit, T 36,5 C. Pemeriksaan fisik menemukan barrel chest, peningkatan JVP, dan edema kedua ekstremitas inferior. Apakah diagnosis kasus tersebut?",o:[["Cor pulmonale dekompensata","BENAR. Penyakit paru obstruktif kronik dengan tanda gagal jantung kanan berupa JVP meningkat dan edema tungkai menandakan cor pulmonale yang sudah dekompensasi."],["Cor pulmonale kompensata","Fase kompensata belum menunjukkan tanda bendungan sistemik seperti edema dan JVP meningkat."],["Gagal jantung kanan","Istilah ini benar secara umum, tetapi tidak menyebut penyakit paru sebagai penyebabnya sehingga kurang spesifik."],["Gagal jantung kiri","Gagal jantung kiri memberi kongesti paru berupa ortopnea dan ronki basah halus."],["Syok kardiogenik","Syok kardiogenik menunjukkan hipotensi dan hipoperfusi, sedangkan pasien ini hemodinamik stabil."]],a:0,e:"Cor pulmonale dekompensata ditangani dengan oksigen, bronkodilator, diuretik hati-hati agar tidak menurunkan curah jantung kanan, dan tata laksana eksaserbasi penyakit paru dasarnya."},
{t:"Penyakit Katup",s:"2",q:"Pria usia 45 tahun dibawa ke poliklinik dengan mudah lelah dan sesak hilang timbul sejak 3 bulan, disertai kaki bengkak hilang timbul dalam 2 bulan terakhir. Ia memiliki riwayat hipertensi sejak 20 tahun. Tanda vital TD 140/90 mmHg dengan tekanan nadi lebar, HR 90x/menit, RR 20x/menit, T 37,1 C. Pemeriksaan fisik menemukan murmur diastolik grade III per IV di linea parasternal kanan ICS 2. Apakah kemungkinan diagnosisnya?",o:[["Stenosis pulmonal","Stenosis pulmonal memberi murmur ejeksi sistolik di ICS II parasternal kiri."],["Regurgitasi aorta","BENAR. Murmur diastolik dekresendo di area aorta ICS II parasternal kanan disertai tekanan nadi lebar adalah gambaran regurgitasi aorta."],["Regurgitasi mitral","Regurgitasi mitral memberi murmur holosistolik di apeks."],["Regurgitasi trikuspid","Regurgitasi trikuspid memberi murmur sistolik di parasternal kiri bawah."],["Stenosis trikuspid","Stenosis trikuspid memberi murmur diastolik di ICS IV parasternal kiri."]],a:1,e:"Regurgitasi aorta kronik memberi tanda perifer khas seperti pulsus bisferiens, Corrigan water hammer pulse, dan tanda de Musset akibat volume sekuncup besar dengan tekanan diastolik rendah."},
{t:"Aritmia",s:"3A",q:"Seorang pria 36 tahun datang ke IGD dengan berdebar sejak 1 jam. Pemeriksaan fisik TD 130/90 mmHg, HR 130x/menit, RR 24x/menit, T 36,5 C, nyeri dada negatif, sianosis negatif, eksoftalmus positif, dan massa tiroid difus positif. EKG menunjukkan irama ireguler tanpa gelombang P yang jelas dengan interval R-R bervariasi. Apakah diagnosis pada pasien tersebut?",o:[["Atrial fibrilasi","BENAR. Irama ireguler tanpa gelombang P dengan R-R yang sangat bervariasi pada pasien tirotoksikosis adalah fibrilasi atrium."],["Atrial flutter","Flutter menunjukkan gelombang gigi gergaji dengan konduksi yang sering teratur."],["Supraventrikular takikardia","SVT sangat reguler dengan laju biasanya di atas 150x/menit."],["Ventrikular takikardia","VT menghasilkan QRS lebar."],["Ventrikular ekstrasistol","Ekstrasistol hanya berupa denyut prematur sesekali di antara irama dasar."]],a:0,e:"Hipertiroid adalah penyebab reversibel fibrilasi atrium. Tatalaksana mencakup kontrol laju dengan beta blocker, terapi tiroid, dan penilaian risiko stroke dengan skor CHA2DS2-VASc."},
{t:"Aritmia",s:"1",q:"Seorang pria berusia 20 tahun dibawa ke IGD dengan pingsan sejak 15 menit sebelum masuk rumah sakit, disertai sesak napas. Terdapat riwayat kematian mendadak pada keluarga. Pemeriksaan fisik TD 130/90 mmHg, HR 95x/menit, RR 22x/menit, T 36,6 C. EKG menunjukkan elevasi segmen ST cekung ke bawah menyerupai pelana kuda di sadapan V1 sampai V2 dengan pola menyerupai blok cabang berkas kanan. Apakah diagnosis yang tepat?",o:[["Ventricular extrasystole","Ekstrasistol tidak memberikan pola elevasi ST khas di sadapan prekordial kanan."],["Brugada syndrome","BENAR. Pola coved atau saddleback ST elevation di V1 sampai V2 dengan sinkop dan riwayat kematian mendadak keluarga adalah sindrom Brugada."],["Wolff-Parkinson-White syndrome","WPW memberi PR pendek dengan gelombang delta dan QRS melebar."],["Atrial flutter","Flutter memberi gelombang gigi gergaji."],["AV block","Blok AV memberi gangguan hubungan P dan QRS."]],a:1,e:"Sindrom Brugada adalah kanalopati natrium yang berisiko fibrilasi ventrikel dan kematian mendadak, terutama saat demam dan tidur. Terapi definitif pada pasien simtomatik adalah pemasangan ICD."},
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang pria usia 55 tahun datang ke IGD dengan jantung berdebar sejak 2 jam dan riwayat gangguan irama sebelumnya. Pemeriksaan fisik TD 80/60 mmHg, HR 35x/menit, RR 26x/menit, T 36,7 C. EKG menunjukkan gelombang P dengan laju sekitar 90x/menit dan kompleks QRS dengan laju 35x/menit yang tidak memiliki hubungan tetap satu sama lain. Apakah diagnosisnya?",o:[["AV block derajat 1","Blok derajat 1 hanya memanjangkan interval PR lebih dari 0,20 detik dengan setiap P tetap diikuti QRS."],["AV block derajat 2 Mobitz 1","Mobitz 1 menunjukkan pemanjangan PR progresif hingga satu QRS hilang lalu siklus berulang."],["AV block derajat 2 Mobitz 2","Mobitz 2 menunjukkan PR konstan dengan QRS yang hilang mendadak tanpa pemanjangan sebelumnya."],["Total AV block","BENAR. Disosiasi total antara gelombang P dan kompleks QRS dengan laju ventrikel sangat lambat adalah blok AV derajat 3."],["Right bundle branch block","RBBB mengubah morfologi QRS tanpa memutus hubungan atrium dan ventrikel."]],a:3,e:"Blok AV total simtomatik adalah indikasi pacu jantung permanen. Sebelum itu, stabilkan dengan atropin, pacu transkutan, atau infus kronotropik dan hindari obat penghambat nodus AV."},
{t:"Kegawatan Kardiovaskular",s:"4A",q:"Seorang laki-laki 40 tahun datang ke IGD puskesmas karena sesak napas setelah disengat sekitar 50 tawon vespa. Sesak disertai nyeri kepala dan bengkak seluruh badan. Pemeriksaan fisik TD 90/60 mmHg, HR 105x/menit, RR 32x/menit, T 36,5 C, edema wajah, dan eritema seluruh badan. Apakah diagnosis dan tatalaksana yang tepat?",o:[["Syok anafilaktik dan kortikosteroid","Kortikosteroid hanya terapi tambahan untuk mencegah reaksi bifasik, bukan penyelamat nyawa."],["Syok kardiogenik dan norepinefrin","Tidak ada bukti kegagalan pompa jantung pada kasus ini."],["Syok hipovolemik dan terapi cairan","Cairan memang diberikan, tetapi mekanisme utamanya distributif akibat reaksi anafilaksis."],["Syok anafilaktik dan epinefrin","BENAR. Anafilaksis ditangani dengan epinefrin 0,3 sampai 0,5 mg intramuskular di paha anterolateral sebagai terapi lini pertama."],["Angioedema dan antihistamin","Angioedema tanpa hipotensi dapat cukup ditangani antihistamin, sedangkan pasien ini sudah syok."]],a:3,e:"Keterlambatan epinefrin adalah penyebab utama kematian anafilaksis. Setelah epinefrin, berikan oksigen, cairan kristaloid, posisi terlentang dengan tungkai ditinggikan, serta observasi minimal 6 sampai 12 jam."},
{t:"Penyakit Jantung Kongenital",s:"2",q:"Seorang anak usia 9 bulan dibawa orang tuanya ke poli karena sering sesak, suara serak, dan batuk darah. Anak malas menyusu dan berat badan sulit naik. Ia lahir cukup bulan spontan tanpa riwayat kebiruan maupun kuning. Pemeriksaan fisik menemukan murmur holosistolik pada ICS IV parasternalis sinistra. Apakah kemungkinan diagnosisnya?",o:[["Atrial septal defect","ASD memberi wide fixed splitting S2 tanpa murmur pansistolik kasar."],["Patent ductus arteriosus","PDA memberi murmur kontinu seperti mesin di infraklavikula kiri."],["Koarktasio aorta","Koarktasio memberi perbedaan tekanan darah ekstremitas atas dan bawah dengan pulsasi femoral lemah."],["Ventricular septal defect","BENAR. Murmur holosistolik di ICS III sampai IV parasternal kiri dengan gagal tumbuh dan gagal jantung tanpa sianosis adalah VSD."],["Tetralogy of Fallot","Tetralogi Fallot bersifat sianotik dan disertai squatting."]],a:3,e:"VSD besar menyebabkan pirau kiri ke kanan sehingga aliran ke paru berlebih, memicu infeksi respiratorik berulang dan gagal tumbuh. Suara serak dapat terjadi akibat penekanan nervus laringeus rekuren atau sindrom Ortner."},
{t:"Aritmia",s:"3B",q:"Seorang pria usia 34 tahun datang diantar keluarga ke IGD dengan penurunan kesadaran. Tanda vital TD 80 per palpasi, HR 160x/menit, RR 30x/menit, T 36,5 C, akral dingin. EKG menunjukkan takikardia kompleks QRS lebar monomorfik dengan nadi masih teraba lemah. Apakah tatalaksana yang tepat?",o:[["Kardioversi 100 Joule dilanjutkan amiodaron","BENAR. Takikardia ventrikel tidak stabil dengan nadi ditangani kardioversi tersinkronisasi, lalu amiodaron sebagai rumatan pencegah kekambuhan."],["Kardioversi 100 Joule dilanjutkan magnesium sulfat","Magnesium diindikasikan pada torsade de pointes dengan pemanjangan QT."],["Defibrilasi 360 Joule monofasik dilanjutkan resusitasi jantung paru","Defibrilasi hanya untuk pasien tanpa nadi."],["Kardioversi 200 Joule dilanjutkan amiodaron","Energi awal kardioversi untuk takikardia QRS lebar monomorfik adalah 100 J, dinaikkan bertahap bila gagal."],["Kardioversi 200 Joule dilanjutkan magnesium sulfat","Selain energi awal terlalu tinggi, magnesium bukan pilihan pada VT monomorfik."]],a:0,e:"Energi kardioversi tersinkronisasi: fibrilasi atrium 120 sampai 200 J bifasik, flutter dan SVT 50 sampai 100 J, VT monomorfik dengan nadi 100 J. Selalu beri sedasi bila pasien masih sadar."},
{t:"Penyakit Jantung Koroner",s:"—",st:"Kompetensi patologi klinik",q:"Seorang perempuan usia 87 tahun datang ke IGD dengan nyeri dada tertekan sejak 6 jam disertai keringat dingin. Pemeriksaan fisik TD 150/90 mmHg, HR 85x/menit, RR 24x/menit, T 36,5 C. EKG menunjukkan depresi ST dan T inversi di lead II, III, aVF. Dokter ingin memeriksa biomarka jantung. Apakah biomarka dengan onset paling cepat pada sindrom koroner akut?",o:[["CKMB","CKMB mulai meningkat sekitar 3 sampai 6 jam dan berguna mendeteksi reinfark."],["BNP","BNP adalah penanda regangan dinding ventrikel pada gagal jantung, bukan nekrosis miokard."],["Troponin I","Troponin I paling spesifik namun mulai meningkat sekitar 3 sampai 4 jam."],["Troponin T","Troponin T memiliki kinetik serupa troponin I dan bertahan lebih lama."],["Mioglobin","BENAR. Mioglobin meningkat paling dini yaitu sekitar 1 sampai 2 jam pasca cedera miokard, meski spesifisitasnya rendah."]],a:4,e:"Mioglobin berguna untuk menyingkirkan infark secara dini karena nilai prediksi negatifnya tinggi, namun konfirmasi tetap memakai troponin high sensitivity yang jauh lebih spesifik."},
{t:"Kardiomiopati dan Perikardium",s:"1",q:"Seorang pria berusia 35 tahun dibawa ke IGD oleh teman-temannya setelah pingsan saat bermain badminton. Ia merupakan atlet renang sejak usia 6 tahun dan tidak memiliki riwayat penyakit sebelumnya. Pemeriksaan fisik TD 130/90 mmHg, HR 125x/menit, RR 20x/menit, T 36,5 C, terdengar murmur ejeksi sistolik yang mengeras saat manuver Valsalva. Apakah kemungkinan diagnosisnya?",o:[["Kardiomiopati hipertrofi","BENAR. Sinkop saat aktivitas berat pada atlet muda dengan murmur yang mengeras saat Valsalva adalah gambaran kardiomiopati hipertrofi obstruktif."],["Kardiomiopati dilatasi","Kardiomiopati dilatasi memberi gagal jantung progresif, bukan sinkop mendadak saat olahraga pada usia muda sehat."],["Kardiomiopati restriktif","Kardiomiopati restriktif memberi gagal jantung kanan dengan tekanan pengisian tinggi."],["Kardiomiopati takotsubo","Takotsubo dipicu stres emosional dan lebih sering pada perempuan pascamenopause."],["Kardiomiopati infektif","Istilah yang tepat adalah miokarditis, yang biasanya didahului infeksi virus."]],a:0,e:"Kardiomiopati hipertrofi adalah penyebab tersering kematian jantung mendadak pada atlet muda. Ciri khasnya murmur mengeras saat Valsalva dan berdiri karena preload menurun sehingga obstruksi bertambah."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang pria usia 55 tahun datang dengan nyeri dada sejak 6 jam yang menjalar ke lengan kiri dan punggung. Pemeriksaan fisik TD 75/50 mmHg, HR 115x/menit, RR 25x/menit, T 36,5 C, akral teraba dingin dengan produksi urin menurun. EKG menunjukkan elevasi ST di lead II, III, aVF dan pemberian cairan tidak memperbaiki tekanan darah. Apakah tatalaksana yang diberikan?",o:[["Norepinefrin","BENAR. Syok kardiogenik dengan tekanan sistolik sangat rendah membutuhkan norepinefrin sebagai vasopresor pilihan untuk mempertahankan tekanan perfusi."],["Dobutamine","Dobutamin memperbaiki curah jantung namun dapat menurunkan tekanan darah lebih lanjut bila diberikan tunggal pada hipotensi berat."],["Dopamine","Dopamin meningkatkan kejadian aritmia dan mortalitas dibandingkan norepinefrin pada syok kardiogenik."],["Atropin","Atropin hanya untuk bradikardia simtomatik, sedangkan pasien ini takikardia."],["Adenosin","Adenosin dipakai untuk terminasi takikardia supraventrikular."]],a:0,e:"Pada syok kardiogenik, norepinefrin adalah vasopresor lini pertama dan dobutamin dapat ditambahkan sebagai inotropik. Terapi definitifnya adalah revaskularisasi segera."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang pria berusia 50 tahun datang ke IGD dengan nyeri dada kiri menembus ke punggung yang tidak mereda dengan istirahat sejak 2 jam. Pemeriksaan fisik TD 150/90 mmHg, HR 110x/menit, RR 22x/menit, T 36,7 C, SpO2 98 persen. EKG menunjukkan elevasi ST di lead V1 hingga V4. Jarak dari rumah sakit ke fasilitas PCI adalah 2 jam perjalanan. Apakah tatalaksana definitif untuk kasus tersebut?",o:[["Dabigatran","Antikoagulan oral langsung tidak memiliki peran pada reperfusi STEMI akut."],["Streptokinase","BENAR. Bila PCI primer tidak dapat dilakukan dalam 120 menit sejak diagnosis, terapi reperfusi definitif adalah fibrinolitik seperti streptokinase."],["Aspilet","Aspirin adalah terapi adjuvan wajib, bukan terapi reperfusi."],["Clopidogrel","Clopidogrel merupakan antiplatelet pendamping, bukan reperfusi."],["Bisoprolol","Beta blocker menurunkan kebutuhan oksigen miokard tetapi tidak membuka arteri yang tersumbat."]],a:1,e:"Waktu adalah otot jantung. Bila waktu tempuh ke pusat PCI melebihi 120 menit, berikan fibrinolitik dalam 30 menit pertama lalu rujuk untuk angiografi dalam 2 sampai 24 jam berikutnya."},
{t:"Penyakit Jantung Kongenital",s:"2",q:"Seorang anak berusia 6 bulan datang ke poli diantar orang tuanya dengan sesak. Anak malas menyusu dan berat badan sulit naik. Ia lahir cukup bulan spontan tanpa riwayat biru maupun kuning. Pemeriksaan fisik HR 125x/menit, RR 24x/menit, T 36,6 C, dan auskultasi menemukan murmur kontinu pada ICS II linea parasternalis sinistra. Apakah diagnosis yang tepat?",o:[["Atrial septal defect","ASD memberi wide fixed splitting S2 dengan murmur ejeksi sistolik halus."],["Ventricular septal defect","VSD memberi murmur holosistolik, bukan kontinu."],["Koarktasio aorta","Koarktasio memberi perbedaan tekanan darah lengan dan tungkai."],["Patent ductus arteriosus","BENAR. Murmur kontinu seperti mesin di ICS II parasternal kiri atau infraklavikula kiri adalah gambaran khas duktus arteriosus persisten."],["Tetralogy of Fallot","Tetralogi Fallot bersifat sianotik dengan murmur ejeksi sistolik."]],a:3,e:"PDA menyebabkan pirau kiri ke kanan dengan nadi kolaps dan tekanan nadi lebar. Penutupan farmakologis dengan indometasin atau ibuprofen efektif pada neonatus prematur, sedangkan pada anak besar dilakukan penutupan transkateter."}
,
{t:"Aritmia",s:"3A",q:"Seorang wanita 30 tahun datang ke IGD dengan berdebar-debar sejak 3 hari, disertai sesak napas, mudah lelah, tremor, dan penurunan berat badan. Pemeriksaan fisik TD 110/70 mmHg, HR 175x/menit, RR 24x/menit, T 37,2 C. EKG menunjukkan interval R-R yang sangat ireguler tanpa gelombang P yang dapat diidentifikasi. Apakah diagnosis pada pasien ini?",o:[["Atrial flutter","Flutter memberi gelombang gigi gergaji dengan laju atrium sekitar 300x/menit dan respons ventrikel yang umumnya teratur."],["Ventrikel takikardia","VT memberi kompleks QRS lebar lebih dari 120 ms."],["Atrial fibrilasi","BENAR. Irama ireguler ireguler tanpa gelombang P adalah fibrilasi atrium, di sini kemungkinan dipicu tirotoksikosis."],["Ventrikel fibrilasi","VF adalah irama henti jantung tanpa nadi dan tanpa kompleks QRS teratur."],["Supraventrikular takikardia","SVT bersifat sangat reguler."]],a:2,e:"Fibrilasi atrium dengan respons ventrikel cepat pada tirotoksikosis ditangani dengan beta blocker dan terapi tiroid. Penilaian risiko tromboemboli memakai CHA2DS2-VASc dan risiko perdarahan memakai HAS-BLED."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 55 tahun datang ke IGD dengan nyeri dada sejak 4 jam yang menjalar ke lengan kiri disertai keringat dingin. Pemeriksaan fisik TD 80/60 mmHg, N 60x/menit, RR 24x/menit. EKG menunjukkan elevasi segmen ST di sadapan II, III, dan aVF. Apakah terapi awal yang paling tepat diberikan di IGD?",o:[["Nitrogliserin sublingual","Nitrat berbahaya karena pasien hipotensi dan infark inferior berisiko melibatkan ventrikel kanan."],["Aspirin 320 mg dikunyah","BENAR. Aspirin kunyah adalah antiplatelet awal yang wajib dan terbukti menurunkan mortalitas pada infark miokard akut."],["Furosemide 40 mg intravena","Diuretik memperburuk hipotensi dan tidak diindikasikan tanpa kongesti paru."],["Bisoprolol 5 mg oral","Beta blocker dikontraindikasikan pada fase akut dengan hipotensi dan bradikardia."],["Digoksin 0,25 mg intravena","Digoksin tidak memiliki peran pada sindrom koroner akut."]],a:1,e:"Terapi awal STEMI mengikuti prinsip MONACO dengan catatan penting: morfin dan nitrat harus dihindari pada hipotensi atau infark ventrikel kanan, sedangkan aspirin dan penghambat P2Y12 tetap diberikan sambil menyiapkan reperfusi."},
{t:"Aritmia",s:"3B",q:"Seorang wanita 24 tahun datang ke IGD dengan berdebar sejak 1 jam. Pemeriksaan fisik TD 120/80 mmHg, HR 180x/menit, RR 20x/menit, akral hangat, dan pasien sadar penuh. EKG menunjukkan takikardia QRS sempit reguler. Dokter jaga berencana melakukan manuver untuk menghentikan takikardia. Manakah tindakan awal yang TIDAK tepat dilakukan?",o:[["Knee-chest position","BENAR. Posisi knee-chest adalah tatalaksana tet spell pada tetralogi Fallot, bukan manuver vagal untuk takikardia supraventrikular."],["Manuver Valsalva","Valsalva adalah manuver vagal standar lini pertama pada SVT stabil."],["Pijat sinus karotis","Pijat karotis adalah manuver vagal yang sah bila tidak ada bruit maupun riwayat stroke atau infark."],["Merendam wajah pada air dingin","Diving reflex efektif terutama pada pasien muda dan anak."],["Manuver Valsalva termodifikasi dengan elevasi tungkai","Valsalva modifikasi terbukti lebih efektif dibanding Valsalva standar berdasarkan studi REVERT."]],a:0,e:"Manuver vagal meningkatkan tonus parasimpatis sehingga memperlambat konduksi nodus AV dan memutus sirkuit reentri. Knee-chest justru meningkatkan resistensi sistemik untuk mengurangi pirau kanan ke kiri pada tetralogi Fallot."},
{t:"Gagal Jantung",s:"3A",q:"Seorang pria 70 tahun datang ke poliklinik dengan sesak napas yang dirasakan bahkan saat duduk beristirahat. Sejak sebulan terakhir ia hanya dapat berbaring dan menggunakan kursi roda, serta harus tidur dengan posisi setengah duduk. Pemeriksaan fisik TD 130/80 mmHg, HR 98x/menit, RR 26x/menit, JVP meningkat, ronki basah basal, edema tungkai. Apakah kelas fungsional NYHA pasien ini?",o:[["NYHA I","NYHA I tidak memiliki keterbatasan aktivitas."],["NYHA II","NYHA II hanya bergejala pada aktivitas fisik biasa."],["NYHA III","NYHA III bergejala pada aktivitas lebih ringan dari biasa tetapi masih nyaman saat istirahat."],["NYHA IV","BENAR. Gejala muncul saat istirahat dan setiap aktivitas memperberat keluhan, sehingga termasuk kelas IV."],["NYHA III sampai IV","Klasifikasi NYHA ditetapkan sebagai satu kelas tunggal, bukan rentang."]],a:3,e:"NYHA IV berhubungan dengan prognosis buruk dan sering memerlukan diuretik intravena, evaluasi terapi lanjut, serta diskusi perawatan paliatif. Penilaian NYHA harus diulang setiap kunjungan karena dapat berubah."},
{t:"Vaskular Perifer",s:"3A",q:"Seorang wanita 45 tahun datang dengan nyeri dan bengkak pada tungkai kanan sejak 5 hari. Ia baru menjalani operasi panggul 2 minggu lalu dan banyak berbaring. Pemeriksaan fisik menemukan tungkai kanan edema, hangat, kemerahan, dengan nyeri betis saat dorsofleksi kaki. Apakah pemeriksaan penunjang awal yang paling tepat?",o:[["Foto polos tungkai","Radiografi tidak dapat menilai trombus di dalam vena."],["Ultrasonografi Doppler","BENAR. USG Doppler kompresi adalah pemeriksaan awal pilihan karena noninvasif, akurat, dan tersedia luas untuk trombosis vena dalam."],["Venografi kontras","Venografi memang baku emas historis namun invasif dan sudah jarang digunakan sebagai pemeriksaan awal."],["Arteriografi tungkai","Arteriografi menilai sistem arteri, bukan vena."],["Computed tomography abdomen","CT abdomen tidak menilai vena tungkai secara langsung."]],a:1,e:"Kombinasi skor Wells, D-dimer, dan USG Doppler kompresi adalah alur diagnostik DVT. Diagnosis dini penting untuk mencegah emboli paru yang fatal."},
{t:"Vaskular Perifer",s:"1",q:"Seorang laki-laki 38 tahun perokok berat sejak remaja datang dengan nyeri pada jari kaki yang memberat saat berjalan dan tetap terasa saat istirahat. Pemeriksaan fisik menemukan ujung jari kaki kehitaman, pulsasi arteri dorsalis pedis melemah, dan tes Allen abnormal. Tidak ada riwayat diabetes maupun dislipidemia. Apakah diagnosisnya?",o:[["Aterosklerosis obliterans","Aterosklerosis mengenai arteri besar pada usia lanjut dengan faktor risiko metabolik yang pada pasien ini tidak ada."],["Tromboangiitis obliterans","BENAR. Penyakit Buerger mengenai arteri dan vena kecil sampai sedang pada perokok berat usia muda dan menyebabkan iskemia digiti hingga gangren."],["Fenomena Raynaud","Fenomena Raynaud menyebabkan perubahan warna reversibel akibat dingin, bukan gangren."],["Trombosis vena dalam","DVT memberi tungkai bengkak dengan pulsasi arteri normal."],["Arteritis Takayasu","Takayasu mengenai aorta dan cabang besarnya, tersering pada perempuan muda Asia dengan hilangnya pulsasi lengan."]],a:1,e:"Terapi paling penting pada penyakit Buerger adalah berhenti merokok total, karena keberlangsungan penyakit sangat tergantung pada paparan tembakau. Revaskularisasi sering sulit karena lesi mengenai pembuluh distal."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang pria 68 tahun dibawa ke IGD dalam keadaan tidak sadar. Pemeriksaan menunjukkan pasien tidak bernapas dan nadi karotis tidak teraba. Resusitasi jantung paru dimulai dan monitor menampilkan garis datar tanpa aktivitas listrik yang dikonfirmasi pada dua sadapan. Apakah tatalaksana farmakologis yang tepat?",o:[["Amiodaron 300 mg intravena","Amiodaron hanya untuk fibrilasi ventrikel atau takikardia ventrikel tanpa nadi yang refrakter."],["Atropin 1 mg intravena","Atropin tidak lagi direkomendasikan pada henti jantung."],["Epinefrin 1 mg intravena","BENAR. Pada asistol, epinefrin 1 mg diberikan sesegera mungkin dan diulang tiap 3 sampai 5 menit bersama kompresi berkualitas tinggi."],["Lidokain 1 mg per kilogram intravena","Lidokain merupakan alternatif amiodaron pada irama shockable."],["Natrium bikarbonat 1 mEq per kilogram intravena","Bikarbonat hanya untuk indikasi khusus seperti hiperkalemia dan intoksikasi trisiklik."]],a:2,e:"Asistol adalah irama nonshockable dengan prognosis buruk. Kunci penanganannya adalah kompresi dada minim interupsi, epinefrin dini, dan koreksi penyebab reversibel 5H dan 5T."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 60 tahun tiba-tiba tidak sadarkan diri di ruang perawatan. Pemeriksaan menunjukkan pasien tidak berespons, napas gasping, dan nadi karotis tidak teraba. Monitor menampilkan irama sinus bradikardi dengan kompleks QRS teratur. Apakah tindakan pertama yang harus dilakukan?",o:[["Pemberian sulfas atropin","Atropin tidak digunakan pada pasien tanpa nadi."],["Resusitasi jantung paru","BENAR. Adanya irama terorganisir tanpa nadi adalah aktivitas listrik tanpa nadi, dan tindakan pertamanya adalah kompresi dada segera."],["Defibrilasi 200 Joule","Irama ini bukan irama yang dapat dikejut."],["Pemasangan pacu jantung transkutan","Pacu jantung tidak berguna karena masalahnya bukan sekadar laju listrik."],["Kardioversi tersinkronisasi 100 Joule","Kardioversi hanya untuk takiaritmia dengan nadi."]],a:1,e:"Ingat bahwa monitor dapat menipu. Yang menentukan tindakan adalah ada tidaknya nadi, bukan gambar di layar. Napas gasping harus dianggap sebagai henti napas."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 40 tahun datang dengan demam hilang timbul sejak 3 minggu disertai lemas dan penurunan berat badan. Ia memiliki riwayat penyakit katup jantung. Pemeriksaan fisik T 38,7 C, murmur pansistolik di apeks, splinter hemorrhage di kuku, nodul nyeri di jari, dan makula tidak nyeri di telapak tangan. Apakah diagnosis yang paling mungkin?",o:[["Demam rematik akut","Demam rematik akut memberi poliartritis migran dan eritema marginatum, tanpa fenomena emboli kuku dan telapak tangan."],["Endokarditis bakterial","BENAR. Demam berkepanjangan pada penyakit katup dengan nodus Osler, lesi Janeway, dan splinter hemorrhage adalah endokarditis infektif."],["Miokarditis viral","Miokarditis memberi gagal jantung akut pasca infeksi virus tanpa stigmata perifer."],["Perikarditis tuberkulosis","Perikarditis TB memberi efusi perikard dengan gejala konstitusional, tanpa nodus Osler."],["Sepsis tanpa fokus infeksi","Fokus infeksi pada pasien ini justru jelas mengarah ke katup jantung."]],a:1,e:"Langkah wajib pada kecurigaan endokarditis adalah tiga set kultur darah dari lokasi berbeda sebelum antibiotik, ekokardiografi transtorakal atau transesofageal, dan penilaian kriteria Duke."},
{t:"Penyakit Katup",s:"2",q:"Seorang perempuan 35 tahun datang dengan sesak saat aktivitas dan mudah lelah sejak 6 bulan. Ia memiliki riwayat demam rematik saat kecil. Pemeriksaan fisik menemukan opening snap diikuti murmur mid-diastolik dengan aksentuasi presistolik di apeks, teraba diastolic thrill. Apakah diagnosisnya?",o:[["Stenosis mitral","BENAR. Opening snap dengan murmur mid-diastolik di apeks pada pasien riwayat demam rematik adalah stenosis mitral."],["Regurgitasi mitral","Regurgitasi mitral memberi murmur holosistolik yang menjalar ke aksila."],["Stenosis aorta","Stenosis aorta memberi murmur ejeksi sistolik di area aorta yang menjalar ke karotis."],["Regurgitasi aorta","Regurgitasi aorta memberi murmur diastolik dekresendo di parasternal kiri atas dengan tekanan nadi lebar."],["Stenosis trikuspid","Stenosis trikuspid memberi murmur diastolik di parasternal kiri bawah yang mengeras saat inspirasi."]],a:0,e:"Stenosis mitral hampir selalu berasal dari penyakit jantung rematik. Komplikasi utamanya adalah fibrilasi atrium, tromboemboli, dan hipertensi pulmonal, sehingga pasien memerlukan profilaksis sekunder dan evaluasi intervensi katup."},
{t:"Penyakit Jantung Koroner",s:"—",st:"Kompetensi farmakologi",q:"Seorang laki-laki 58 tahun dengan riwayat infark miokard 6 bulan lalu rutin mengonsumsi asam asetilsalisilat dosis rendah setiap hari. Ia bertanya kepada dokter mengenai alasan obat tersebut harus diminum seumur hidup. Apakah tujuan utama pemberian obat tersebut?",o:[["Menurunkan kadar kolesterol darah","Penurunan kolesterol adalah kerja statin melalui penghambatan HMG-CoA reduktase."],["Menurunkan tekanan darah sistemik","Penurunan tekanan darah dicapai dengan penghambat ACE, ARB, atau CCB."],["Mencegah pembentukan trombus","BENAR. Aspirin menghambat siklooksigenase 1 trombosit sehingga produksi tromboksan A2 dan agregasi trombosit menurun."],["Menurunkan denyut jantung istirahat","Penurunan laju jantung merupakan efek beta blocker atau ivabradin."],["Meningkatkan kontraktilitas miokard","Peningkatan kontraktilitas adalah efek obat inotropik."]],a:2,e:"Aspirin dosis rendah 75 sampai 100 mg per hari merupakan terapi seumur hidup pasca sindrom koroner akut. Dokter umum harus memastikan kepatuhan dan mewaspadai risiko perdarahan saluran cerna."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 62 tahun datang dengan nyeri dada hebat sejak 3 jam disertai sesak. Pemeriksaan fisik TD 130/80 mmHg, HR 96x/menit. EKG menunjukkan elevasi segmen ST di sadapan V1, V2, V3, dan V4. Apakah diagnosis topografi infark pada pasien ini?",o:[["Infark miokard akut anteroseptal","BENAR. Elevasi ST di V1 sampai V4 mencerminkan dinding anteroseptal yang diperdarahi arteri desendens anterior kiri."],["Infark miokard akut inferior","Infark inferior tampak di sadapan II, III, dan aVF."],["Infark miokard akut lateral","Infark lateral tampak di sadapan I, aVL, V5, dan V6."],["Infark miokard akut posterior","Infark posterior memberi depresi ST dan gelombang R dominan di V1 sampai V2."],["Infark miokard akut ventrikel kanan","Infark ventrikel kanan terdeteksi dari elevasi ST di sadapan V3R dan V4R."]],a:0,e:"Infark anteroseptal akibat oklusi LAD proksimal memiliki area jeopardized miokard terluas sehingga risiko syok kardiogenik dan aritmia maligna tinggi. Reperfusi harus dilakukan secepat mungkin."},
{t:"Penyakit Jantung Koroner",s:"3A",q:"Seorang pria 50 tahun mengeluh nyeri dada saat menaiki tangga yang mereda dalam 5 menit setelah beristirahat, berulang sejak 4 bulan. EKG istirahat dan enzim jantung dalam batas normal. Pemeriksaan fisik dan tanda vital normal. Apakah pemeriksaan penunjang lanjutan yang paling tepat sebagai penapisan awal?",o:[["Ekokardiografi istirahat","Ekokardiografi istirahat sering normal pada angina stabil dan tidak menilai iskemia yang dipicu aktivitas."],["Exercise stress test","BENAR. Uji latih beban jantung adalah penapisan awal noninvasif untuk membuktikan iskemia yang dipicu aktivitas pada angina stabil."],["Holter monitoring 24 jam","Holter berguna untuk aritmia intermiten, bukan iskemia terprovokasi."],["Foto toraks posteroanterior","Foto toraks hanya menilai ukuran jantung dan kondisi paru."],["Kateterisasi jantung kanan","Kateterisasi kanan menilai tekanan pulmonal, bukan iskemia koroner."]],a:1,e:"Pada probabilitas pretest sedang, uji latih beban efektif dan murah. Bila hasil positif atau gejala berlanjut, lanjutkan ke CT angiografi koroner atau angiografi invasif."},
{t:"Penyakit Katup",s:"2",q:"Seorang laki-laki 48 tahun datang dengan bengkak perut dan kaki sejak 2 bulan. Pemeriksaan fisik menemukan JVP meningkat dengan gelombang v yang prominen, murmur holosistolik di ICS IV parasternal sinistra yang mengeras saat inspirasi, hepatomegali pulsatil, dan asites. Apakah kelainan katup pada pasien ini?",o:[["Stenosis mitral","Stenosis mitral memberi murmur diastolik di apeks."],["Regurgitasi mitral","Regurgitasi mitral memberi murmur sistolik di apeks yang menjalar ke aksila dan tidak mengeras saat inspirasi."],["Stenosis trikuspid","Stenosis trikuspid memberi murmur diastolik dengan gelombang a prominen."],["Regurgitasi trikuspid","BENAR. Murmur holosistolik parasternal kiri bawah yang mengeras saat inspirasi disertai gelombang v prominen dan hepar pulsatil adalah regurgitasi trikuspid."],["Stenosis pulmonal","Stenosis pulmonal memberi murmur ejeksi sistolik di ICS II parasternal kiri."]],a:3,e:"Regurgitasi trikuspid tersering bersifat fungsional akibat dilatasi ventrikel kanan pada hipertensi pulmonal. Tanda klinisnya adalah bendungan sistemik berupa JVP meningkat, hepatomegali pulsatil, asites, dan edema."},
{t:"Aritmia",s:"3B",q:"Seorang laki-laki 70 tahun datang dengan lemas dan pusing berulang sejak 1 minggu, sempat hampir pingsan. Pemeriksaan fisik TD 100/60 mmHg, HR 45x/menit reguler. EKG menunjukkan gelombang P dengan laju 80x/menit dan kompleks QRS dengan laju 45x/menit yang berjalan sendiri-sendiri tanpa hubungan tetap. Apakah diagnosisnya?",o:[["Sinus bradikardia","Sinus bradikardia memiliki hubungan tetap antara gelombang P dan kompleks QRS."],["AV blok derajat 1","Blok derajat 1 hanya memanjangkan interval PR tanpa denyut yang hilang."],["AV blok derajat 2 Mobitz 1","Mobitz 1 menunjukkan pemanjangan PR progresif hingga satu QRS hilang."],["AV blok derajat 2 Mobitz 2","Mobitz 2 menunjukkan interval PR konstan dengan QRS yang hilang secara mendadak."],["AV blok derajat 3","BENAR. Disosiasi atrioventrikular total dengan laju atrium lebih cepat dari laju ventrikel adalah blok AV derajat 3."]],a:4,e:"Blok AV total simtomatik memerlukan pacu jantung permanen. Dokter umum berperan mengenali gejala presinkop dan sinkop akibat bradiaritmia serta merujuk dengan pemantauan ketat."},
{t:"Penyakit Katup",s:"2",q:"Seorang laki-laki 68 tahun datang dengan pingsan saat menaiki tangga, disertai nyeri dada dan sesak saat beraktivitas sejak 6 bulan. Pemeriksaan fisik menemukan murmur ejeksi sistolik kasar di ICS II parasternal dekstra yang menjalar ke arteri karotis dan pulsus parvus et tardus. Apakah kelainan katup pasien ini?",o:[["Stenosis aorta","BENAR. Trias angina, sinkop, dan sesak dengan murmur ejeksi sistolik yang menjalar ke karotis serta pulsus parvus et tardus adalah stenosis aorta."],["Regurgitasi aorta","Regurgitasi aorta memberi murmur diastolik dengan tekanan nadi lebar."],["Stenosis mitral","Stenosis mitral memberi murmur diastolik di apeks."],["Regurgitasi mitral","Regurgitasi mitral memberi murmur holosistolik di apeks yang menjalar ke aksila."],["Stenosis pulmonal","Stenosis pulmonal memberi murmur ejeksi sistolik di ICS II parasternal kiri."]],a:0,e:"Stenosis aorta simtomatik memiliki prognosis buruk tanpa intervensi, dengan median survival hanya beberapa tahun. Terapinya adalah penggantian katup bedah atau transkateter, dan hindari vasodilator berlebihan."},
{t:"Aritmia",s:"3B",q:"Seorang laki-laki 65 tahun datang dengan berdebar sejak 6 jam disertai sesak. Pemeriksaan fisik TD 85/55 mmHg, HR 165x/menit ireguler, RR 30x/menit, akral dingin, ronki basah di kedua basal paru. EKG menunjukkan irama ireguler tanpa gelombang P. Apakah tatalaksana yang paling tepat?",o:[["Digoksin intravena","Digoksin bekerja lambat dan tidak sesuai untuk pasien tidak stabil."],["Diltiazem intravena","Penghambat kanal kalsium dikontraindikasikan pada hipotensi dan gagal jantung akut."],["Metoprolol intravena","Beta blocker intravena memperberat hipotensi dan kongesti pada pasien ini."],["Kardioversi tersinkronisasi","BENAR. Fibrilasi atrium dengan respons ventrikel cepat disertai hipotensi dan edema paru adalah takiaritmia tidak stabil yang membutuhkan kardioversi listrik segera."],["Adenosin intravena","Adenosin tidak menghentikan fibrilasi atrium karena sirkuitnya tidak melibatkan nodus AV."]],a:3,e:"Energi kardioversi tersinkronisasi untuk fibrilasi atrium adalah 120 sampai 200 J bifasik. Antikoagulasi tetap perlu dipertimbangkan setelah kondisi stabil sesuai durasi aritmia dan risiko tromboemboli."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 55 tahun mendadak kolaps saat rapat. Ia tidak berespons, tidak bernapas normal, dan nadi karotis tidak teraba. Monitor defibrilator manual monofasik menunjukkan fibrilasi ventrikel. Apakah tindakan yang paling tepat?",o:[["Defibrilasi 360 Joule","BENAR. Pada defibrilator monofasik, energi yang direkomendasikan untuk fibrilasi ventrikel adalah 360 Joule sekali kejut, langsung dilanjutkan kompresi dada."],["Defibrilasi 100 Joule","Energi tersebut terlalu rendah untuk terminasi fibrilasi ventrikel."],["Kardioversi tersinkronisasi 200 Joule","Sinkronisasi tidak mungkin dilakukan pada fibrilasi ventrikel."],["Injeksi amiodaron 300 mg","Amiodaron diberikan setelah kejut ketiga pada fibrilasi ventrikel refrakter."],["Injeksi epinefrin 1 mg","Epinefrin diberikan setelah kejut pertama pada irama shockable."]],a:0,e:"Energi defibrilasi: monofasik 360 J, bifasik 120 sampai 200 J sesuai rekomendasi pabrik. Setelah kejut, segera lanjutkan kompresi dada selama 2 menit tanpa memeriksa nadi."},
{t:"Vaskular Perifer",s:"3A",q:"Seorang perempuan 40 tahun datang dengan nyeri dan kemerahan sepanjang vena superfisial di lengan kanan sejak 3 hari setelah pemasangan infus. Pemeriksaan fisik menemukan vena teraba keras seperti tali, hangat, nyeri tekan, tanpa pembengkakan seluruh lengan. Suhu 37,4 C. Apakah diagnosisnya?",o:[["Trombosis vena dalam","DVT mengenai vena dalam dengan pembengkakan seluruh ekstremitas dan tanpa vena superfisial teraba seperti tali."],["Tromboflebitis superfisialis","BENAR. Inflamasi vena superfisial pasca kanulasi dengan vena teraba keras, nyeri, dan eritema linear adalah tromboflebitis superfisial."],["Selulitis","Selulitis memberi eritema difus berbatas tidak tegas tanpa tali vena yang teraba."],["Limfangitis","Limfangitis memberi garis merah menjalar ke arah kelenjar getah bening regional dengan demam tinggi."],["Insufisiensi vena kronik","Insufisiensi vena kronik bersifat kronik dengan varises dan hiperpigmentasi pada tungkai."]],a:1,e:"Tromboflebitis superfisial umumnya ditangani dengan melepas kanul, kompres hangat, elevasi, dan analgesik NSAID. Bila mendekati pertemuan safenofemoral, perlu evaluasi antikoagulan karena risiko perluasan ke vena dalam."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 55 tahun datang dengan nyeri dada yang muncul saat aktivitas ringan sejak 2 hari, semakin sering, dan kini muncul juga saat istirahat. Nyeri berlangsung sekitar 15 menit. Pemeriksaan fisik TD 140/90 mmHg, HR 92x/menit. EKG menunjukkan depresi segmen ST 1 mm di V4 sampai V6 dan pemeriksaan troponin serial dalam batas normal. Apakah diagnosisnya?",o:[["Angina pektoris stabil","Angina stabil memiliki pola nyeri yang dapat diprediksi dan mereda dengan istirahat, tanpa progresivitas."],["Angina pektoris tidak stabil","BENAR. Nyeri yang semakin sering dan muncul saat istirahat dengan depresi ST namun troponin normal adalah angina tidak stabil."],["NSTEMI","NSTEMI membutuhkan peningkatan biomarka nekrosis miokard."],["STEMI","STEMI membutuhkan elevasi segmen ST persisten."],["Angina Prinzmetal","Angina varian memberi elevasi ST transien saat serangan akibat spasme koroner."]],a:1,e:"Angina tidak stabil termasuk sindrom koroner akut dan harus dirawat serta dipantau. Tatalaksana meliputi antiplatelet ganda, antikoagulan, antiiskemik, dan stratifikasi risiko untuk menentukan strategi invasif."},
{t:"Gagal Jantung",s:"3A",q:"Seorang laki-laki 60 tahun datang ke poliklinik dengan sesak saat berjalan kurang dari 100 meter sejak 3 bulan, membaik dengan istirahat. Ia memiliki riwayat infark miokard 2 tahun lalu. Ekokardiografi menunjukkan fraksi ejeksi 35 persen dengan hipokinesis anterior. Apakah stadium dan kelas fungsional gagal jantung pasien ini?",o:[["Stage C dengan NYHA III","BENAR. Pasien sudah memiliki kelainan struktural dan bergejala sehingga masuk stadium C, dengan gejala pada aktivitas kurang dari biasa sesuai NYHA III."],["Stage B dengan NYHA III","Stadium B berarti ada kelainan struktural tetapi belum pernah bergejala."],["Stage C dengan NYHA II","NYHA II bergejala pada aktivitas biasa seperti berjalan jauh atau naik tangga, bukan kurang dari 100 meter."],["Stage D dengan NYHA IV","Stadium D adalah gagal jantung refrakter dengan gejala berat saat istirahat meski terapi optimal."],["Stage A dengan NYHA I","Stadium A hanya memiliki faktor risiko tanpa kelainan struktural maupun gejala."]],a:0,e:"Stadium AHA menilai perjalanan penyakit yang tidak dapat mundur, sedangkan NYHA menilai kapasitas fungsional yang dapat membaik dengan terapi. Pasien HFrEF stadium C wajib mendapat empat pilar terapi."},
{t:"Gagal Jantung",s:"3A",q:"Seorang perempuan 58 tahun datang dengan sesak saat aktivitas dan bengkak tungkai. Dokter mencurigai gagal jantung. Apakah pemeriksaan penunjang yang paling tepat untuk menegakkan diagnosis dan menilai fungsi jantung?",o:[["Foto toraks dan elektrokardiografi","Kombinasi ini berguna sebagai penapisan awal namun tidak menilai fraksi ejeksi."],["Elektrokardiografi dan ekokardiografi","BENAR. EKG menapis kelainan irama dan iskemia, sedangkan ekokardiografi menilai fraksi ejeksi, struktur katup, dan fungsi diastolik sebagai kunci diagnosis."],["Foto toraks dan troponin","Troponin dipakai untuk sindrom koroner akut, bukan penilaian fungsi jantung kronik."],["Angiografi koroner dan treadmill test","Kedua pemeriksaan ini menilai iskemia koroner, bukan fungsi pompa jantung."],["Holter monitoring dan foto toraks","Holter menilai aritmia intermiten dan tidak menegakkan gagal jantung."]],a:1,e:"Diagnosis gagal jantung menurut ESC memerlukan gejala dan tanda, ditambah bukti objektif disfungsi jantung dari ekokardiografi atau peptida natriuretik. Ekokardiografi adalah pemeriksaan kunci."},
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang laki-laki 62 tahun dengan hipertensi lama menjalani pemeriksaan EKG. Didapatkan gelombang S di V1 sedalam 20 mm dan gelombang R di V5 setinggi 22 mm sehingga jumlahnya melebihi 35 mm, disertai deviasi aksis ke kiri. Apakah interpretasi EKG tersebut?",o:[["Hipertrofi atrium kiri","Pembesaran atrium kiri ditandai gelombang P lebar berlekuk lebih dari 0,12 detik di lead II."],["Hipertrofi atrium kanan","Pembesaran atrium kanan ditandai P tinggi lancip lebih dari 2,5 mm."],["Hipertrofi ventrikel kiri","BENAR. Kriteria Sokolow-Lyon berupa penjumlahan S di V1 dan R di V5 atau V6 lebih dari 35 mm menandakan hipertrofi ventrikel kiri."],["Hipertrofi ventrikel kanan","Hipertrofi ventrikel kanan menunjukkan deviasi aksis kanan dengan R dominan di V1."],["Blok cabang berkas kiri","LBBB memerlukan pelebaran QRS lebih dari 120 ms."]],a:2,e:"LVH pada hipertensi adalah kerusakan organ target yang meningkatkan risiko gagal jantung, aritmia, dan kematian kardiovaskular. Temuan ini menuntut pengendalian tekanan darah lebih agresif."},
{t:"Gagal Jantung",s:"—",st:"Kompetensi radiologi",q:"Seorang laki-laki 65 tahun dengan sesak dan riwayat hipertensi lama menjalani foto toraks posteroanterior. Hasil menunjukkan cardio thoracic ratio 62 persen dengan apeks jantung tertanam di bawah diafragma dan pinggang jantung tetap terlihat. Apakah interpretasi kelainan tersebut?",o:[["Pembesaran atrium kiri","Pembesaran atrium kiri menghilangkan pinggang jantung dan memberi double contour."],["Pembesaran atrium kanan","Pembesaran atrium kanan melebarkan batas jantung kanan bawah."],["Pembesaran ventrikel kanan","Pembesaran ventrikel kanan mengangkat apeks jantung ke atas diafragma."],["Pembesaran ventrikel kiri","BENAR. Apeks jantung yang tertanam di bawah diafragma dengan pinggang jantung yang masih tampak adalah gambaran khas pembesaran ventrikel kiri."],["Efusi perikard masif","Efusi perikard memberi gambaran water bottle heart dengan batas jantung yang licin dan simetris."]],a:3,e:"Foto toraks membantu menilai kardiomegali, kongesti paru, dan efusi pleura pada gagal jantung, namun konfirmasi tetap memerlukan ekokardiografi."},
{t:"Gagal Jantung",s:"3A",q:"Seorang perempuan 62 tahun datang dengan sesak dan bengkak kedua tungkai sejak 1 minggu. Pemeriksaan fisik TD 140/90 mmHg, HR 96x/menit, RR 24x/menit, ronki basah basal, JVP meningkat, dan pitting edema. Apakah obat yang paling tepat untuk mengurangi gejala kongesti pada pasien ini?",o:[["Digoksin","Digoksin dipakai untuk kontrol laju pada fibrilasi atrium dan tidak mengurangi kongesti secara langsung."],["Furosemide","BENAR. Diuretik loop adalah obat pilihan untuk mengurangi kongesti dan memperbaiki gejala gagal jantung."],["Amlodipin","Amlodipin menurunkan tekanan darah tanpa efek dekongestif dan dapat memperberat edema tungkai."],["Bisoprolol","Beta blocker memperbaiki prognosis jangka panjang tetapi tidak diberikan untuk dekongesti akut."],["Simvastatin","Statin menurunkan lipid dan tidak berperan mengurangi kongesti."]],a:1,e:"Diuretik loop memperbaiki gejala namun belum terbukti menurunkan mortalitas. Dosis harus dititrasi sesuai berat badan harian dan pantau fungsi ginjal serta elektrolit."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 32 tahun datang dengan demam subfebris sejak 3 minggu disertai lemas dan penurunan berat badan. Dua bulan lalu ia menjalani pencabutan gigi geraham. Pemeriksaan fisik menemukan murmur baru di apeks dan splenomegali. Ekokardiografi menemukan vegetasi pada katup mitral. Apakah etiologi tersering pada kasus ini?",o:[["Streptococcus viridans","BENAR. Endokarditis subakut pada katup asli setelah tindakan gigi paling sering disebabkan Streptococcus viridans yang merupakan flora rongga mulut."],["Staphylococcus aureus","S. aureus menyebabkan endokarditis akut dengan perjalanan fulminan, terutama pada pengguna narkoba suntik dan infeksi nosokomial."],["Streptococcus pyogenes","S. pyogenes menyebabkan faringitis dan demam rematik, bukan endokarditis pasca tindakan gigi."],["Enterococcus faecalis","Enterokokus lebih berkaitan dengan tindakan saluran kemih dan cerna pada usia lanjut."],["Candida albicans","Kandida menyebabkan endokarditis jamur pada pasien imunokompromis atau katup prostetik."]],a:0,e:"Profilaksis antibiotik sebelum tindakan gigi diberikan hanya pada pasien risiko sangat tinggi, yaitu katup prostetik, riwayat endokarditis, dan penyakit jantung bawaan sianotik tertentu."},
{t:"Aritmia",s:"3B",q:"Seorang perempuan 28 tahun datang dengan berdebar mendadak sejak 45 menit. Pemeriksaan fisik TD 118/76 mmHg, HR 190x/menit, kesadaran baik, dan terdengar bruit pada arteri karotis kanan. EKG menunjukkan takikardia QRS sempit reguler. Apakah tatalaksana yang paling tepat?",o:[["Pijat sinus karotis","Adanya bruit karotis merupakan kontraindikasi pijat karotis karena risiko emboli plak dan stroke."],["Kardioversi tersinkronisasi 100 Joule","Kardioversi hanya untuk pasien tidak stabil, sedangkan pasien ini stabil."],["Digoksin intravena","Digoksin tidak efektif untuk terminasi takikardia supraventrikular akut."],["Adenosin 6 mg bolus cepat","BENAR. Karena manuver vagal karotis dikontraindikasikan, terapi farmakologis adenosin menjadi pilihan pada SVT stabil."],["Amiodaron 150 mg intravena","Amiodaron bukan lini pertama pada takikardia QRS sempit yang stabil."]],a:3,e:"Bruit karotis, riwayat stroke atau TIA, dan infark miokard belum lama adalah kontraindikasi pijat sinus karotis. Manuver Valsalva termodifikasi tetap dapat dicoba sebelum obat."},
{t:"Aritmia",s:"3B",q:"Seorang laki-laki 60 tahun datang dengan berdebar dan sesak berat sejak 2 jam. Pemeriksaan fisik TD 90/60 mmHg, HR 180x/menit, RR 32x/menit, dan ronki basah di seluruh lapang paru. EKG menunjukkan takikardia QRS sempit reguler tanpa gelombang P. Apakah tatalaksana yang paling tepat?",o:[["Manuver vagal","Manuver vagal tidak memadai pada pasien yang sudah mengalami edema paru akibat takiaritmia."],["Kardioversi tersinkronisasi 50 sampai 100 Joule","BENAR. Takikardia supraventrikular dengan tanda gagal jantung akut termasuk tidak stabil sehingga memerlukan kardioversi tersinkronisasi."],["Adenosin 6 mg bolus","Adenosin dipakai pada SVT stabil, bukan pasien dengan edema paru dan hipotensi."],["Defibrilasi 200 Joule","Defibrilasi tanpa sinkronisasi hanya untuk pasien tanpa nadi."],["Verapamil 5 mg intravena","Verapamil dikontraindikasikan pada hipotensi dan gagal jantung akut."]],a:1,e:"Kriteria instabilitas adalah hipotensi, perubahan status mental akut, tanda syok, nyeri dada iskemik, dan gagal jantung akut. Bila ada satu saja, lakukan kardioversi tersinkronisasi tanpa menunda."},
{t:"Aritmia",s:"3A",q:"Seorang laki-laki 66 tahun datang dengan berdebar sejak 1 hari. Pemeriksaan fisik TD 130/80 mmHg, HR 150x/menit reguler. EKG menunjukkan gelombang atrium berpola gigi gergaji dengan laju atrium sekitar 300x/menit dan konduksi ke ventrikel 2 banding 1. Apakah diagnosisnya?",o:[["Fibrilasi atrium","Fibrilasi atrium memberi irama ireguler tanpa gelombang atrium yang teratur."],["Atrial flutter","BENAR. Gelombang gigi gergaji dengan laju atrium sekitar 300x/menit dan blok 2 banding 1 sehingga laju ventrikel sekitar 150x/menit adalah atrial flutter."],["Takikardia atrium multifokal","Takikardia atrium multifokal memiliki minimal tiga morfologi gelombang P berbeda dengan irama ireguler."],["Supraventrikular takikardia","SVT tidak menunjukkan gelombang gigi gergaji."],["Sinus takikardia","Sinus takikardia memiliki gelombang P sinus normal dengan laju yang menyesuaikan aktivitas."]],a:1,e:"Laju ventrikel 150x/menit yang sangat reguler harus selalu mencurigakan atrial flutter dengan blok 2 banding 1. Prinsip terapinya menyerupai fibrilasi atrium, dengan ablasi isthmus kavotrikuspid sebagai terapi definitif."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 58 tahun datang dengan nyeri dada hebat sejak 2 jam disertai keringat dingin dan mual. EKG menunjukkan elevasi segmen ST di sadapan II, III, aVF serta V3 dan V4. Apakah diagnosis topografi infark pasien ini?",o:[["STEMI anteroinferior","BENAR. Elevasi ST bersamaan di sadapan inferior dan prekordial anterior menandakan infark yang mengenai dinding anterior dan inferior."],["STEMI inferior murni","Infark inferior murni tidak melibatkan sadapan prekordial anterior."],["STEMI anteroseptal","Anteroseptal hanya melibatkan V1 sampai V4 tanpa perubahan inferior."],["STEMI anterolateral","Anterolateral melibatkan V3 sampai V6 dengan I dan aVL."],["STEMI posterior","Infark posterior memberi depresi ST dengan R dominan di V1 sampai V2."]],a:0,e:"Infark yang melibatkan dua dinding sekaligus menandakan area iskemia luas, sering akibat LAD wrap around, dan berisiko tinggi mengalami gagal jantung akut serta aritmia."},
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang laki-laki 60 tahun kontrol rutin dan mengaku pernah dirawat karena serangan jantung 1 tahun lalu. Saat ini tidak ada keluhan nyeri dada. EKG menunjukkan gelombang negatif awal berdurasi lebih dari 0,04 detik dengan kedalaman lebih dari sepertiga tinggi gelombang R di sadapan inferior. Apakah temuan EKG tersebut?",o:[["Elevasi segmen ST","Elevasi ST menandakan infark akut yang sedang berlangsung."],["Depresi segmen ST","Depresi ST menandakan iskemia subendokardial."],["Gelombang T inversi","T inversi menandakan iskemia atau perubahan pasca infark yang lebih baru."],["Gelombang Q patologis","BENAR. Gelombang Q dengan durasi lebih dari 0,04 detik dan kedalaman lebih dari sepertiga tinggi R adalah tanda infark miokard lama."],["Gelombang delta","Gelombang delta adalah upstroke lambat pada awal QRS yang menandakan preeksitasi ventrikel."]],a:3,e:"Gelombang Q patologis menandakan nekrosis miokard transmural yang menetap seumur hidup. Temuan ini penting untuk mengetahui riwayat infark pada pasien tanpa keluhan."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 54 tahun datang ke IGD puskesmas dengan nyeri dada khas iskemik sejak 1 jam. Pemeriksaan fisik TD 130/80 mmHg, HR 88x/menit, tidak ada alergi obat dan tidak ada riwayat perdarahan. Apakah tatalaksana awal yang paling tepat diberikan sebelum merujuk?",o:[["Aspilet 160 sampai 320 mg dikunyah","BENAR. Aspirin kunyah dosis muat 160 sampai 320 mg diberikan segera pada semua kecurigaan sindrom koroner akut karena mempercepat absorpsi dan menurunkan mortalitas."],["Aspilet 80 mg ditelan","Dosis rumatan yang ditelan terlalu kecil dan lambat untuk fase akut."],["Clopidogrel 75 mg ditelan","Dosis tersebut adalah dosis rumatan, bukan dosis muat."],["Warfarin 2 mg ditelan","Warfarin tidak berperan pada tatalaksana akut sindrom koroner."],["Heparin 5000 unit subkutan","Antikoagulan diberikan setelah antiplatelet dan biasanya di fasilitas rujukan sesuai strategi reperfusi."]],a:0,e:"Dokter di layanan primer wajib memberikan aspirin kunyah, oksigen bila saturasi kurang dari 90 persen, nitrat bila tidak ada kontraindikasi, dan segera merujuk ke fasilitas dengan kemampuan reperfusi."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 66 tahun datang dengan nyeri dada 4 jam disertai sesak. Pemeriksaan fisik TD 85/55 mmHg, HR 118x/menit, akral dingin, produksi urin sedikit, dan paru terdengar ronki basah. EKG menunjukkan elevasi ST anterior luas. Setelah pemberian cairan hati-hati tekanan darah belum membaik dan hanya tersedia obat vasoaktif terbatas di fasilitas tersebut. Apakah obat yang paling tepat diberikan?",o:[["Dobutamin","Dobutamin memperbaiki curah jantung namun berisiko memperberat hipotensi bila diberikan tunggal pada tekanan sistolik yang sangat rendah."],["Digoksin","Digoksin tidak memperbaiki perfusi pada syok kardiogenik."],["Furosemid","Diuretik akan memperburuk hipotensi pada pasien yang sedang hipoperfusi."],["Dopamin","BENAR. Dopamin adalah obat vasoaktif dengan efek inotropik dan vasokonstriktor yang dapat digunakan untuk mempertahankan tekanan perfusi bila norepinefrin tidak tersedia."],["Nitrogliserin","Nitrat dikontraindikasikan pada hipotensi berat."]],a:3,e:"Norepinefrin tetap merupakan vasopresor pilihan pada syok kardiogenik berdasarkan bukti terkini, namun bila tidak tersedia, dopamin dapat digunakan sebagai jembatan sambil merujuk untuk revaskularisasi."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 57 tahun datang dengan nyeri dada 3 jam. EKG menunjukkan elevasi segmen ST di sadapan I, aVL, V3, V4, V5, dan V6. Apakah diagnosis topografi infark pada pasien ini?",o:[["STEMI inferior","Infark inferior tampak di sadapan II, III, dan aVF."],["STEMI anteroseptal","Anteroseptal terbatas pada V1 sampai V4."],["STEMI anterolateral","BENAR. Kombinasi sadapan anterior V3 sampai V4 dengan sadapan lateral I, aVL, V5, dan V6 menunjukkan infark anterolateral."],["STEMI posterior","Infark posterior memberi depresi ST dengan R dominan di V1 sampai V2."],["STEMI ventrikel kanan","Infark ventrikel kanan terlihat pada sadapan prekordial kanan V3R dan V4R."]],a:2,e:"Infark anterolateral biasanya disebabkan oklusi LAD proksimal atau sirkumfleks dan mengancam massa miokard yang besar sehingga membutuhkan reperfusi segera."},
{t:"Penyakit Jantung Koroner",s:"—",st:"Kompetensi farmakologi",q:"Seorang laki-laki 60 tahun dengan angina diberikan isosorbid dinitrat sublingual saat serangan. Nyeri dada mereda dalam beberapa menit setelah pemberian obat. Apakah mekanisme kerja obat tersebut?",o:[["Menghambat reseptor beta 1 di jantung","Penghambatan beta 1 adalah mekanisme beta blocker yang menurunkan laju dan kontraktilitas jantung."],["Relaksasi otot polos pembuluh darah","BENAR. Nitrat dikonversi menjadi nitric oxide sehingga meningkatkan cGMP dan merelaksasi otot polos vaskular, terutama vena, sehingga preload dan kebutuhan oksigen miokard menurun."],["Menghambat agregasi trombosit","Penghambatan agregasi trombosit adalah kerja aspirin dan penghambat P2Y12."],["Menghambat enzim konversi angiotensin","Penghambatan ACE adalah mekanisme kaptopril dan ramipril."],["Menghambat kanal kalsium tipe L","Penghambatan kanal kalsium adalah mekanisme amlodipin dan diltiazem."]],a:1,e:"Nitrat efektif meredakan gejala angina namun tidak menurunkan mortalitas. Perhatikan toleransi nitrat sehingga diperlukan interval bebas nitrat, serta kontraindikasi dengan inhibitor PDE5."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang perempuan 30 tahun dengan riwayat demam rematik saat anak datang dengan sesak progresif. Pemeriksaan fisik menemukan murmur holosistolik di apeks yang menjalar ke aksila dan murmur diastolik dekresendo di parasternal kiri atas. Apakah kelainan katup yang terjadi pada pasien ini?",o:[["Stenosis mitral dan stenosis aorta","Kedua kelainan tersebut menghasilkan murmur diastolik apeks dan ejeksi sistolik aorta, tidak sesuai temuan."],["Regurgitasi mitral dan stenosis aorta","Stenosis aorta memberi murmur ejeksi sistolik, bukan diastolik dekresendo."],["Regurgitasi mitral dan regurgitasi aorta","BENAR. Murmur holosistolik apeks menjalar ke aksila menandakan regurgitasi mitral, sedangkan murmur diastolik dekresendo parasternal kiri atas menandakan regurgitasi aorta."],["Stenosis mitral dan regurgitasi aorta","Stenosis mitral memberi murmur mid-diastolik apeks dengan opening snap, bukan murmur holosistolik."],["Regurgitasi trikuspid dan stenosis pulmonal","Kelainan jantung kanan tidak menghasilkan murmur yang menjalar ke aksila."]],a:2,e:"Penyakit jantung rematik sering mengenai lebih dari satu katup, dengan mitral sebagai yang tersering diikuti aorta. Pasien memerlukan profilaksis sekunder penisilin dan evaluasi berkala."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 26 tahun datang dengan sesak saat aktivitas sejak 1 tahun. Saat usia 10 tahun ia pernah mengalami demam disertai nyeri sendi berpindah setelah radang tenggorokan. Saat ini tidak demam, tidak ada nyeri sendi, namun terdengar murmur diastolik di apeks. Apakah diagnosisnya?",o:[["Demam rematik akut","Demam rematik akut memerlukan tanda inflamasi aktif seperti demam dan artritis migran."],["Endokarditis infektif","Endokarditis infektif memberi demam berkepanjangan dengan fenomena emboli dan kultur darah positif."],["Penyakit jantung rematik","BENAR. Kerusakan katup permanen bertahun-tahun setelah episode demam rematik akut disebut penyakit jantung rematik."],["Miokarditis kronik","Miokarditis memberi disfungsi ventrikel tanpa kelainan katup spesifik."],["Kardiomiopati dilatasi","Kardiomiopati dilatasi memberi dilatasi ruang jantung dengan fraksi ejeksi menurun, bukan murmur diastolik apeks."]],a:2,e:"Profilaksis sekunder dengan benzatin penisilin setiap 3 sampai 4 minggu diberikan bertahun-tahun untuk mencegah serangan ulang demam rematik dan perburukan kerusakan katup."},
{t:"Kardiomiopati dan Perikardium",s:"3B",q:"Seorang laki-laki 45 tahun dibawa ke IGD setelah kecelakaan lalu lintas dengan benturan pada dada. Pemeriksaan fisik TD 80/50 mmHg, HR 130x/menit, JVP meningkat, bunyi jantung terdengar menjauh, dan pulsus paradoksus positif. Foto toraks menunjukkan siluet jantung membesar tanpa pneumotoraks. Apakah tindakan yang paling tepat?",o:[["Torakotomi darurat","Torakotomi darurat dilakukan pada henti jantung traumatik di pusat trauma, bukan tindakan pertama di IGD umum."],["Pemasangan chest tube","WSD diindikasikan untuk pneumotoraks atau hemotoraks, yang sudah disingkirkan."],["Pemberian cairan kristaloid saja","Cairan hanya menjadi tindakan sementara dan tidak mengatasi penyebab obstruksi."],["Pemberian inotropik intravena","Inotropik tidak efektif selama jantung tidak dapat terisi akibat tekanan perikard."],["Perikardiosentesis dengan jarum","BENAR. Tamponade jantung dengan gangguan hemodinamik memerlukan dekompresi segera melalui perikardiosentesis."]],a:4,e:"Trias Beck yaitu hipotensi, distensi vena jugularis, dan bunyi jantung menjauh menandakan tamponade. Perikardiosentesis idealnya dituntun ultrasonografi, dan pasien tetap memerlukan penanganan bedah definitif."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 38 tahun dicurigai mengalami endokarditis infektif berdasarkan demam berkepanjangan, murmur baru, dan riwayat penyakit katup. Apakah pemeriksaan penunjang yang paling penting dilakukan sebelum memulai antibiotik?",o:[["Ekokardiografi transtorakal","Ekokardiografi penting untuk menemukan vegetasi, tetapi tidak akan terganggu bila antibiotik sudah dimulai."],["Foto toraks posteroanterior","Foto toraks hanya menilai komplikasi paru dan ukuran jantung."],["Kultur darah","BENAR. Tiga set kultur darah dari lokasi berbeda harus diambil sebelum antibiotik karena pemberian antibiotik menyebabkan kultur menjadi negatif palsu."],["Laju endap darah dan C-reactive protein","Penanda inflamasi bersifat nonspesifik dan tidak menentukan terapi antibiotik."],["Elektrokardiografi 12 sadapan","EKG berguna mendeteksi abses akar aorta melalui blok AV baru, namun bukan penentu utama terapi."]],a:2,e:"Identifikasi kuman menentukan pilihan dan durasi antibiotik yang umumnya 4 sampai 6 minggu intravena. Kultur yang diambil setelah antibiotik menyebabkan endokarditis kultur negatif dan menyulitkan terapi."},
{t:"Penyakit Jantung Koroner",s:"3A",q:"Seorang laki-laki 56 tahun mengeluh nyeri dada seperti tertekan yang muncul saat berjalan cepat atau menaiki tangga, berlangsung sekitar 3 menit, dan selalu mereda dengan istirahat atau nitrat sublingual. Pola keluhan tidak berubah sejak 8 bulan. EKG istirahat normal dan troponin normal. Apakah diagnosisnya?",o:[["Angina pektoris tidak stabil","Angina tidak stabil bersifat progresif, muncul saat istirahat, atau baru pertama kali dengan intensitas berat."],["NSTEMI","NSTEMI memerlukan peningkatan biomarka jantung."],["Angina Prinzmetal","Angina varian muncul saat istirahat pada dini hari dengan elevasi ST transien."],["Angina pektoris stabil","BENAR. Nyeri yang dapat diprediksi, dipicu aktivitas dengan ambang tetap, dan mereda dengan istirahat atau nitrat selama berbulan-bulan adalah angina stabil."],["Perikarditis akut","Perikarditis memberi nyeri pleuritik posisional dengan friction rub."]],a:3,e:"Terapi angina stabil mencakup pengendalian faktor risiko, aspirin, statin intensitas tinggi, beta blocker atau CCB sebagai antiangina, dan nitrat kerja singkat saat serangan."}
,
{t:"EKG",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang laki-laki 65 tahun datang ke poliklinik untuk kontrol rutin. Ia memiliki riwayat hipertensi sejak 10 tahun yang tidak terkontrol. Saat ini tekanan darah 170/100 mmHg, HR 88x/menit, RR 20x/menit. Dokter melakukan perekaman EKG. Apakah gambaran EKG yang paling mungkin ditemukan pada pasien ini?",o:[["Gelombang T inversi di sadapan II, III, dan aVF","Perubahan ini menandakan iskemia dinding inferior."],["Depresi segmen ST dan T inversi di sadapan V5 dan V6","BENAR. Pola strain ventrikel kiri berupa depresi ST downsloping dengan T inversi asimetris di sadapan lateral adalah temuan khas hipertrofi ventrikel kiri akibat hipertensi kronik."],["Gelombang P tinggi lancip di sadapan II","P pulmonal menandakan pembesaran atrium kanan akibat penyakit paru."],["Rasio gelombang R terhadap S kurang dari 1 di V5 dan V6","Rasio ini justru menandakan dominansi ventrikel kanan."],["Gelombang S yang dalam di sadapan V5 dan V6","Pada hipertrofi ventrikel kiri, gelombang S yang dalam ditemukan di V1 dan V2, bukan di sadapan lateral."]],a:1,e:"Hipertensi lama menyebabkan hipertrofi konsentrik ventrikel kiri dengan kriteria voltase Sokolow-Lyon dan pola strain. Temuan ini merupakan kerusakan organ target yang menuntut terapi antihipertensi lebih agresif."},
{t:"Penyakit Jantung Koroner",s:"—",st:"Kompetensi farmakologi",q:"Seorang laki-laki 52 tahun datang ke poliklinik dengan nyeri dada yang muncul saat aktivitas. Dokter memberikan nitrogliserin sublingual dan mengedukasi cara penggunaannya di rumah bila serangan timbul. Bagaimanakah aturan pemberian obat tersebut saat serangan?",o:[["Maksimal 3 kali dengan jarak 5 menit","BENAR. Nitrat sublingual diberikan hingga 3 dosis dengan interval 5 menit, dan bila nyeri menetap pasien harus segera ke fasilitas gawat darurat."],["Maksimal 3 kali dengan jarak 15 menit","Jarak 15 menit terlalu lama untuk kondisi iskemia akut."],["Maksimal 5 kali dengan jarak 5 menit","Melebihi 3 dosis berisiko hipotensi berat dan menunda penanganan definitif."],["Maksimal 2 kali dengan jarak 10 menit","Jumlah dan interval tersebut tidak sesuai rekomendasi."],["Maksimal 1 kali lalu langsung dirujuk","Dosis tunggal sering belum cukup meredakan serangan angina."]],a:0,e:"Bila nyeri tidak hilang setelah 3 dosis nitrat sublingual dalam 15 menit, pasien harus dicurigai mengalami sindrom koroner akut dan segera dirujuk. Edukasi ini menjadi bagian penting perawatan pasien angina di layanan primer."},
{t:"Gagal Jantung",s:"3B",q:"Seorang perempuan 55 tahun dibawa ke IGD dengan sesak berat mendadak sejak 1 jam. Pemeriksaan fisik TD 180/100 mmHg, HR 110x/menit, RR 34x/menit, SpO2 89 persen, pasien gelisah, dan terdengar ronki basah di seluruh lapang paru. Sambil menyiapkan obat, apakah tindakan nonfarmakologis awal yang paling tepat?",o:[["Memposisikan pasien terlentang datar","Posisi terlentang memperberat kongesti paru dan sesak."],["Memposisikan pasien semifowler","BENAR. Posisi duduk atau semifowler menurunkan aliran balik vena ke jantung sehingga mengurangi kongesti paru dan memperbaiki mekanika pernapasan."],["Memposisikan pasien Trendelenburg","Posisi kepala lebih rendah meningkatkan preload dan memperparah edema paru."],["Memposisikan pasien miring ke kiri","Posisi ini dipakai pada kehamilan untuk mencegah kompresi vena kava, bukan pada edema paru."],["Memposisikan pasien knee-chest","Posisi knee-chest digunakan untuk tet spell pada tetralogi Fallot."]],a:1,e:"Penanganan edema paru akut mencakup posisi duduk, oksigen atau ventilasi tekanan positif noninvasif, nitrat, dan diuretik. Langkah nonfarmakologis sederhana ini dapat segera memperbaiki oksigenasi."},
{t:"Gagal Jantung",s:"3A",q:"Seorang laki-laki 62 tahun datang ke poliklinik dengan sesak saat aktivitas dan berdebar sejak 2 bulan. Pemeriksaan fisik TD 120/80 mmHg, HR 120x/menit ireguler, JVP meningkat, ronki basah basal, dan edema tungkai. EKG menunjukkan irama ireguler tanpa gelombang P. Apakah kombinasi terapi yang paling tepat?",o:[["Furosemide dan amlodipin","Amlodipin tidak mengontrol laju ventrikel pada fibrilasi atrium."],["Furosemide dan digoksin","BENAR. Diuretik mengatasi kongesti sedangkan digoksin mengontrol laju ventrikel pada fibrilasi atrium yang disertai gagal jantung."],["Furosemide dan nifedipin","Nifedipin kerja cepat dapat memicu takikardia refleks."],["Spironolakton dan amiodaron","Kombinasi ini tidak memberikan dekongesti maupun kontrol laju yang cepat."],["Digoksin dan bisoprolol dosis tinggi","Beta blocker dosis tinggi berbahaya pada fase kongesti akut yang belum terkompensasi."]],a:1,e:"Digoksin bermanfaat untuk kontrol laju pada pasien fibrilasi atrium dengan gagal jantung dan tekanan darah rendah, karena tidak memiliki efek inotropik negatif. Pantau kadar kalium dan tanda intoksikasi."},
{t:"Penyakit Jantung Koroner",s:"—",st:"Kompetensi farmakologi",q:"Seorang laki-laki 60 tahun dengan gagal jantung mendapatkan digoksin. Dokter mengingatkan pasien untuk kontrol laboratorium rutin karena kondisi tertentu dapat meningkatkan risiko keracunan obat tersebut. Apakah kondisi yang meningkatkan risiko intoksikasi digoksin?",o:[["Hiperkalemia","Kalium tinggi justru menurunkan ikatan digoksin pada pompa natrium kalium ATPase."],["Hipernatremia","Kadar natrium tinggi tidak berhubungan langsung dengan toksisitas digoksin."],["Hiperkalsemia ringan","Kalsium tinggi dapat memperberat aritmia namun bukan faktor risiko utama yang dipantau rutin."],["Hipomagnesemia berat","Magnesium rendah memang meningkatkan risiko, tetapi faktor tersering dan paling sering diuji adalah kalium rendah."],["Hipokalemia","BENAR. Kalium rendah meningkatkan ikatan digoksin pada pompa natrium kalium ATPase sehingga memicu intoksikasi, dan sering terjadi akibat penggunaan diuretik."]],a:4,e:"Gejala intoksikasi digoksin meliputi mual, muntah, gangguan penglihatan warna kuning kehijauan, dan berbagai aritmia. Kombinasi digoksin dengan diuretik loop menuntut pemantauan kalium berkala."},
{t:"Cor Pulmonale",s:"3A",q:"Seorang laki-laki 60 tahun datang ke poliklinik dengan bengkak pada kedua kaki sejak 1 minggu dan sesak yang memberat sejak 1 tahun. Ia perokok lama dengan batuk kronik. Pemeriksaan fisik TD 120/80 mmHg, HR 96x/menit, RR 24x/menit, JVP meningkat, hepatomegali, dan edema pretibial. EKG menunjukkan gelombang P tinggi lancip di lead II. Apakah diagnosisnya?",o:[["Cor pulmonale kompensata","Fase kompensata belum menunjukkan tanda bendungan sistemik."],["Cor pulmonale dekompensata","BENAR. Adanya tanda gagal jantung kanan berupa JVP meningkat, hepatomegali, dan edema pada pasien penyakit paru kronik menunjukkan cor pulmonale yang sudah dekompensasi."],["Gagal jantung kiri","Gagal jantung kiri memberi kongesti paru dominan berupa ortopnea dan ronki basah halus."],["Gagal jantung kongestif akibat hipertensi","Tidak ada riwayat hipertensi dan gambaran EKG mengarah ke beban jantung kanan."],["Penyakit paru obstruktif kronis eksaserbasi","Eksaserbasi PPOK memberi perburukan sesak dan dahak, tanpa tanda bendungan sistemik."]],a:1,e:"P pulmonal lebih dari 2,5 mm menandakan pembesaran atrium kanan. Tatalaksananya adalah oksigen jangka panjang, terapi penyakit paru dasar, dan diuretik hati-hati agar tidak menurunkan preload ventrikel kanan berlebihan."},
{t:"Cor Pulmonale",s:"3A",q:"Seorang laki-laki 58 tahun perokok berat datang dengan sesak dan bengkak tungkai. Ia didiagnosis cor pulmonale akibat penyakit paru obstruktif kronis. Apakah mekanisme utama yang menyebabkan terjadinya kondisi tersebut?",o:[["Dilatasi pembuluh darah pulmoner akibat inflamasi","Inflamasi kronik pada PPOK menyebabkan remodeling dan vasokonstriksi, bukan dilatasi."],["Peningkatan tekanan atrium kiri yang diteruskan ke paru","Mekanisme ini terjadi pada gagal jantung kiri dan stenosis mitral, bukan penyakit paru primer."],["Penurunan resistensi vaskular sistemik","Penurunan resistensi sistemik menyebabkan syok distributif, bukan hipertensi pulmonal."],["Konstriksi pembuluh darah pulmoner akibat hipoksia","BENAR. Hipoksia alveolar kronik memicu vasokonstriksi arteriol pulmonal sehingga resistensi vaskular paru meningkat dan ventrikel kanan mengalami hipertrofi lalu gagal."],["Regurgitasi katup trikuspid primer","Regurgitasi trikuspid biasanya merupakan konsekuensi, bukan penyebab awal cor pulmonale."]],a:3,e:"Vasokonstriksi pulmonal hipoksik adalah alasan mengapa oksigen jangka panjang menjadi terapi yang memperbaiki survival pada PPOK hipoksemik dengan cor pulmonale."},
{t:"Aritmia",s:"3A",q:"Seorang laki-laki 68 tahun datang ke poliklinik dengan keluhan pusing ringan sejak 2 hari tanpa pingsan. Pemeriksaan fisik TD 110/70 mmHg, HR 55x/menit reguler, RR 18x/menit, akral hangat, produksi urin cukup. EKG menunjukkan sinus bradikardia tanpa blok maupun iskemia. Apakah tatalaksana yang paling tepat?",o:[["Injeksi sulfas atropin 1 mg","Atropin diberikan pada bradikardia dengan tanda hipoperfusi seperti hipotensi, penurunan kesadaran, atau syok."],["Pemasangan pacu jantung transkutan","Pacu jantung diindikasikan pada bradikardia simtomatik berat yang tidak responsif obat."],["Oksigenasi dan observasi","BENAR. Bradikardia dengan hemodinamik stabil tanpa tanda hipoperfusi cukup ditangani dengan oksigen bila perlu, pemantauan, dan pencarian penyebab."],["Infus dopamin 5 mikrogram per kilogram per menit","Kronotropik intravena hanya diperlukan pada bradikardia simtomatik yang refrakter atropin."],["Injeksi epinefrin 1 mg intravena","Epinefrin bolus 1 mg adalah dosis henti jantung dan berbahaya pada pasien dengan perfusi baik."]],a:2,e:"Prinsip algoritma bradikardia adalah menilai apakah bradikardia menyebabkan gejala hipoperfusi. Bila tidak, cukup observasi dan evaluasi penyebab seperti obat, hipotiroid, dan gangguan elektrolit."},
