{t:"Aritmia",s:"3A",q:"Seorang perempuan 60 tahun datang dengan berdebar sejak 4 jam. EKG menunjukkan fibrilasi atrium dengan respons ventrikel cepat dan hemodinamik masih stabil. Dokter mempertimbangkan strategi kardioversi. Apakah kondisi yang paling mendukung dilakukannya kardioversi tanpa antikoagulasi pendahuluan?",o:[["Frekuensi nadi lebih dari 100 kali per menit","Laju cepat menentukan kebutuhan kontrol laju, bukan keamanan kardioversi."],["Adanya keluhan berdebar yang mengganggu","Gejala memengaruhi indikasi tetapi tidak menentukan risiko tromboemboli."],["Adanya nyeri dada di sisi kiri","Nyeri dada menuntut evaluasi iskemia, bukan penentu waktu kardioversi."],["Onset aritmia kurang dari 6 jam","BENAR. Onset yang jelas kurang dari 48 jam, terlebih kurang dari 12 jam, memiliki risiko trombus atrium yang rendah sehingga kardioversi dapat dilakukan lebih awal."],["Tekanan darah sistolik kurang dari 120 mmHg","Nilai tekanan darah tersebut masih normal dan bukan penanda instabilitas."]],a:3,e:"Bila onset lebih dari 48 jam atau tidak diketahui, diperlukan antikoagulasi 3 minggu sebelum kardioversi atau ekokardiografi transesofageal untuk menyingkirkan trombus. Antikoagulasi tetap dilanjutkan 4 minggu setelah konversi."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 50 tahun tiba-tiba tidak sadarkan diri saat bermain futsal. Tidak ada nadi karotis dan tidak bernapas. Defibrilator bifasik tersedia dan monitor menunjukkan fibrilasi ventrikel. Apakah urutan tindakan yang paling tepat?",o:[["Defibrilasi 200 Joule bifasik kemudian kompresi dada","BENAR. Pada irama yang dapat dikejut dengan defibrilator siap pakai, lakukan kejut segera lalu langsung lanjutkan kompresi dada selama 2 menit tanpa memeriksa nadi."],["Kompresi dada 5 siklus kemudian defibrilasi","Menunda kejut listrik pada fibrilasi ventrikel yang tersaksikan menurunkan angka keberhasilan."],["Pemberian epinefrin kemudian defibrilasi","Epinefrin diberikan setelah kejut pertama, bukan menggantikannya."],["Pemberian amiodaron kemudian defibrilasi","Amiodaron diberikan setelah kejut ketiga pada fibrilasi ventrikel refrakter."],["Kardioversi tersinkronisasi 100 Joule kemudian kompresi dada","Sinkronisasi tidak dapat dilakukan pada fibrilasi ventrikel."]],a:0,e:"Defibrilasi dini adalah mata rantai kelangsungan hidup yang paling menentukan pada henti jantung dengan irama shockable. Setelah kejut, kompresi harus dilanjutkan segera untuk mempertahankan perfusi koroner."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 45 tahun mengalami henti jantung di IGD. Setelah 5 siklus resusitasi jantung paru, evaluasi monitor menunjukkan fibrilasi ventrikel dan nadi karotis tetap tidak teraba. Akses intravena sudah terpasang. Apakah tatalaksana selanjutnya yang paling tepat?",o:[["Melanjutkan kompresi dada tanpa kejut listrik","Kompresi saja tidak akan mengakhiri fibrilasi ventrikel."],["Kardioversi tersinkronisasi dan pemberian amiodaron","Sinkronisasi tidak dapat dilakukan pada fibrilasi ventrikel."],["Pemberian natrium bikarbonat dan kalsium glukonas","Kedua obat ini hanya untuk indikasi khusus seperti hiperkalemia dan intoksikasi."],["Kejut listrik dilanjutkan resusitasi jantung paru dan epinefrin 1 mg","BENAR. Pada irama shockable, lakukan defibrilasi, segera lanjutkan kompresi 2 menit, dan berikan epinefrin 1 mg setelah kejut pertama serta diulang tiap 3 sampai 5 menit."],["Pemasangan pacu jantung transkutan","Pacu jantung tidak berguna pada fibrilasi ventrikel."]],a:3,e:"Algoritma henti jantung dewasa: irama shockable ditangani kejut, RJP 2 menit, epinefrin setelah kejut pertama, dan amiodaron atau lidokain setelah kejut ketiga, sambil mengoreksi penyebab 5H dan 5T."},
{t:"Penyakit Katup",s:"2",q:"Seorang laki-laki 40 tahun datang dengan sesak saat aktivitas sejak 6 bulan. Pemeriksaan fisik menemukan tekanan nadi lebar, murmur diastolik dekresendo di parasternal kiri atas, disertai murmur mid-diastolik halus di apeks tanpa opening snap. Apakah kelainan katup pada pasien ini?",o:[["Stenosis mitral","Stenosis mitral memberikan opening snap yang pada pasien ini tidak ditemukan."],["Regurgitasi aorta","BENAR. Murmur diastolik dekresendo dengan tekanan nadi lebar disertai murmur Austin Flint di apeks adalah gambaran regurgitasi aorta."],["Stenosis aorta","Stenosis aorta memberi murmur ejeksi sistolik dan pulsus parvus et tardus."],["Regurgitasi mitral","Regurgitasi mitral memberi murmur holosistolik di apeks."],["Regurgitasi pulmonal","Regurgitasi pulmonal memberi murmur Graham Steell yang biasanya menyertai hipertensi pulmonal berat."]],a:1,e:"Murmur Austin Flint terjadi karena pancaran regurgitasi aorta membentur daun katup mitral anterior sehingga menyerupai stenosis mitral fungsional. Membedakannya penting agar tidak salah menilai kelainan katup."},
{t:"Aritmia",s:"3B",q:"Seorang perempuan 70 tahun datang dengan pusing berputar dan lemas sejak 3 jam. Pemeriksaan fisik TD 90/60 mmHg, HR 55x/menit, RR 20x/menit, akral dingin, dan pasien tampak lemah. EKG menunjukkan bradikardia sinus tanpa blok derajat tinggi. Apakah tatalaksana awal yang paling tepat?",o:[["Injeksi sulfas atropin intravena","BENAR. Bradikardia yang disertai tanda hipoperfusi berupa hipotensi dan akral dingin ditangani dengan atropin 1 mg intravena sebagai langkah pertama."],["Pemberian cairan kristaloid 1000 mL cepat","Hipotensi pasien disebabkan laju jantung lambat, bukan kekurangan volume."],["Injeksi epinefrin 1 mg bolus intravena","Dosis bolus tersebut adalah dosis henti jantung dan tidak sesuai untuk bradikardia dengan nadi."],["Pemberian oksigen dan observasi saja","Observasi saja tidak cukup karena sudah muncul tanda hipoperfusi."],["Kardioversi tersinkronisasi 50 Joule","Kardioversi ditujukan untuk takiaritmia, bukan bradikardia."]],a:0,e:"Bila atropin gagal, langkah berikutnya adalah pacu jantung transkutan atau infus dopamin maupun epinefrin. Selalu cari penyebab reversibel seperti iskemia, obat penghambat nodus AV, dan gangguan elektrolit."},
{t:"Penyakit Katup",s:"2",q:"Seorang perempuan 38 tahun dengan riwayat demam rematik datang untuk kontrol. Pemeriksaan fisik menemukan murmur mid-diastolik di apeks dengan opening snap. Pasien saat ini masih beraktivitas normal. Apakah komplikasi aritmia yang paling sering terjadi pada kondisi ini?",o:[["Ventrikel takikardia","VT lebih berkaitan dengan penyakit jantung iskemik dan kardiomiopati."],["Blok AV derajat 3","Blok AV total berkaitan dengan penyakit sistem konduksi degeneratif dan infark inferior."],["Supraventrikular takikardia","SVT berasal dari sirkuit reentri nodal dan tidak khas pada stenosis mitral."],["Fibrilasi atrium","BENAR. Dilatasi atrium kiri akibat stenosis mitral menyebabkan remodeling atrium sehingga fibrilasi atrium adalah komplikasi aritmia tersering."],["Fibrilasi ventrikel","VF merupakan irama henti jantung yang tidak khas sebagai komplikasi stenosis mitral."]],a:3,e:"Fibrilasi atrium pada stenosis mitral disebut fibrilasi atrium valvular dan memiliki risiko tromboemboli sangat tinggi, sehingga antikoagulan pilihannya adalah warfarin, bukan antikoagulan oral langsung."},
{t:"Penyakit Katup",s:"2",q:"Seorang perempuan 42 tahun dengan stenosis mitral lama datang dengan sesak dan bengkak tungkai. Dokter melakukan pemeriksaan EKG dan menemukan tanda beban ruang jantung. Apakah kelainan yang paling mungkin ditemukan?",o:[["Hipertrofi ventrikel kiri dan atrium kiri","Ventrikel kiri justru tidak terbebani pada stenosis mitral karena aliran masuknya terhambat."],["Hipertrofi ventrikel kiri dan atrium kanan","Kombinasi ini tidak sesuai dengan patofisiologi stenosis mitral."],["Hipertrofi ventrikel kanan dan atrium kanan","Atrium kanan dapat membesar pada tahap sangat lanjut, tetapi pembesaran atrium kiri adalah yang paling khas."],["Hipertrofi atrium kiri saja","Pada stenosis mitral lanjut dengan hipertensi pulmonal, ventrikel kanan juga mengalami hipertrofi."],["Hipertrofi ventrikel kanan dan atrium kiri","BENAR. Stenosis mitral membendung atrium kiri sehingga terjadi P mitral, lalu tekanan diteruskan ke paru sehingga ventrikel kanan mengalami hipertrofi."]],a:4,e:"Rangkaian patofisiologi stenosis mitral adalah pembesaran atrium kiri, kongesti paru, hipertensi pulmonal, hipertrofi ventrikel kanan, hingga gagal jantung kanan. Hemoptisis dan disfagia dapat muncul akibat atrium kiri yang membesar."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang perempuan 27 tahun datang dengan demam yang tidak kunjung sembuh sejak 1 minggu disertai berdebar. Pemeriksaan fisik T 38,2 C dan murmur sistolik di apeks. Ekokardiografi menemukan vegetasi pada katup mitral, namun kultur darah belum menunjukkan hasil dan tidak ditemukan fenomena vaskular maupun imunologis lain. Apakah klasifikasi diagnosis menurut kriteria Duke?",o:[["Endokarditis infektif definitif","Diagnosis definitif memerlukan dua kriteria mayor, atau satu mayor dengan tiga minor, atau lima kriteria minor."],["Endokarditis infektif possible","BENAR. Satu kriteria mayor berupa vegetasi ditambah satu kriteria minor berupa demam memenuhi kategori possible."],["Endokarditis infektif rejected","Kategori rejected dipakai bila ada diagnosis alternatif yang pasti atau gejala hilang dalam 4 hari terapi antibiotik."],["Endokarditis infektif kultur negatif","Istilah ini menggambarkan penyebab mikrobiologis, bukan kategori kepastian diagnosis Duke."],["Endokarditis noninfektif trombotik","Endokarditis marantik terjadi pada keganasan lanjut tanpa demam infeksius."]],a:1,e:"Kriteria mayor Duke adalah kultur darah positif tipikal dan bukti keterlibatan endokard. Kriteria minor mencakup predisposisi, demam lebih dari 38 C, fenomena vaskular, fenomena imunologis, dan bukti mikrobiologis yang tidak memenuhi kriteria mayor."},
{t:"Endokarditis dan Demam Rematik",s:"3A",q:"Seorang laki-laki 35 tahun datang dengan demam berulang sejak 1 bulan disertai lemas dan berat badan menurun. Ia memiliki riwayat penyakit jantung rematik. Pemeriksaan fisik menemukan murmur sistolik di apeks dan splenomegali. Ekokardiografi menemukan vegetasi pada katup mitral. Apakah mikroorganisme penyebab tersering pada perjalanan penyakit seperti ini?",o:[["Staphylococcus aureus","S. aureus menyebabkan endokarditis akut dengan perjalanan fulminan dalam hitungan hari."],["Streptococcus viridans","BENAR. Perjalanan subakut selama berminggu-minggu pada katup yang sudah rusak paling sering disebabkan Streptococcus viridans."],["Pseudomonas aeruginosa","Pseudomonas jarang dan biasanya berkaitan dengan penggunaan narkoba suntik atau infeksi nosokomial."],["Escherichia coli","Bakteri gram negatif enterik jarang menyebabkan endokarditis katup asli."],["Candida albicans","Endokarditis jamur terjadi pada pasien imunokompromis atau dengan katup prostetik."]],a:1,e:"Membedakan endokarditis akut dan subakut membantu menebak kuman penyebab dan menentukan antibiotik empiris sambil menunggu hasil kultur darah."},
{t:"Kardiomiopati dan Perikardium",s:"1",q:"Seorang perempuan 30 tahun datang dengan sesak dan bengkak tungkai sejak 1 bulan pada bulan pertama setelah melahirkan. Ia tidak memiliki riwayat penyakit jantung sebelumnya. Ekokardiografi menunjukkan dilatasi ventrikel kiri dengan fraksi ejeksi 38 persen tanpa kelainan katup. Apakah diagnosisnya?",o:[["Kardiomiopati dilatasi","BENAR. Kardiomiopati peripartum merupakan bentuk kardiomiopati dilatasi yang muncul pada akhir kehamilan hingga beberapa bulan pascapersalinan."],["Kardiomiopati hipertrofi","Kardiomiopati hipertrofi menunjukkan penebalan dinding, bukan dilatasi dengan fraksi ejeksi menurun."],["Kardiomiopati restriktif","Kardiomiopati restriktif menunjukkan ukuran ventrikel normal dengan gangguan pengisian diastolik."],["Kardiomiopati hipertensif","Kardiomiopati hipertensif memerlukan riwayat hipertensi lama."],["Kardiomiopati iskemik","Kardiomiopati iskemik memerlukan penyakit koroner bermakna yang tidak dijumpai pada pasien muda ini."]],a:0,e:"Kardiomiopati peripartum ditangani seperti gagal jantung dengan fraksi ejeksi menurun, dengan penyesuaian obat saat menyusui karena ACE inhibitor dan ARB dikontraindikasikan selama kehamilan."},
{t:"Penyakit Katup",s:"2",q:"Seorang laki-laki 45 tahun dengan penyakit jantung rematik mengalami kerusakan katup mitral berat dan gejala gagal jantung yang menetap meskipun terapi medis telah optimal. Ekokardiografi menunjukkan regurgitasi mitral berat dengan fraksi ejeksi masih baik. Apakah tatalaksana definitif pada pasien ini?",o:[["Pemberian diuretik dosis tinggi","Diuretik hanya meredakan gejala tanpa memperbaiki kerusakan katup."],["Pemberian penghambat ACE seumur hidup","Terapi medis mengurangi beban namun tidak mengatasi lesi struktural."],["Profilaksis penisilin jangka panjang","Profilaksis mencegah serangan rematik berulang tetapi tidak memperbaiki katup yang sudah rusak."],["Pemberian antikoagulan warfarin","Antikoagulan mencegah tromboemboli, bukan memperbaiki fungsi katup."],["Penggantian katup","BENAR. Kerusakan katup berat dengan gejala menetap merupakan indikasi intervensi bedah berupa perbaikan atau penggantian katup."]],a:4,e:"Indikasi intervensi katup meliputi regurgitasi berat yang simtomatik atau disertai penurunan fungsi ventrikel kiri maupun dilatasi progresif. Pasien tetap memerlukan profilaksis endokarditis pascatindakan sesuai indikasi."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 28 tahun dibawa ke IGD setelah kecelakaan sepeda motor dengan benturan dada. Pemeriksaan fisik TD 80/50 mmHg, HR 130x/menit, RR 32x/menit, perkusi dada kanan hipersonor, suara napas kanan menghilang, deviasi trakea ke kiri, dan JVP meningkat. Apakah jenis syok yang dialami pasien?",o:[["Syok obstruktif","BENAR. Tension pneumothorax menghambat aliran balik vena dan pengisian jantung sehingga menyebabkan syok obstruktif."],["Syok hipovolemik","Syok hipovolemik memberi JVP yang justru kolaps akibat kehilangan volume."],["Syok kardiogenik","Syok kardiogenik disebabkan kegagalan pompa jantung, bukan hambatan mekanik dari luar."],["Syok distributif","Syok distributif memberi akral hangat akibat vasodilatasi."],["Syok neurogenik","Syok neurogenik memberi hipotensi dengan bradikardia setelah cedera medula spinalis."]],a:0,e:"Tension pneumothorax adalah diagnosis klinis dan tidak boleh menunggu foto toraks. Tindakan segera adalah dekompresi jarum lalu pemasangan chest tube."},
{t:"Penyakit Jantung Kongenital",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang anak perempuan 8 tahun dibawa ke poli karena sering mengalami infeksi saluran napas berulang dan berat badan sulit naik. Auskultasi menemukan wide fixed splitting S2 dengan murmur ejeksi sistolik halus di area pulmonal. Apakah gambaran EKG yang paling mungkin ditemukan?",o:[["Gelombang delta di sadapan prekordial","Gelombang delta menandakan preeksitasi ventrikel pada sindrom Wolff-Parkinson-White."],["Gelombang Q patologis di sadapan inferior","Q patologis menandakan infark lama yang sangat jarang pada anak."],["Depresi segmen ST di sadapan lateral","Depresi ST lateral menandakan iskemia atau strain ventrikel kiri."],["Elevasi segmen ST difus dengan depresi PR","Gambaran ini adalah perikarditis akut."],["Pola RSr aksen di sadapan V1","BENAR. Beban volume ventrikel kanan pada defek septum atrium menghasilkan pola blok cabang berkas kanan inkomplet berupa RSr aksen di V1."]],a:4,e:"Kombinasi wide fixed splitting S2 dengan RSr aksen di V1 sangat sugestif ASD. Konfirmasi dilakukan dengan ekokardiografi untuk menilai ukuran defek dan arah pirau."},
{t:"Vaskular Perifer",s:"1",q:"Seorang laki-laki 62 tahun datang dengan pusing berputar yang muncul saat menggunakan lengan kiri untuk bekerja. Pemeriksaan fisik menemukan perbedaan tekanan darah 25 mmHg antara lengan kanan dan kiri, dengan pulsasi radialis kiri melemah. Apakah etiologi yang mendasari keluhan pasien?",o:[["Trombosis vena subklavia","Trombosis vena menyebabkan pembengkakan lengan, bukan gejala vertebrobasilar."],["Aterosklerosis arteri subklavia","BENAR. Stenosis aterosklerotik pada arteri subklavia proksimal menyebabkan aliran balik pada arteri vertebralis sehingga muncul gejala saat lengan bekerja."],["Diseksi arteri karotis interna","Diseksi karotis memberi nyeri leher dengan gejala sirkulasi anterior dan sindrom Horner."],["Kompresi pleksus brakialis","Kompresi pleksus memberi keluhan neurologis lengan tanpa perbedaan tekanan darah bermakna."],["Koarktasio aorta","Koarktasio memberi perbedaan tekanan darah antara ekstremitas atas dan bawah, bukan antar lengan."]],a:1,e:"Perbedaan tekanan darah antar lengan lebih dari 15 mmHg adalah petunjuk penting penyakit arteri subklavia. Tatalaksana definitif adalah angioplasti dengan stent atau bedah pintas."},
{t:"Penyakit Jantung Koroner",s:"3B",q:"Seorang laki-laki 60 tahun datang dengan nyeri dada 3 jam dan EKG menunjukkan elevasi ST di sadapan anterior. Ia memiliki riwayat ulkus peptikum dan buang air besar berwarna hitam sejak 2 hari. Fasilitas PCI berjarak sekitar 90 menit perjalanan. Apakah strategi reperfusi yang paling tepat?",o:[["Fibrinolisis dengan streptokinase","Perdarahan saluran cerna aktif merupakan kontraindikasi absolut fibrinolitik."],["Primary percutaneous coronary intervention","BENAR. Dengan waktu tempuh masih dalam 120 menit dan adanya kontraindikasi fibrinolitik, PCI primer adalah pilihan reperfusi yang tepat."],["Rescue percutaneous coronary intervention","Rescue PCI dilakukan setelah fibrinolisis gagal, sedangkan fibrinolisis tidak boleh diberikan di sini."],["Pemasangan pacu jantung transkutan","Pacu jantung tidak berperan pada reperfusi koroner."],["Kardioversi tersinkronisasi","Kardioversi ditujukan untuk takiaritmia dengan gangguan hemodinamik."]],a:1,e:"Kontraindikasi absolut fibrinolitik meliputi perdarahan aktif, riwayat perdarahan intrakranial, stroke iskemik dalam 6 bulan, diseksi aorta, dan trauma kepala berat. Pada kondisi tersebut PCI primer menjadi satu-satunya pilihan reperfusi."},
{t:"Aritmia",s:"3A",q:"Seorang laki-laki 45 tahun datang dengan berdebar dan riwayat hipertensi. Pemeriksaan fisik TD 130/85 mmHg, HR 92x/menit. EKG menunjukkan setiap dua denyut sinus normal diikuti satu kompleks QRS lebar prematur yang berulang secara teratur. Apakah gambaran EKG tersebut?",o:[["Ventrikular bigemini","Bigemini berarti setiap satu denyut sinus diikuti satu denyut ventrikel prematur."],["Ventrikular trigemini","BENAR. Pola dua denyut sinus diikuti satu denyut ventrikel prematur secara berulang disebut trigemini ventrikel."],["Ventrikular kuadrigemini","Kuadrigemini berarti tiga denyut sinus diikuti satu denyut prematur."],["Ventrikular couplet","Couplet berarti dua denyut ventrikel prematur yang berurutan."],["Ventrikular takikardia nonsustained","VT nonsustained berarti tiga atau lebih denyut ventrikel berurutan yang berlangsung kurang dari 30 detik."]],a:1,e:"Penamaan pola PVC penting untuk komunikasi klinis. Beban PVC yang tinggi dapat menyebabkan kardiomiopati sehingga memerlukan evaluasi Holter dan ekokardiografi."},
{t:"Aritmia",s:"3A",q:"Seorang laki-laki 58 tahun datang dengan dada berdebar sejak 2 hari. Pemeriksaan fisik TD 135/85 mmHg, HR 92x/menit, akral hangat, tidak ada sesak maupun nyeri dada. EKG menunjukkan fibrilasi atrium dengan respons ventrikel terkendali dan pasien belum mendapat terapi apa pun. Apakah terapi yang paling tepat diberikan?",o:[["Kardioversi tersinkronisasi segera","Kardioversi listrik tidak diperlukan pada pasien stabil dengan laju terkendali."],["Adenosin bolus intravena","Adenosin tidak menghentikan fibrilasi atrium."],["Bisoprolol oral","BENAR. Strategi kontrol laju pada fibrilasi atrium stabil menggunakan beta blocker seperti bisoprolol sebagai lini pertama."],["Digoksin intravena bolus cepat","Digoksin dipilih terutama pada pasien dengan gagal jantung atau tekanan darah rendah."],["Amiodaron intravena kontinu","Amiodaron dipertimbangkan bila kontrol laju dengan obat lain gagal atau pada pasien gagal jantung berat."]],a:2,e:"Manajemen fibrilasi atrium mengikuti prinsip ABC yaitu Avoid stroke dengan antikoagulan sesuai skor CHA2DS2-VASc, Better symptom control dengan kontrol laju atau irama, dan Comorbidity management."},
{t:"Penyakit Jantung Koroner",s:"3A",q:"Seorang laki-laki 66 tahun datang untuk kontrol rutin. Ia pernah dipasang stent koroner 2 tahun lalu dan saat ini tidak mengeluh nyeri dada. Pemeriksaan fisik dalam batas normal dan enzim jantung normal. EKG menunjukkan gelombang Q patologis di sadapan V1 sampai V4 tanpa elevasi segmen ST. Apakah diagnosisnya?",o:[["STEMI anteroseptal akut","STEMI akut memerlukan elevasi segmen ST dan gejala iskemik aktif."],["NSTEMI","NSTEMI memerlukan peningkatan biomarka jantung."],["Angina pektoris tidak stabil","Angina tidak stabil memerlukan gejala iskemik yang progresif."],["Old myocardial infarction","BENAR. Gelombang Q patologis tanpa gejala, tanpa elevasi ST, dan dengan enzim normal menandakan infark miokard lama."],["Perikarditis konstriktif","Perikarditis konstriktif memberi tanda gagal jantung kanan dengan penebalan perikard."]],a:3,e:"Pasien pasca infark memerlukan terapi pencegahan sekunder seumur hidup berupa antiplatelet, statin intensitas tinggi, penghambat ACE, beta blocker, dan rehabilitasi jantung."},
{t:"Aritmia",s:"3A",q:"Seorang perempuan 48 tahun dengan hipertiroid datang dengan fibrilasi atrium respons ventrikel cepat. Tekanan darah stabil dan tidak ada tanda gagal jantung akut. Apakah golongan obat yang paling tepat untuk mengendalikan laju jantungnya?",o:[["Beta blocker","BENAR. Beta blocker mengendalikan laju ventrikel sekaligus meredakan gejala adrenergik akibat tirotoksikosis."],["Digitalis glikosida","Digoksin kurang efektif pada keadaan dengan tonus adrenergik tinggi."],["Antagonis kalsium dihidropiridin","Dihidropiridin seperti amlodipin tidak memperlambat konduksi nodus AV."],["Penghambat enzim konversi angiotensin","Penghambat ACE tidak memiliki efek kronotropik negatif."],["Diuretik loop","Diuretik tidak mengendalikan laju jantung."]],a:0,e:"Pada fibrilasi atrium akibat tirotoksikosis, kontrol laju dengan beta blocker dikombinasikan terapi definitif hipertiroid. Aritmia sering pulih setelah kondisi eutiroid tercapai."},
{t:"Cor Pulmonale",s:"—",st:"Kompetensi interpretasi EKG",q:"Seorang laki-laki 60 tahun dengan penyakit paru obstruktif kronis menjalani pemeriksaan EKG. Didapatkan deviasi aksis ke kanan, rasio gelombang R terhadap S lebih dari 1 di V1, dan gelombang S persisten di V5 sampai V6. Apakah interpretasi EKG tersebut?",o:[["Hipertrofi ventrikel kanan","BENAR. Deviasi aksis kanan dengan R dominan di V1 dan S persisten di sadapan lateral adalah kriteria hipertrofi ventrikel kanan."],["Hipertrofi ventrikel kiri","LVH menunjukkan voltase tinggi di sadapan lateral dengan deviasi aksis kiri."],["Hipertrofi atrium kiri","Pembesaran atrium kiri memberi P mitral yang lebar dan berlekuk."],["Blok cabang berkas kiri","LBBB memerlukan QRS lebar dengan pola khas di sadapan lateral."],["Infark miokard posterior","Infark posterior memberi R dominan di V1 disertai depresi ST, dengan konteks klinis nyeri dada akut."]],a:0,e:"Hipertrofi ventrikel kanan pada PPOK menandakan cor pulmonale. Tanda penyerta yang sering ditemukan adalah P pulmonal dan aksis QRS yang bergeser ke kanan."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 62 tahun datang dengan sesak dan lemas. Pemeriksaan fisik TD 80/50 mmHg, HR 120x/menit, akral dingin, CRT lebih dari 3 detik, ronki basah di kedua basal paru, dan JVP meningkat. Pasien sudah mendapat cairan hati-hati tanpa perbaikan, dan pilihan obat yang tersedia hanya golongan inotropik dan antiaritmia. Apakah obat yang paling tepat untuk memperbaiki curah jantung?",o:[["Dopamin","Dopamin dapat digunakan namun berhubungan dengan lebih banyak takiaritmia dibandingkan alternatifnya."],["Adrenalin","Adrenalin meningkatkan konsumsi oksigen miokard dan risiko aritmia sehingga bukan pilihan utama."],["Dobutamin","BENAR. Dobutamin adalah inotropik pilihan untuk memperbaiki curah jantung pada gagal jantung dengan hipoperfusi dan kongesti."],["Amiodaron","Amiodaron adalah antiaritmia dan tidak memperbaiki kontraktilitas."],["Nitrogliserin","Nitrat dikontraindikasikan pada hipotensi berat."]],a:2,e:"Pada profil cold and wet, dobutamin memperbaiki curah jantung dan perfusi organ sehingga diuretik dapat bekerja lebih efektif. Bila tekanan darah tetap sangat rendah, tambahkan norepinefrin."},
{t:"Kegawatan Kardiovaskular",s:"3B",q:"Seorang laki-laki 55 tahun tiba-tiba kolaps di ruang rawat. Pemeriksaan menunjukkan pasien tidak sadar, tidak bernapas, dan nadi karotis tidak teraba. Monitor menampilkan fibrilasi ventrikel dan hanya tersedia defibrilator monofasik. Berapakah energi kejut yang paling tepat?",o:[["Defibrilasi 100 Joule","Energi tersebut terlalu rendah untuk defibrilator monofasik."],["Defibrilasi 200 Joule","Energi 200 Joule adalah rentang untuk defibrilator bifasik."],["Defibrilasi 360 Joule","BENAR. Pada defibrilator monofasik, energi yang direkomendasikan untuk fibrilasi ventrikel adalah 360 Joule."],["Kardioversi tersinkronisasi 100 Joule","Sinkronisasi tidak dapat dilakukan pada fibrilasi ventrikel."],["Kardioversi tersinkronisasi 200 Joule","Kardioversi hanya untuk takiaritmia dengan nadi."]],a:2,e:"Pemilihan energi bergantung jenis alat: monofasik 360 Joule, bifasik 120 sampai 200 Joule sesuai rekomendasi pabrik. Setelah kejut, kompresi dilanjutkan segera selama 2 menit."},
{t:"Penyakit Katup",s:"2",q:"Seorang laki-laki 50 tahun datang dengan bengkak tungkai dan perut membesar sejak 2 bulan. Pemeriksaan fisik menemukan JVP meningkat, murmur pansistolik di ICS III sampai IV linea parasternal sinistra yang mengeras saat inspirasi, hepatomegali, dan asites. Apakah kelainan katup pada pasien ini?",o:[["Stenosis mitral","Stenosis mitral memberi murmur diastolik di apeks."],["Insufisiensi mitral","Insufisiensi mitral memberi murmur sistolik di apeks yang menjalar ke aksila dan tidak dipengaruhi inspirasi."],["Insufisiensi trikuspid","BENAR. Murmur pansistolik di area trikuspid yang mengeras saat inspirasi disertai bendungan sistemik adalah insufisiensi trikuspid."],["Stenosis aorta","Stenosis aorta memberi murmur ejeksi sistolik di area aorta yang menjalar ke karotis."],["Insufisiensi aorta","Insufisiensi aorta memberi murmur diastolik dekresendo dengan tekanan nadi lebar."]],a:2,e:"Tanda Carvallo yaitu penguatan murmur saat inspirasi membedakan lesi katup jantung kanan dari kiri. Insufisiensi trikuspid tersering bersifat fungsional akibat dilatasi ventrikel kanan."},
{t:"Penyakit Jantung Koroner",s:"—",st:"Kompetensi patologi klinik",q:"Seorang laki-laki 62 tahun datang dengan nyeri dada sejak 8 jam. Dokter ingin memastikan adanya nekrosis miokard dengan penanda yang paling spesifik untuk otot jantung. Apakah pemeriksaan laboratorium yang paling tepat?",o:[["Mioglobin","Mioglobin meningkat paling dini namun tidak spesifik karena juga berasal dari otot rangka."],["Creatine kinase total","CK total meningkat pada berbagai kerusakan otot dan sangat tidak spesifik."],["Troponin I","BENAR. Troponin I adalah penanda paling spesifik untuk cedera miokard dan menjadi baku emas biomarka pada sindrom koroner akut."],["Laktat dehidrogenase","LDH meningkat lambat dan sudah ditinggalkan sebagai penanda infark."],["Aspartat aminotransferase","AST tidak spesifik dan lebih berkaitan dengan kerusakan hati serta otot."]],a:2,e:"Troponin high sensitivity memungkinkan alur rule-in dan rule-out cepat dalam 0 dan 1 jam. Peningkatan troponin tetap harus ditafsirkan bersama gambaran klinis karena dapat meningkat pada gagal jantung, emboli paru, dan penyakit ginjal."},
{t:"Penyakit Jantung Kongenital",s:"—",st:"Kompetensi radiologi",q:"Seorang anak laki-laki 4 tahun dibawa ke poli karena sering biru saat menangis dan jongkok ketika kelelahan. Pemeriksaan fisik menemukan sianosis sentral, jari tabuh, dan murmur ejeksi sistolik di ICS II parasternal sinistra. Apakah gambaran foto toraks yang paling mungkin ditemukan?",o:[["Egg on string appearance","Gambaran ini khas untuk transposisi arteri besar."],["Snowman appearance","Gambaran ini khas untuk total anomalous pulmonary venous return."],["Water bottle appearance","Gambaran ini khas untuk efusi perikard masif."],["Boot shaped heart","BENAR. Hipertrofi ventrikel kanan dengan segmen pulmonal cekung menghasilkan gambaran coeur en sabot atau jantung berbentuk sepatu bot pada tetralogi Fallot."],["Figure of three appearance","Gambaran ini khas untuk koarktasio aorta."]],a:3,e:"Mengenali gambaran radiologis klasik penyakit jantung bawaan membantu dokter umum melakukan rujukan dini. Pada tetralogi Fallot, vaskularisasi paru tampak berkurang dan segmen pulmonal cekung."},
{t:"Penyakit Katup",s:"2",q:"Seorang anak laki-laki 7 tahun dibawa ke poli karena mudah lelah saat bermain. Pemeriksaan fisik menemukan murmur ejeksi sistolik kasar di ICS II linea parasternal sinistra yang menjalar ke bahu kiri, disertai thrill dan S2 yang melebar. Tidak ada sianosis. Apakah kelainan katup pada pasien ini?",o:[["Stenosis aorta","Stenosis aorta memberi murmur di ICS II parasternal kanan yang menjalar ke arteri karotis."],["Stenosis pulmonal","BENAR. Murmur ejeksi sistolik di area pulmonal yang menjalar ke bahu kiri disertai thrill dan pelebaran S2 adalah stenosis pulmonal."],["Regurgitasi mitral","Regurgitasi mitral memberi murmur holosistolik di apeks yang menjalar ke aksila."],["Regurgitasi trikuspid","Regurgitasi trikuspid memberi murmur holosistolik di parasternal kiri bawah."],["Regurgitasi pulmonal","Regurgitasi pulmonal memberi murmur diastolik, bukan sistolik."]],a:1,e:"Stenosis pulmonal menyebabkan beban tekanan ventrikel kanan. Kasus berat memerlukan valvuloplasti balon, sedangkan kasus ringan cukup dipantau berkala."},
{t:"Penyakit Jantung Kongenital",s:"2",q:"Seorang anak laki-laki 2 tahun dibawa ke IGD karena mendadak biru dan sesak setelah menangis lama. Anak tampak sianosis, kemudian oleh ibunya diposisikan jongkok dan keluhan berkurang. Pemeriksaan fisik menemukan bunyi jantung kedua tunggal dan murmur ejeksi sistolik yang melemah saat serangan. Apakah diagnosisnya?",o:[["Tetralogy of Fallot","BENAR. Serangan sianotik yang membaik dengan posisi jongkok, S2 tunggal, dan murmur yang melemah saat serangan adalah tet spell pada tetralogi Fallot."],["Transposition of great arteries","TGA memberi sianosis berat sejak hari pertama kehidupan tanpa fenomena squatting."],["Truncus arteriosus","Trunkus arteriosus memberi gagal jantung dini dengan sianosis ringan pada bayi."],["Ventricular septal defect","VSD terisolasi bersifat asianotik."],["Atrial septal defect","ASD bersifat asianotik dengan wide fixed splitting S2."]],a:0,e:"Tatalaksana tet spell adalah posisi knee-chest, oksigen, morfin, cairan intravena, dan bila perlu fenilefrin untuk meningkatkan resistensi sistemik. Terapi definitifnya adalah koreksi bedah."}
];

const DURATION = 180 * 60;      // 180 menit
const KEY = "cbt-kardio-ukmppd-v1";
const LETTERS = ["A","B","C","D","E"];

/* ---------------- state ---------------- */
let S = null;

function shuffled(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function freshState(shuffle){
  const order = shuffle ? shuffled(QUESTIONS.length) : Array.from({length:QUESTIONS.length},(_,i)=>i);
  const opts = QUESTIONS.map(q=>shuffled(q.o.length));
  return {order, opts, ans:{}, flags:{}, cur:0, left:DURATION, started:false, finished:false, shuffle};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.order) && s.order.length === QUESTIONS.length) return s;
    }
  }catch(e){}
  return freshState(true);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------------- helpers ---------------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qAt = pos => QUESTIONS[S.order[pos]];
const qid = pos => S.order[pos];
const answered = () => Object.keys(S.ans).length;
function isCorrect(id){ return S.ans[id] === QUESTIONS[id].a; }
function fmt(sec){
  sec = Math.max(0, sec);
  const h = String(Math.floor(sec/3600)).padStart(2,"0");
  const m = String(Math.floor(sec%3600/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  return h+":"+m+":"+s;
}

/* ---------------- render ---------------- */
function renderTimer(){
  const el = document.getElementById("timer");
  el.textContent = fmt(S.left);
  el.className = "timer" + (S.left<=300?" crit":(S.left<=1800?" warn":""));
}

function renderNav(){
  const g = document.getElementById("grid");
  g.innerHTML = S.order.map((id,pos)=>{
    let cls = "gitem";
    if(S.finished){ if(id in S.ans) cls += isCorrect(id)?" right":" false"; }
    else if(id in S.ans) cls += " answered";
    if(S.flags[id]) cls += " flag";
    if(pos===S.cur) cls += " cur";
    return `<button class="${cls}" onclick="go(${pos})">${pos+1}</button>`;
  }).join("");
  document.getElementById("stAns").textContent = answered()+" / "+QUESTIONS.length;
  document.getElementById("stFlag").textContent = Object.values(S.flags).filter(Boolean).length;
}

function renderQuestion(){
  const pos = S.cur, id = qid(pos), q = qAt(pos);
  const chosen = S.ans[id];
  const reveal = S.finished || (chosen !== undefined);
  const map = S.opts[id];

  document.getElementById("qnum").textContent = "Soal " + (pos+1) + " dari " + QUESTIONS.length;
  document.getElementById("qtopic").textContent = q.t;
  document.getElementById("qskdi").textContent = "SKDI " + q.s + (q.st ? " · " + q.st : "");
  const fb = document.getElementById("flagbtn");
  fb.className = "flagbtn" + (S.flags[id] ? " on" : "");
  fb.textContent = (S.flags[id] ? "⚑ Ditandai ragu" : "⚐ Tandai ragu");

  document.getElementById("vignette").textContent = q.q;

  document.getElementById("opts").innerHTML = map.map((orig,i)=>{
    let cls = "opt";
    if(reveal){
      if(orig === q.a) cls += " correct";
      else if(orig === chosen) cls += " wrong";
    } else if(orig === chosen) cls += " sel";
    const rat = reveal ? `<span class="rat">${esc(q.o[orig][1])}</span>` : "";
    return `<button class="${cls}" onclick="pick(${orig})">
      <span class="lbl">${LETTERS[i]}</span>
      <span>${esc(q.o[orig][0])}${rat}</span>
    </button>`;
  }).join("");

  const exp = document.getElementById("exp");
  if(reveal){
    const keyLetter = LETTERS[map.indexOf(q.a)];
    exp.className = "exp";
    exp.innerHTML = `<div class="eh">Pembahasan</div><div class="eb">
      <div class="kv"><b>Kunci jawaban:</b><span class="val">${keyLetter}. ${esc(q.o[q.a][0])}</span></div>
      <div class="kv"><b>Level SKDI:</b><span>${esc(q.s)}${q.st? " — "+esc(q.st):""}</span></div>
      <p>${esc(q.e)}</p></div>`;
  } else {
    exp.className = "exp hidden"; exp.innerHTML = "";
  }

  document.getElementById("prev").disabled = pos===0;
  document.getElementById("next").disabled = pos===QUESTIONS.length-1;
  window.scrollTo({top:0,behavior:"smooth"});
}

function render(){ renderTimer(); renderNav(); renderQuestion(); }

/* ---------------- actions ---------------- */
function go(pos){ S.cur = pos; save(); render(); }
function step(d){ const n = S.cur + d; if(n>=0 && n<QUESTIONS.length) go(n); }
function pick(orig){
  if(S.finished) return;
  const id = qid(S.cur);
  if(id in S.ans) return;              // jawaban terkunci setelah pembahasan terbuka
  S.ans[id] = orig;
  if(!S.started){ S.started = true; startClock(); }
  save(); render();
}
function toggleFlag(){
  const id = qid(S.cur);
  S.flags[id] = !S.flags[id];
  save(); render();
}
function toggleShuffle(){
  if(answered()>0 && !confirm("Mengubah pengaturan acak akan mengulang sesi dari awal. Lanjutkan?")) return;
  const want = !S.shuffle;
  S = freshState(want); save(); syncToggle(); render();
}
function syncToggle(){
  document.getElementById("tog").className = "tog" + (S.shuffle ? " on" : "");
}
function resetAll(){
  if(!confirm("Hapus semua progres dan mulai ulang?")) return;
  const sh = S.shuffle; S = freshState(sh); save(); syncToggle(); render();
  document.getElementById("result").classList.add("hidden");
}

/* ---------------- timer ---------------- */
let ticker = null;
function startClock(){
  if(ticker) return;
  ticker = setInterval(()=>{
    if(S.finished || !S.started){ return; }
    S.left--;
    renderTimer();
    if(S.left % 5 === 0) save();
    if(S.left<=0){ finish(true); }
  },1000);
}

/* ---------------- finish ---------------- */
function finish(auto){
  if(!auto){
    const sisa = QUESTIONS.length - answered();
    if(sisa>0 && !confirm("Masih ada "+sisa+" soal belum dijawab. Selesaikan ujian sekarang?")) return;
  }
  S.finished = true; save();
  showResult(auto);
  render();
}

function showResult(auto){
  let benar = 0;
  const per = {};
  QUESTIONS.forEach((q,id)=>{
    per[q.t] = per[q.t] || {n:0,b:0};
    per[q.t].n++;
    if(id in S.ans && isCorrect(id)){ benar++; per[q.t].b++; }
  });
  const total = QUESTIONS.length;
  const nilai = Math.round(benar/total*1000)/10;
  const rows = Object.keys(per).sort().map(k=>
    `<tr><td>${esc(k)}</td><td>${per[k].b} / ${per[k].n}</td></tr>`).join("");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("resultBody").innerHTML = `
    <h2>${auto ? "Waktu habis" : "Ujian selesai"}</h2>
    <p>Semua pembahasan kini terbuka di setiap nomor soal.</p>
    <div class="big">${nilai}</div>
    <div class="bigsub">${benar} benar dari ${total} soal</div>
    <div class="score">
      <div class="scard"><b>${benar}</b><span>Benar</span></div>
      <div class="scard"><b>${answered()-benar}</b><span>Salah</span></div>
      <div class="scard"><b>${total-answered()}</b><span>Kosong</span></div>
    </div>
    <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);font-weight:650">Sebaran per topik</h3>
    <table class="topictable">${rows}</table>
    <div class="row" style="margin-top:20px">
      <button class="btn" onclick="resetAll()">Ulangi</button>
      <button class="btn primary" onclick="document.getElementById('result').classList.add('hidden')">Buka pembahasan</button>
    </div>`;
}

/* ---------------- boot ---------------- */
function boot(){
  document.getElementById("app").innerHTML = `
  <header><div class="hwrap">
    <div class="brand">
      <div class="dot">♥</div>
      <div><h1>CBT Kardiovaskular — UKMPPD</h1><p id="subt"></p></div>
    </div>
    <div id="timer" class="timer">03:00:00</div>
    <button class="btn ghost" onclick="resetAll()">Reset</button>
    <button class="btn primary" onclick="finish(false)">Selesai</button>
  </div></header>

  <div class="layout">
    <main class="card">
      <div class="qhead">
        <span class="qnum" id="qnum"></span>
        <span class="chip topic" id="qtopic"></span>
        <span class="chip" id="qskdi"></span>
        <button class="flagbtn" id="flagbtn" onclick="toggleFlag()"></button>
      </div>
      <div class="qbody">
        <div class="vignette" id="vignette"></div>
        <div class="opts" id="opts"></div>
        <div class="exp hidden" id="exp"></div>
      </div>
      <div class="qfoot">
        <button class="btn" id="prev" onclick="step(-1)">← Sebelumnya</button>
        <button class="btn" id="next" onclick="step(1)">Berikutnya →</button>
      </div>
    </main>

    <aside class="side">
      <div class="card sbox">
        <h3>Navigasi soal</h3>
        <div class="grid" id="grid"></div>
        <div class="legend">
          <span><i class="sw" style="background:var(--blue-bg);border:1px solid var(--blue)"></i>Terjawab</span>
          <span><i class="sw" style="background:var(--orange)"></i>Ragu</span>
          <span><i class="sw" style="background:var(--surface)"></i>Kosong</span>
        </div>
      </div>
      <div class="card sbox">
        <h3>Progres</h3>
        <div class="stat"><span>Terjawab</span><b id="stAns">0</b></div>
        <div class="stat"><span>Ditandai ragu</span><b id="stFlag">0</b></div>
        <div class="stat" style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px">
          <span>Acak urutan soal</span>
          <button class="tog" id="tog" onclick="toggleShuffle()"><i></i></button>
        </div>
      </div>
    </aside>
  </div>

  <div class="overlay hidden" id="result"><div class="modal" id="resultBody"></div></div>`;

  S = load();
  document.getElementById("subt").textContent = QUESTIONS.length + " soal · 180 menit · autosave aktif";
  syncToggle();
  render();
  if(S.started && !S.finished) startClock();
  if(S.finished) showResult(false);

  document.addEventListener("keydown", e=>{
    if(e.key==="ArrowLeft") step(-1);
    if(e.key==="ArrowRight") step(1);
    if(e.key.toLowerCase()==="f") toggleFlag();
  });
  window.addEventListener("beforeunload", save);
}
boot();
</script>
</body>
</html>
